<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Behandlungszimmer &#xB7; Tierarztpraxis</title>
<!-- ================================================================
     ARCHITEKTUR (eine Datei, klassische Scripts, Schichten von oben nach unten):
       SE-ADAPTER  - buendelt die SoftEngine-Kopplung (basisHTML_*, selib,
                     sendBWLinkIntern), Feldcodes, Lesen und Schreiben im Namespace SE.
                     Einzelne Legacy-Zugriffe aus APP/DOM sind noch vorhanden.
       UTILS       - allgemeine Helfer: Util (esc, Datum), Icon, DOM.
       APP         - IIFE mit Domain (Rows->Viewmodel), View (HTML-Builder) und
                     Controller (State, Render, Events, Live-Sync, Boot). Holt die
                     benoetigten Helfer oben per Import-Shim aus den Namespaces.
     Globale Flaeche = nur SE/Util/Icon/DOM + echte SoftEngine-Kontrakte (window.
       Erstellen/initData/ReloadData/__seConsume/__FF_render, __FF_SEVARS-Familie, SEDATA).
     REGEL: nur ASCII (Umlaute als \uXXXX in JS, &#...; in HTML); LF-only; die zwei
       SOFTENGINE-VAR-Marker bleiben erste/letzte Zeile.
     ================================================================ -->
  <style>
/* ===== DESIGN SYSTEM v13: tokens -> base -> utilities -> layout -> components -> states -> runtime ===== */
:root{
  /* Brand and semantic colors */
  --brand:#0b6f78;--brand-strong:#074f56;--brand-soft:#e3f0f1;
  --ok:#2e7d4f;--ok-soft:#f0f8f3;--ok-line:#c8dfd1;--ok-text:#236642;
  --danger:#b42318;--danger-soft:#fff7f6;--danger-line:#e0b2ac;--danger-text:#7f1d16;
  --warn:#8a6116;--warn-soft:#fffaf0;--warn-line:#e7d4aa;--warn-text:#65460e;
  --info:#2563b0;--info-soft:#eef4fc;--info-line:#d7e3f2;

  /* Surfaces and text */
  --bg:#e7ecef;--panel:#ffffff;--panel-muted:#f5f8f9;--panel-field:#ffffff;--panel-subtle:#f8fafb;
  --panel-head-a:#fafcfd;--panel-head-b:#f4f7f8;--panel-close:#f1f4f6;--panel-close-hover:#e6ebee;--panel-wizard-nav:#f4f7f8;--panel-wizard-line:#e7edf0;
  --text:#101f27;--text-2:#44535c;--text-3:#687781;--text-label:#5f6f77;--text-faint:#9aa6ad;
  --text-header:#0f2028;--text-owner:#5b6870;--text-status:#53636d;--text-muted-strong:#64727a;--text-table-head:#6c7a82;--text-doc:#15242b;--text-wizard-cat:#475861;--text-wizard-art:#7a8991;--text-price:#17313a;--text-wizard-price:#253941;--text-close:#64748b;

  /* Lines, effects, and sizing */
  --line:#cbd6db;--line-soft:#e2e9ec;--line-strong:#9fb0b8;--line-dash:#b7c5cc;
  --overlay:rgba(16,40,48,.34);--scroll:#c9d3d8;--shadow:0 1px 0 rgba(16,31,39,.03);--shadow-live:rgba(40,35,26,.30);--shadow-toast:0 4px 14px rgba(40,35,26,.12);
  --focus:0 0 0 2px rgba(11,111,120,.10);--focus-strong:0 0 0 2px rgba(11,111,120,.12);--inset-field:inset 0 1px 0 rgba(16,31,39,.03);
  --queue-op-line:rgba(138,97,22,.35);--queue-urgent-line:rgba(180,35,24,.40);--queue-active-muted:rgba(255,255,255,.86);
  /* Schrift-Kette, identisch in beiden Masken. "Segoe UI Variable Text" ist die feinere
     Fassung ab Windows 11 (besser abgestimmt auf 12-14px), Windows 10 faellt still auf
     "Segoe UI" zurueck. Tahoma steht ABSICHTLICH nicht drin: genau die Schrift, die
     SoftEngine global aufzwingt und die wir unten wieder ausschalten. Zahlen bleiben
     Consolas, weil schmal und untereinander stehend. Alle genannten Schriften sind lokal
     installiert -- es wird KEINE nachgeladen, das kann SoftEngine nicht. */
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,Arial,sans-serif;--mono:Consolas,"Segoe UI Mono","Courier New",monospace;
  --radius:2px;--gap:14px;--pad:16px;--head-h:44px;
  --body-cols:minmax(300px,360px) minmax(480px,1.2fr) minmax(340px,420px);--body-cols-compact:310px minmax(420px,1fr) 330px;
  --pos-cols:64px minmax(0,1fr) 54px 90px 28px;--wiz-cols:minmax(0,1fr) 82px 72px 112px;--wiz-cols-compact:minmax(0,1fr) 72px 64px 98px;
}

/* Base */
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--scroll) transparent;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--font);font-size:14px;line-height:1.35;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
/* SoftENGINE-Allgemein.css setzt global *{font-family:Tahoma}. Das schlaegt die von body
   GEERBTE Schrift auf allen unklassierten Elementen (div/span/Karten), weil eine *-Regel
   jedes Element direkt trifft und Vererbung immer verliert. Unser <style> laedt NACH SE,
   darum gewinnt unsere eigene *-Regel bei gleicher Spezifitaet. .mono und .wz-qty (0,1,0)
   bleiben unberuehrt, Formularfelder (0,0,1) ebenfalls. Im Browser ist SE-CSS nicht da --
   deshalb sah die Maske dort immer richtig aus und in SoftEngine trotzdem nach Tahoma.
   Uebernommen aus empfang, dort belegt seit 2026-06-18. 2026-08-04 */
*{font-family:var(--font);}
body>#room,#room{height:100%;}
input,select,textarea,button{font:inherit;color:var(--text);}textarea{font-family:inherit;}button{cursor:pointer;}
input::placeholder,textarea::placeholder{color:var(--text-faint);opacity:1;}
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-thumb{background:var(--scroll);border:2px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-track{background:transparent;}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* Utilities */
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1;letter-spacing:0;}
.ml-auto{margin-left:auto;}
.min-w-0{min-width:0;}
.flex-min{flex:1;min-width:0;}
.flex-0{flex:0 0 auto;}
.fill-col{flex:1;min-height:0;display:flex;flex-direction:column;}
.panel-fill{background:var(--panel);}
.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ta-r{text-align:right;}
.c-ok{color:var(--ok);}
.label-caps{font-weight:700;text-transform:uppercase;}
.txt-title{font-size:16px;font-weight:700;}
.txt-subtitle{font-size:13px;font-weight:700;}
.txt-sum{font-size:17px;font-weight:700;}
.txt-2{font-size:13px;color:var(--text-2);}
.txt-3{font-size:12px;color:var(--text-3);}
.txt-hint{font-size:11px;color:var(--text-faint);}
.empty-msg{padding:16px;font-size:12.5px;color:var(--text-faint);text-align:center;}
.empty-msg-wz{padding:24px 2px;font-size:13px;}
.empty-msg-verlauf{padding:14px 0;}

/* Layout */
.root{height:100vh;width:100%;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);}
.b-header{flex:0 0 76px;height:76px;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:18px;}
.alerts{flex:0 0 38px;min-height:38px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:5px 20px;background:var(--panel-subtle);border-bottom:1px solid var(--line);overflow:hidden;}
.qz{flex:0 0 40px;min-height:40px;display:flex;align-items:center;gap:10px;padding:6px 20px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;}
.pet-tabs2{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 20px 0;background:var(--bg);}
.body-grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:var(--body-cols);gap:var(--gap);padding:14px 20px;overflow:hidden;align-items:stretch;background:var(--bg);}
.col,.bz-col-l,.bz-col-r,.bz-col-c{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:var(--gap);}
.bz-col-l{min-width:260px;}
.bz-col-c{min-width:340px;}
.bz-col-r{min-width:300px;}
.empty-state{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:24px;color:var(--text-3);font-size:14px;text-align:center;}

/* Components: cards and buttons */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.card-hd,.doku-hd{height:var(--head-h);min-height:var(--head-h);padding:0 var(--pad);display:flex;align-items:center;gap:10px;background:linear-gradient(var(--panel-head-a),var(--panel-head-b));border-bottom:1px solid var(--line);flex:0 0 auto;}
.card-title,.doku-title{font-size:11.5px;letter-spacing:.55px;color:var(--text-label);line-height:1;}
.card-ft{height:44px;display:flex;align-items:center;padding:0 var(--pad);border-top:1px solid var(--line-soft);background:var(--panel-muted);}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius);font-weight:700;}
.btn-accent{height:38px;padding:0 18px;border:0;background:var(--brand);color:var(--panel);font-size:14px;}
.btn-dashed{width:100%;height:38px;border:1px dashed var(--line-dash);background:var(--panel-field);color:var(--brand);font-size:13px;gap:7px;}
.btn-close{flex:0 0 34px;width:34px;height:34px;border:0;background:var(--panel-close);color:var(--text-close);}
.btn-finish{border:0;background:var(--ok);color:var(--panel);gap:8px;white-space:nowrap;}
.btn-ghost{border:0;background:transparent;color:var(--text-3);font-size:12px;font-weight:400;}
.bz-finish{width:100%;height:48px;justify-content:center;flex:0 0 auto;font-size:15px;}

/* Components: header */
.b-avatar{flex:0 0 46px;height:46px;display:flex;align-items:center;justify-content:center;color:var(--brand);background:transparent;}
.b-avatar svg{width:40px;height:40px;stroke-width:1.85;}
.b-patient-line{display:flex;align-items:baseline;gap:9px;min-width:0;}
.b-patient-name{font-size:26px;font-weight:700;letter-spacing:-.15px;line-height:1.05;color:var(--text-header);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.b-patient-meta{font-size:13.5px;color:var(--text-2);white-space:nowrap;}
.b-owner-line{height:20px;margin-top:5px;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;font-size:12.5px;color:var(--text-owner);white-space:nowrap;overflow:hidden;}
.bz-owner-sep{width:1px;height:12px;background:var(--line);flex:0 0 auto;}
.bz-vorstellung-lbl{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--brand);}
.bz-vorstellung-txt{font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;}
.bz-hdr-meta{margin-left:auto;display:flex;align-items:stretch;border:1px solid var(--line);background:var(--panel);height:40px;flex:0 0 auto;}
.bz-seg{display:flex;align-items:center;justify-content:center;min-width:0;}
.bz-hdr-meta>.bz-seg+.bz-seg{border-left:1px solid var(--line);}
.bz-seg-vet{min-width:116px;padding:0 14px;}
.bz-seg-room{background:var(--info-soft);}
.bz-seg-date{background:var(--panel);}
.bz-seg-input{height:38px;border:0;background:transparent;padding:0 10px;outline:none;font-size:13px;}
.b-room-sel{color:var(--info);font-weight:700;}
.b-date{font-variant-numeric:tabular-nums;color:var(--text-2);}
.b-treatment-vet{font-size:13px;font-weight:700;white-space:nowrap;min-width:72px;text-align:center;}
.b-treatment-vet.is-hidden{display:block;visibility:hidden;}

/* Components: alerts and status */
.alerts-row{display:flex;align-items:center;gap:8px;min-width:0;}
.alerts-state{justify-content:flex-end;}
.alert-placeholder{display:block;width:1px;height:22px;opacity:0;}
.alert{height:26px;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-left-width:3px;background:var(--panel);padding:0 9px;font-size:12.5px;color:var(--text-2);white-space:nowrap;}
.alert svg,.top-status svg{width:14px;height:14px;flex:0 0 auto;}
.alert-k{font-weight:700;}
.alert-v{font-weight:600;color:inherit;}
.alert-danger{border-color:var(--danger-line);border-left-color:var(--danger);background:var(--danger-soft);color:var(--danger-text);}
.alert-warn{border-color:var(--warn-line);border-left-color:var(--warn);background:var(--warn-soft);color:var(--warn-text);}
.alert-ok,.alert-empty{border-color:transparent;background:transparent;color:var(--text-3);}
.top-status{height:26px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:0 8px;font-size:12px;color:var(--text-status);white-space:nowrap;}
.top-status b{font-size:12px;font-weight:700;}
.top-status.is-ok{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok-text);}
.top-status.is-open{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn-text);}

/* Components: queue and pet tabs */
.qz-lbl{font-size:11px;letter-spacing:.45px;color:var(--text-3);white-space:nowrap;flex:0 0 auto;}
.qz-group{display:flex;align-items:center;gap:7px;min-width:118px;flex:0 0 auto;}
.qz-div{width:1px;align-self:stretch;background:var(--line);margin:3px 4px;flex:0 0 auto;}
.qz-empty{height:28px;display:inline-flex;align-items:center;font-size:12.5px;color:var(--text-faint);}
.qz-item{height:28px;display:inline-flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--line);background:var(--panel);color:var(--text-2);font-size:13px;white-space:nowrap;flex:0 0 auto;border-radius:var(--radius);}
.qz-ic{display:inline-flex;color:var(--text-3);}
.qz-ic svg{width:16px;height:16px;}
.qz-name{font-weight:700;}
.qz-time{font-size:12px;color:var(--text-faint);font-variant-numeric:tabular-nums;}
.qz-op{border-color:var(--queue-op-line);}
.qz-op .qz-ic{color:var(--warn);}
.qz-urgent{border-color:var(--queue-urgent-line);}
.qz-urgent .qz-ic{color:var(--danger);}
.qz-wait{cursor:default;background:var(--panel-muted);border-style:dashed;color:var(--text-3);padding-right:4px;}
.qz-wait .qz-name{color:var(--text-2);}
.qz-hole{height:22px;border:0;background:var(--brand);color:var(--panel);font-size:11.5px;padding:0 8px;margin-left:2px;}
.pet-tab2{height:30px;gap:7px;padding:0 12px;border:1px solid var(--line);background:var(--panel);color:var(--text-3);font-size:12.5px;}
.pet-tab2 svg{width:16px;height:16px;}

/* Components: owner, notes, master data, and vaccination */
.halter-body{padding:14px var(--pad);background:var(--panel);}
.halter-head{height:42px;display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.b-avatar-sm{flex:0 0 32px;width:32px;height:32px;border:1px solid var(--line);background:var(--panel-muted);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border-radius:var(--radius);}
.halter-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.halter-number{font-size:12.5px;color:var(--text-label);}
.halter-contact{display:flex;flex-direction:column;margin-bottom:10px;}
.halter-contact-row{height:30px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line-soft);font-size:13.5px;color:var(--text-2);}
.halter-contact-row:last-child{border-bottom:0;}
.halter-contact-row.email{min-width:0;}
.ic-muted,.halter-contact-row svg,.note-toggle svg,.note-head svg{color:var(--text-faint);flex:0 0 auto;}
.note-toggle{width:100%;height:36px;display:flex;align-items:center;gap:8px;padding:0 11px;border:1px dashed var(--line-dash);background:var(--panel-field);border-radius:var(--radius);color:var(--text-3);}
.note-toggle-label{font-size:13px;font-weight:600;}
.note-empty{height:36px;display:flex;align-items:center;padding:0 11px;border:1px dashed transparent;font-size:13px;color:var(--text-faint);}
.note-body{min-height:80px;border:1px dashed var(--line-dash);background:var(--panel-field);border-radius:var(--radius);padding:10px 12px;}
.note-head{height:20px;display:flex;align-items:center;gap:7px;margin-bottom:6px;}
.note-lbl{font-size:11px;letter-spacing:.4px;color:var(--text-3);}
.note-text{font-size:13px;color:var(--text-2);line-height:1.45;}
.stamm-body{padding:6px var(--pad) 10px;}
.d-row{min-height:36px;display:flex;align-items:center;border-bottom:1px solid var(--line-soft);}
.d-row:last-child{border-bottom:0;}
.d-row-k{flex:0 0 118px;font-size:12.5px;color:var(--text-muted-strong);font-weight:500;}
.d-row-v{flex:1;min-width:0;font-size:13px;color:var(--text);font-weight:500;}
.seg{height:26px;display:inline-flex;align-items:center;background:var(--panel-muted);border:1px solid var(--line);border-radius:var(--radius);padding:2px;}
.seg-opt{height:20px;border:1px solid transparent;background:transparent;font-size:11.5px;padding:0 11px;border-radius:1px;color:var(--text-faint);}
.seg-opt.on-ok{background:var(--panel);border-color:var(--ok-line);color:var(--ok);}
.seg-opt.on-no{background:var(--panel);border-color:var(--line);color:var(--text-2);}
.impf-body{padding:5px var(--pad) 8px;}
.impf-row{height:38px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-soft);}
.impf-row:last-child{border-bottom:0;}
.impf-chk{display:flex;align-items:center;gap:9px;flex:1;min-width:0;font-size:13px;color:var(--text);cursor:pointer;}
.impf-chk input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer;flex:0 0 auto;margin:0;}
.impf-date{height:28px;width:134px;flex:0 0 auto;color:var(--text-2);font-size:12.5px;padding:0 8px;font-variant-numeric:tabular-nums;}
.impf-date:disabled{background:var(--panel-muted);color:var(--text-faint);}

/* Components: documentation and history */
.doku-col{flex:1.55 1 0;min-height:0;display:flex;}
.doku-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;padding:14px var(--pad);background:var(--panel);}
.doku-sec{min-height:0;display:flex;flex-direction:column;}
.doku-sec-lbl{height:20px;font-size:11px;letter-spacing:.6px;color:var(--text-muted-strong);}
.ctrl{border:1px solid var(--line);background:var(--panel);outline:none;border-radius:var(--radius);}
.ctrl:focus{border-color:var(--brand);box-shadow:var(--focus);}
.doku-sec-box{display:block;flex:1;min-height:0;width:100%;padding:10px 12px;font-size:13.5px;line-height:1.5;color:var(--text-doc);white-space:pre-wrap;overflow:auto;resize:none;box-shadow:var(--inset-field);}
.doku-sec-ta{font-family:var(--font);}
.verlauf-list{flex:1;min-height:74px;overflow-y:auto;padding:4px var(--pad) 10px;background:var(--panel);}
.verlauf-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft);}
.verlauf-date{flex:0 0 74px;font-size:12.5px;color:var(--text-label);}
.verlauf-text{font-size:13.5px;line-height:1.45;color:var(--text);}

/* Components: positions */
.leist-list{flex:1 1 auto;min-height:82px;overflow-y:auto;background:var(--panel);}
.l-head{height:30px;display:grid;grid-template-columns:var(--pos-cols);column-gap:10px;align-items:center;padding:0 var(--pad);border-bottom:1px solid var(--line);background:var(--panel-muted);font-size:10.5px;letter-spacing:.55px;color:var(--text-table-head);}
.l-row{min-height:42px;height:auto;display:grid;grid-template-columns:var(--pos-cols);column-gap:10px;align-items:start;padding:6px var(--pad);border-bottom:1px solid var(--line-soft);}
.l-code{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:center;font-size:11px;color:var(--text-3);}
.l-label{min-width:0;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.28;align-self:center;font-size:13.5px;font-weight:500;color:var(--text);word-break:break-word;}
.l-qty{align-self:center;text-align:right;color:var(--text-2);white-space:nowrap;}
.l-price{align-self:center;text-align:right;font-size:13.5px;font-weight:650;color:var(--text-price);white-space:nowrap;}
.leist-count{font-size:12px;color:var(--text-faint);}
.leist-actions{flex:0 0 54px;padding:8px var(--pad);border-top:1px solid var(--line-soft);background:var(--panel);}

/* Components: wizard */
.wz-ov2{display:none;position:fixed;inset:0;background:var(--overlay);z-index:80;align-items:center;justify-content:center;padding:24px;animation:fadein .15s ease;}
.wz-dialog{width:min(940px,96vw);height:min(650px,88vh);max-width:100%;max-height:88vh;background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;animation:fadein .2s ease;}
.wz-hd{flex:0 0 62px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:11px;}
.wz-icon{display:none;}
.wz-title-box{flex:1;min-width:0;}
.wz-title{color:var(--text);}
.wz-subtitle{font-size:13px;color:var(--text-3);}
.wz-toolbar{flex:0 0 46px;display:flex;align-items:center;padding:7px 18px;background:var(--panel-muted);border-bottom:1px solid var(--line);}
.wz-search{height:32px;width:100%;padding:0 10px;font-size:13px;}
.wz-body{flex:1;min-height:0;display:flex;}
.wz-cats{flex:0 0 190px;border-right:1px solid var(--line);background:var(--panel-wizard-nav);overflow-y:auto;padding:8px 0;}
.wz-cat{gap:8px;width:100%;height:42px;justify-content:flex-start;text-align:left;padding:0 14px;border:0;border-left:3px solid transparent;border-bottom:1px solid var(--panel-wizard-line);background:transparent;color:var(--text-wizard-cat);font-size:13px;}
.wz-items{flex:1;min-width:0;overflow-y:auto;padding:0 18px 10px;background:var(--panel);}
.wz-list-head{position:sticky;top:0;z-index:1;height:32px;display:grid;grid-template-columns:var(--wiz-cols);column-gap:12px;align-items:center;border-bottom:1px solid var(--line);background:var(--panel);font-size:10.5px;letter-spacing:.55px;color:var(--text-table-head);}
.wz-item{min-height:54px;height:auto;display:grid;grid-template-columns:var(--wiz-cols);column-gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft);}
.wz-item-label{display:block;min-width:0;overflow:hidden;line-height:1.2;}
.wz-artnr{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;line-height:1.15;margin-bottom:3px;color:var(--text-wizard-art);}
.wz-arttxt{display:block;max-width:100%;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.25;font-weight:600;color:var(--text);word-break:break-word;}
.wz-price{text-align:right;color:var(--text-wizard-price);white-space:nowrap;}
.wz-qty{height:30px;width:72px;text-align:right;padding:0 7px;font-family:var(--mono);font-size:12.5px;}
.wz-add{width:112px;height:30px;gap:5px;padding:0 8px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--brand);white-space:nowrap;}
.wz-ft{flex:0 0 56px;display:flex;align-items:center;gap:12px;padding:0 18px;border-top:1px solid var(--line-soft);background:var(--panel-muted);}

/* States */
.btn-accent:hover,.qz-hole:hover{filter:brightness(1.06);}
.btn-finish:hover{filter:brightness(.96);}
.btn-dashed:hover,.wz-add:hover{background:var(--brand-soft);border-color:var(--brand);}
.btn-close:hover{background:var(--panel-close-hover);}
.qz-item:hover{border-color:var(--line-strong);background:var(--panel-muted);color:var(--text);}
.qz-item.active,.pet-tab2.active{background:var(--brand);border-color:var(--brand);color:var(--panel);}
.qz-item.active .qz-ic,.qz-item.active .qz-time{color:var(--queue-active-muted);}
.qz-item.active.qz-urgent{background:var(--danger);border-color:var(--danger);}
.pet-tab2:hover{border-color:var(--brand);color:var(--text);}
.note-toggle:hover{border-color:var(--brand);color:var(--brand);}
.seg-opt:hover{color:var(--text-2);}
.btn-finish.disabled{opacity:.45;cursor:not-allowed;}
.wz-ov2.open{display:flex;}
.doku-sec-box:focus{box-shadow:var(--focus-strong);}
.impf-date:focus{box-shadow:none;}
.wz-cat:hover{background:var(--panel);}
.wz-cat.active{background:var(--panel);border-left-color:var(--brand);color:var(--brand);}

/* Runtime overlays */
.finish-toast{position:fixed;bottom:16px;right:16px;z-index:120;background:var(--ok-soft);border:1px solid var(--ok-line);color:var(--ok);padding:6px 12px;font-size:12px;font-weight:700;box-shadow:var(--shadow-toast);animation:fadein .2s ease;border-radius:var(--radius);}
.ls-banner{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:12px;background:var(--brand);color:var(--panel);padding:9px 14px;border-radius:var(--radius);box-shadow:0 18px 60px var(--shadow-live);font-size:13.5px;font-weight:700;}
.ls-banner button{border:0;border-radius:var(--radius);padding:6px 11px;background:var(--panel);color:var(--brand);font-weight:700;font-size:13px;}

/* Responsive */
@media (max-width:1100px){
  .body-grid{grid-template-columns:var(--body-cols-compact);padding:12px;gap:12px;}
  .b-header,.alerts,.qz,.pet-tabs2{padding-left:16px;padding-right:16px;}
  .b-patient-name{font-size:23px;}
  .bz-hdr-meta{transform:scale(.96);transform-origin:right center;}
  .wz-dialog{width:92vw;}
}
@media (max-width:880px){
  .wz-list-head,.wz-item{grid-template-columns:var(--wiz-cols-compact);column-gap:8px;}
  .wz-add{width:98px;}
  .wz-cats{flex-basis:160px;}
  .wz-qty{width:64px;}
}

<script>
/* ============================================================
   SCHICHT-NAMESPACES (global, bewusst klein gehalten)
   SE   = SoftEngine-Adapter (Bridge, Lesen, Schreiben, Feldkontrakt)
   Util = reine Helfer (esc, Datum/Format)
   Icon = SVG-Icons
   DOM  = DOM-Helfer
   Die App (unten) zieht sich die benoetigten Namen per Import-Shim in
   lokale Variablen -> App-Code bleibt unveraendert, globale Flaeche minimal.
   ============================================================ */
var SE = {}, Util = {}, Icon = {}, DOM = {};

(function () {
    try { selib.Json.InitializeERPConnection(); } catch (e) {
      try { if (typeof InitialisiereSchnittstelle === 'function') InitialisiereSchnittstelle(); } catch (e2) {}

    window.__FF_SEFILELOOP = [
      { "INDEX_NR": 0, "ALIAS": "Adr",             "ID": "ADR",       "FELDER": "2_8,3292_30,3322_40,1114_20,1330_60,2187_46,2170_11,110_10,2233_40,512_350" },

       sondern per ERPAPICALL LIEFERADRESSE.GET (ohne ADRNR = alle Saetze;
       verifiziert 2026-06-11). Antwort: SEDATA.Daten.ErpApiCall.Haustiere
       .Zeilen[] mit Schluesseln LFA_pos_len. */
    window.__FF_ERPAPICALL = [
      { "ID": "LIEFERADRESSE.GET", "ALIAS": "Haustiere", "FELDER": "LFA_2_8,LFA_10_8,LFA_400_30,LFA_430_30,LFA_460_500,LFA_960_10,LFA_970_1,LFA_971_30,LFA_2000_12,LFA_2012_60,LFA_2072_6,LFA_2078_1,LFA_2079_1,LFA_2080_30,LFA_2110_1,LFA_2111_10,LFA_2121_30,LFA_2151_1,LFA_2152_30,LFA_2182_10" }
    ];
    window.__FF_SEVARS = { "SEFILELOOP": window.__FF_SEFILELOOP, "ERPAPICALL": window.__FF_ERPAPICALL };

    (function () {
      var _seJson = JSON.stringify(window.__FF_SEVARS);
      function _isSEVarUrl(url) { return typeof url === 'string' && url.indexOf('SEvariablen') !== -1; }
      var _origOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {

          Object.defineProperty(self, 'status', { get: function () { return 200; }, configurable: true });

        }
        return _origSend.apply(this, arguments);
      };
      if (typeof window.fetch === 'function') {
        var _origFetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
          var url = typeof input === 'string' ? input : (input && input.url ? input.url : String(input));
          if (_isSEVarUrl(url)) {
            return Promise.resolve(new Response(_seJson, { status: 200, headers: { 'Content-Type': 'application/json; charset=utf-8' } }));
          }
          return _origFetch(input, init);
        };
      }
    })();

    window.__FF_ALIAS_TO_ID = {};
    (window.__FF_SEFILELOOP || []).forEach(function (e) {
      if (e.ALIAS && e.ID) window.__FF_ALIAS_TO_ID[e.ALIAS.toLowerCase()] = e.ID;
    });

    var __ffRenderTimer = null;
    function __ffRenderSoon() {
      if (__ffRenderTimer) return;
      __ffRenderTimer = setTimeout(function () {
        __ffRenderTimer = null;
        var f = window.__FF_render; if (typeof f === 'function') f();
      }, 0);
    }

    window.Erstellen = function () {
      try { if (typeof ResetDataBasis === 'function') ResetDataBasis(); } catch (e) {}
      try { if (typeof InitialisiereDatenBasis === 'function') InitialisiereDatenBasis(); } catch (e) {}
      __ffRenderSoon();
    };
    window.initData = window.Erstellen;
    window.ReloadData = function () { __ffRenderSoon(); };

    /* Lieferadress-Tiere (ERPAPICALL "Haustiere") als SEFileLoop-Alias
       'Haustiere' einhaengen, damit loadRows('Haustiere') unveraendert
       funktioniert. Tier-Filter gegen Lieferadressen:
       Kundennr (LFA_10_8) gefuellt UND (Rasse 430_30 ODER Geb. 960_10).
       ACHTUNG: die drei Codes stehen hier hart, weil dieser Block laeuft,
       bevor die FELD-Karte da ist. Aendern sich die Lieferadress-Positionen,
       muss BEIDES nachgezogen werden -- hier und in FELD.HT. */
    function __ffMergeTiere(daten) {
      try {
        var e = daten && daten.ErpApiCall;
        var k = e && (e.Haustiere || e.haustiere);
        var z = k && (k.Zeilen != null ? k.Zeilen : k.zeilen);
        if (!Array.isArray(z)) return;
        var tiere = [];
        for (var i = 0; i < z.length; i++) {
          var r = z[i] || {};
          var kunde = String(r.LFA_10_8 == null ? '' : r.LFA_10_8).trim();
          var rasse = String(r.LFA_430_30 == null ? '' : r.LFA_430_30).trim();
          var geb = String(r.LFA_960_10 == null ? '' : r.LFA_960_10).trim();
          if (!kunde || kunde === '0') continue;
          if (!rasse && !geb) continue;
          tiere.push(r);
        }
        if (!daten.SEFileLoop) daten.SEFileLoop = [];
        if (Array.isArray(daten.SEFileLoop)) daten.SEFileLoop.push({ ALIAS: 'Haustiere', Zeilen: tiere });
        else daten.SEFileLoop['Haustiere'] = { ALIAS: 'Haustiere', Zeilen: tiere };
      } catch (err) {}
    }

    window.__seConsume = function (raw) {
      var data = raw;
      if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { return; } }
      if (!data || typeof data !== 'object') return;
      if (data.Daten && (data.Daten.SEFileLoop || data.Daten.ErpApiCall)) {
        if (typeof window.SEDATA === 'undefined' || !window.SEDATA) window.SEDATA = {};
        __ffMergeTiere(data.Daten);
        window.SEDATA.Daten = data.Daten;
        try { if (typeof ResetDataBasis === 'function') ResetDataBasis(); } catch (e) {}
        try { if (typeof InitialisiereDatenBasis === 'function') InitialisiereDatenBasis(); } catch (e) {}
        __ffRenderSoon();
      } else if (window.__seIndexWaiting) {
        var __i = (typeof SE.deepIndex === 'function') ? SE.deepIndex(data, 0) : '';
        if (__i) window.__seRawIndex = __i;
      }
    };
    (function regSE(n) {
      n = n || 0;
      if (typeof basisHTML_REGISTER === 'function') {
        try { basisHTML_SetConsoleLog && basisHTML_SetConsoleLog(true, true); } catch (e) {}
        try { basisHTML_REGISTER(function (DATA) { window.__seConsume(DATA); }, document.title, '1.0'); } catch (e) {}
        return;
      }
      if (n < 400) setTimeout(function () { regSE(n + 1); }, 25);
    })();
    window.addEventListener('message', function (evt) {
      if (typeof basisHTML_REGISTER === 'function') return;
      try { var d = typeof evt.data === 'string' ? JSON.parse(evt.data) : evt.data; if (d && d.MSG) window.__seConsume(d.MSG.DATA); } catch (e) {}
    }, true);
})();

  <!-- ================================================================
     SE-ADAPTER 3/4 - SEDATA lesen  (getField, loadRows -> SE; esc -> Util)
     ================================================================ -->
<script>
(function () {
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function getField(row, code) {
  if (!row || !code) return '';
  var key = String(code).trim();
  var v = row[key];
  if (v != null && String(v).trim() !== '') return String(v).trim();
  for (var rk in row) {
    if (!Object.prototype.hasOwnProperty.call(row, rk)) continue;
    if (rk === key || rk.indexOf(key + '_') === 0 || rk.substring(rk.length - (key.length + 1)) === ('_' + key)) {
      var vv = row[rk];
      if (vv != null && String(vv).trim() !== '') return String(vv).trim();
    }
  }
  var raw = String(row.SATZNEU || row.SATZ || row.satzneu || row.satz || row.RAW || row.raw || '');
  var m = /^(\d+)_(\d+)$/.exec(code);
  if (raw && m) {
    var pos = parseInt(m[1], 10), len = parseInt(m[2], 10);
    if (!isNaN(pos) && !isNaN(len) && len > 0) { var sub = raw.substring(pos, pos + len).trim(); if (sub) return sub; }
  }
  return '';
}

function loadRows(alias) {
  try {
    if (typeof SEDATA === 'undefined' || !SEDATA || !SEDATA.Daten) return [];
    var t = String(alias).trim().toLowerCase();
    function aliasBase(v) { return String(v || '').trim().toLowerCase().replace(/_\d+$/, ''); }
    var tb = aliasBase(t);
    var aliasMap = window.__FF_ALIAS_TO_ID || {};
    var id = aliasMap[t] || aliasMap[tb] || '';
    if (!id) for (var ak in aliasMap) if (aliasBase(ak) === tb) { id = aliasMap[ak]; break; }
    var tid = String(id).trim().toLowerCase();
    function sameEntry(e, key) {
      key = String(key || '').trim().toLowerCase();
      if (key && (key === t || aliasBase(key) === tb || (tid && key === tid))) return true;
      var al = String((e && (e.ALIAS || e.alias)) || '').trim().toLowerCase();
      var eid = String((e && (e.ID || e.id)) || '').trim().toLowerCase();
      return (al && (al === t || aliasBase(al) === tb)) || (tid && eid === tid) || eid === t;
    }
    function rowsOf(entry) {
      if (Array.isArray(entry)) return entry;
      if (!entry) return [];
      var rows = entry.Zeilen != null ? entry.Zeilen : entry.zeilen != null ? entry.zeilen
        : entry.Saetze != null ? entry.Saetze : entry.saetze != null ? entry.saetze
        : entry.Rows != null ? entry.Rows : entry.rows != null ? entry.rows
        : entry.Daten != null ? entry.Daten : entry.daten != null ? entry.daten : [];
      if (typeof rows === 'string') { try { rows = JSON.parse(rows); } catch (e) { return []; } }
      return Array.isArray(rows) ? rows : [];
    }
    var sfl = SEDATA.Daten.SEFileLoop;
    if (sfl) {
      var entry = null;
      if (Array.isArray(sfl)) {
        for (var i = 0; i < sfl.length; i++) {
          var s = sfl[i] || {};
          if (sameEntry(s)) { entry = s; break; }
        }
      } else if (typeof sfl === 'object') {
        entry = sfl[alias] || sfl[String(alias).toUpperCase()] || sfl[String(alias).toLowerCase()] || (id ? sfl[id] : null);
        if (!entry) for (var k in sfl) {
          var e = sfl[k] || {};
          if (sameEntry(e, k)) { entry = e; break; }
        }
      }
      if (entry) {
        var rows = rowsOf(entry);
        if (rows.length) return rows;
      }
    }
    var direct = SEDATA.Daten[alias] || SEDATA.Daten[String(alias).toUpperCase()] || SEDATA.Daten[String(alias).toLowerCase()] || (id ? SEDATA.Daten[id] : null);
    if (!direct) for (var dk in SEDATA.Daten) if (sameEntry(null, dk)) { direct = SEDATA.Daten[dk]; break; }
    var directRows = rowsOf(direct);
    if (directRows.length) return directRows;
    var tab = SEDATA.Daten.Tabellen;
    if (tab) {
      var r = tab[alias] || tab[String(alias).toUpperCase()] || tab[String(alias).toLowerCase()];
      if (!r) {
        if (id) r = tab[id] || tab[id.replace(/^IDB/, '')] || tab[id.replace(/^IDBID/, 'ID')];
      }
      if (!r) for (var kk in tab) if (sameEntry(tab[kk], kk)) { r = tab[kk]; break; }

  return isNaN(n) ? NaN : n;
}
function fmt(n) { return '\u20AC ' + n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function priceLabel(raw) { var n = priceNum(raw); return isNaN(n) ? '\u2014' : fmt(n); }
function qtyNum(raw) {
  var s = String(raw == null ? '' : raw).trim();
  if (!s) return 1;
  s = s.replace(/\s/g, '').replace(',', '.');

  if (!isFinite(n) || n <= 0) n = 1;

}
function qtyText(raw) {

function jn(v) { var s = String(v == null ? '' : v).trim().toUpperCase(); return s === 'J' ? 'Ja' : (s === 'N' ? 'Nein' : ''); }
function roomValue(r) { return ROOM_PREFIX + ' ' + r; }
function normKey(v) {

}
function keyEq(a, b) {
  var aa = normKey(a), bb = normKey(b);

/* ===== Patienten-Helfer (Logik 1:1 aus dem Original) ===== */
function alterAus(geb) {
  var d = parseDatum(geb); if (!d) return '';
  var now = new Date(), jahre = now.getFullYear() - d.getFullYear(), mo = now.getMonth() - d.getMonth();
  if (mo < 0 || (mo === 0 && now.getDate() < d.getDate())) jahre--;
  if (jahre < 0) return '';
  if (jahre === 0) { var monate = mo + (mo < 0 ? 12 : 0); return monate + ' Mon.'; }
  return jahre + (jahre === 1 ? ' Jahr' : ' Jahre');
}
function petOf(termin, tiere) {
  var adr = getField(termin, FELD.TP.adr);
  var vid = String(getField(termin, FELD.TP.pindex) || '').trim();
  if (vid) for (var v = 0; v < tiere.length; v++) if (keyEq(getField(tiere[v], FELD.KH.besuchId), vid)) return tiere[v];
  for (var i = 0; i < tiere.length; i++) if (keyEq(getField(tiere[i], FELD.KH.adr), adr)) return tiere[i];
  return {};
}
function visitPets(termin, tiere) {
  var vid = String(getField(termin, FELD.TP.pindex) || '').trim(), out = [];
  if (vid) for (var i = 0; i < tiere.length; i++) if (keyEq(getField(tiere[i], FELD.KH.besuchId), vid)) out.push(tiere[i]);
  return out;
}
function visitHasPet(termin, petName, tiere) {
  if (!petName) return true;
  if (getField(termin, FELD.TP.name) === petName) return true;
  var vid = String(getField(termin, FELD.TP.pindex) || '').trim();
  if (vid) for (var i = 0; i < tiere.length; i++) {
    if (keyEq(getField(tiere[i], FELD.KH.besuchId), vid) &&
        (khKey(tiere[i]) === petName || getField(tiere[i], FELD.KH.name) === petName)) return true;
  }
  return false;
}
function petBehandlungForVisit(termin, petName, tiere) {
  var vid = String(getField(termin, FELD.TP.pindex) || '').trim();
  if (vid && petName) for (var i = 0; i < tiere.length; i++) {
    if (keyEq(getField(tiere[i], FELD.KH.besuchId), vid) &&
        (khKey(tiere[i]) === petName || getField(tiere[i], FELD.KH.name) === petName)) {
      var b = getField(tiere[i], FELD.KH.behandlung); if (b) return b;
    }
  }
  return getField(termin, FELD.TP.behandlung);
}
function khKey(p) { return getField(p, FELD.KH.tierAdresse) || getField(p, FELD.KH.name); }
function customerByAdr(adr) {
  if (!adr) return null;
  var rows = loadRows('Adr');
  for (var i = 0; i < rows.length; i++) if (keyEq(getField(rows[i], FELD.ADR.adr), adr)) return rows[i];
  return null;
}
function sexLabel(v) {
  var s = String(v == null ? '' : v).trim().toLowerCase();
  if (!s) return '';
  if (/kastr/.test(s)) return 'kastriert';
  if (s === 'm' || s === 'm\u00E4nnlich' || s === 'maennlich' || s === 'r\u00FCde' || s === 'ruede' || s === 'kater' || s === 'male') return 'm\u00E4nnlich';
  if (s === 'w' || s === 'weiblich' || s === 'h\u00FCndin' || s === 'huendin' || s === 'katze' || s === 'female') return 'weiblich';
  if (s === 'd' || s === 'divers') return 'divers';
  return '';
}
function sexSymbol(v) { var s = sexLabel(v); return s === 'm\u00E4nnlich' ? '\u2642' : (s === 'weiblich' ? '\u2640' : ''); }
function petMasterOf(adr, name, lfanr) {
  if (!adr) return {};
  var rows = loadRows('Haustiere'), byAdr = null;
  lfanr = String(lfanr || '').trim();
  if (lfanr) for (var k = 0; k < rows.length; k++) if (keyEq(getField(rows[k], FELD.HT.pindex), lfanr)) return rows[k];
  for (var i = 0; i < rows.length; i++) {
    if (!keyEq(getField(rows[i], FELD.HT.adr), adr)) continue;
    if (!byAdr) byAdr = rows[i];
    if (name && getField(rows[i], FELD.HT.name) === name) return rows[i];
  }
  return byAdr || {};
}

/* ===== Artikelstamm nach Warengruppe =====
   1:1 der Warengruppen-Stamm der Installation (Nutzer-Screenshot 2026-08-04).
   Dort heissen die Felder WGR-Nr 1_5 und Bezeichnung 32_30 -- notiert, damit die
   Maske die Reiter irgendwann selbst aus dieser Tabelle bauen kann, sobald die
   SEFILELOOP-Kennung des Warengruppen-Stamms belegt ist. Bis dahin: Nummern sind
   installationsspezifisch, aendert sich der Stamm, aendert sich NUR diese Liste.
   Reihenfolge = Alltag zuerst, Grosstier hinten. "wgr" ist eine Liste, damit ein
   Reiter mehrere Warengruppen einsammeln kann; aktuell braucht keiner das.
   Warengruppen, die in keinem Reiter stehen, sind im Wizard nicht erreichbar. */
var CATS = [
  { key: 'leistungen',   label: 'Leistungen',              code: 'Leist.',  wgr: ['3'] },
  { key: 'medikamente',  label: 'Medikamente',             code: 'Med.',    wgr: ['1'] },
  { key: 'impfstoffe',   label: 'Impfstoffe',              code: 'Impf',    wgr: ['4'] },
  { key: 'artikel',      label: 'Artikel',                 code: 'Art.',    wgr: ['2'] },
  { key: 'kleintier',    label: 'Kleintier',               code: 'Klein',   wgr: ['7'] },
  { key: 'futtermittel', label: 'Futtermittel',            code: 'Futter',  wgr: ['5'] },
  { key: 'labor',        label: 'Labor',                   code: 'Labor',   wgr: ['37'] },
  { key: 'koffer',       label: 'Koffer/St\u00FCcklisten', code: 'Koffer',  wgr: ['6'] },
  { key: 'allgemein',    label: 'Allgemein',               code: 'Allg.',   wgr: ['31'] },
  { key: 'alpaka',       label: 'Alpaka',                  code: 'Alpaka',  wgr: ['32'] },
  { key: 'kalb',         label: 'Kalb',                    code: 'Kalb',    wgr: ['33'] },
  { key: 'rind',         label: 'Rind',                    code: 'Rind',    wgr: ['34'] },
  { key: 'schafziege',   label: 'Schaf / Ziege',           code: 'Schaf',   wgr: ['35'] },
  { key: 'schwein',      label: 'Schwein',                 code: 'Schwein', wgr: ['36'] },
  { key: 'ferkel',       label: 'Ferkel',                  code: 'Ferkel',  wgr: ['361'] }
];
function catByKey(k) { for (var i = 0; i < CATS.length; i++) if (CATS[i].key === k) return CATS[i]; return CATS[0]; }
function wgrEq(a, b) {
  a = String(a == null ? '' : a).trim().replace(/^0+(?=\d)/, '');
  b = String(b == null ? '' : b).trim().replace(/^0+(?=\d)/, '');
  return a !== '' && a === b;
}
/* wgr = eine Warengruppe ODER eine Liste davon (concat vertraegt beides). */
function articlesByWgr(wgr) {
  var gesucht = [].concat(wgr);
  return loadRows('Artikel').map(function (a) {
    return { artikelnr: getField(a, FELD.ART.artikelnr), label: getField(a, FELD.ART.bezeichnung),
             wgr: getField(a, FELD.ART.warengruppe), brutto: getField(a, FELD.ART.vkBrutto) };
  }).filter(function (a) {
    if (!(a.artikelnr || a.label)) return false;
    for (var i = 0; i < gesucht.length; i++) if (wgrEq(a.wgr, gesucht[i])) return true;
    return false;
  });
}

function articleByNr(artikelnr) {
  var nr = String(artikelnr == null ? '' : artikelnr).trim();
  if (!nr) return null;
  for (var c = 0; c < CATS.length; c++) {
    var list = articlesByWgr(CATS[c].wgr);
    for (var i = 0; i < list.length; i++) if (String(list[i].artikelnr || '') === nr) return list[i];
  }
  return null;
}

/* ===== Gating-Entscheidung (Consent) -- einzige Quelle fuer block/evOK ===== */
function gatingOf(master, isOP) {
  var evOK = String(getField(master, FELD.HT.einverstaendnis) || '').trim().toUpperCase() === 'J';
  return {
    evOK: evOK,
    block: (isOP && !evOK) ? 'Einverst\xE4ndniserkl\xE4rung' : ''   /* hart gesperrt: Einverstaendnis bei OP */
  };
}

/* ===== Datenmodell des aktiven Patienten ===== */
function buildData(sel, pet, termine, tiere) {
  var adr = getField(sel, FELD.TP.adr);
  var useKH = !!(pet && (getField(pet, FELD.KH.tierAdresse) || getField(pet, FELD.KH.name)));
  var master = useKH ? petMasterOf(adr, getField(pet, FELD.KH.name), getField(pet, FELD.KH.tierAdresse)) : petMasterOf(adr, getField(sel, FELD.TP.name));
  var tierart = getField(master, FELD.HT.tierart) || (useKH ? getField(pet, FELD.KH.tierart) : getField(sel, FELD.TP.tierart)) || getField(sel, FELD.TP.tierart);
  var rasse = getField(master, FELD.HT.unterart) || (useKH ? getField(pet, FELD.KH.rasse) : getField(sel, FELD.TP.unterart)) || getField(sel, FELD.TP.unterart);
  var name = getField(master, FELD.HT.name) || (useKH ? getField(pet, FELD.KH.name) : getField(sel, FELD.TP.name)) || getField(sel, FELD.TP.name);
  var geb = getField(master, FELD.HT.geburtsdatum) || (useKH ? getField(pet, FELD.KH.geburtsdatum) : getField(sel, FELD.TP.geburtsdatum)) || getField(sel, FELD.TP.geburtsdatum);
  var alter = alterAus(geb);
  var cust = customerByAdr(getField(master, FELD.HT.adr) || adr);
  var owner = cust ? (getField(cust, FELD.ADR.vorname) + ' ' + getField(cust, FELD.ADR.nachname)).trim() : '';
  if (!owner) owner = (getField(sel, FELD.TP.vorname) + ' ' + getField(sel, FELD.TP.nachname)).trim();
  var gewichtRaw = getField(master, FELD.HT.gewicht);
  var gewichtD = /[0-9]/.test(gewichtRaw) ? (gewichtRaw.indexOf('kg') >= 0 ? gewichtRaw : gewichtRaw + ' kg') : '';
  var lineParts = [tierart, rasse, sexSymbol(getField(master, FELD.HT.geschlecht)), alter, gewichtD].filter(Boolean);
  var isOP = String(getField(sel, FELD.TP.prioritaet) || '').toLowerCase().indexOf('op') !== -1;
  var g = gatingOf(master, isOP);
  return {
    adr: adr, master: master, useKH: useKH, pet: pet, cust: cust,
    pidx: getField(sel, FELD.TP.pindex), belegnr: getField(sel, FELD.TP.belegnr),
    name: name, tierart: tierart, line: lineParts.join(' \u00B7 '), owner: owner,
    alter: alter, gewichtD: gewichtD,
    allergie: getField(master, FELD.HT.allergie),
    kastriert: getField(master, FELD.HT.kastriert),
    prio: String(getField(sel, FELD.TP.prioritaet) || '').toLowerCase(),
    isOP: isOP, evOK: g.evOK, gatingBlock: g.block,
    anlass: getField(sel, FELD.TP.behandlung),
    note: getField(cust, FELD.ADR.notizKunde),
    phone: getField(cust, FELD.ADR.mobil),
    email: getField(cust, FELD.ADR.email)
  };
}

/* ===== Sitzungs-Positionen ===== */
function stageFieldWrite(idbidRel, pindex, code, value, opts, row) {
  var pidx = SELECTED_PIDX, v = String(value == null ? '' : value);
  if (!pidx || !pindex || !code || /^TODO/.test(String(code))) return false;
  if (!SESSION_WRITES[pidx]) SESSION_WRITES[pidx] = {};
  var key = [idbidRel || '', String(pindex), String(code)].join('|');
  var prior = SESSION_WRITES[pidx][key];
  SESSION_WRITES[pidx][key] = { idbidRel: idbidRel || '', pindex: String(pindex), code: String(code), value: v, opts: opts || {}, sent: !!(prior && prior.sent && prior.value === v) };
  if (row) row[code] = v;
  return true;
}
function sendStagedWrites(pidx) {
  var writes = SESSION_WRITES[pidx] || {}, keys = Object.keys(writes);
  for (var i = 0; i < keys.length; i++) {
    var entry = writes[keys[i]];
    if (!entry || entry.sent) continue;
    if (!sePut(entry.idbidRel, entry.pindex, [[entry.code, entry.value]], entry.opts)) return false;
    entry.sent = true;
  }
  return true;
}
function curPositions() {
  var raw = SESSION_POS[SELECTED_PIDX] || [];
  var positions = raw.map(function (pp) {
    var q = qtyNum(pp.qty == null ? '1' : pp.qty);
    var total = isNaN(pp.price) ? NaN : pp.price * q;
    return {
      id: pp.id, code: pp.code, label: pp.label, qty: q,
      qtyLabel: qtyText(q),
      priceLabel: isNaN(pp.price) ? '\u2014' : fmt(pp.price),
      totalLabel: isNaN(total) ? '\u2014' : fmt(total)
    };
  });
  var sum = raw.reduce(function (a, pp) {
    var q = qtyNum(pp.qty == null ? '1' : pp.qty);
    return a + (isNaN(pp.price) ? 0 : pp.price * q);
  }, 0);
  return { positions: positions, sum: sum, totalLabel: fmt(sum) };
}

/* ===== Spalte 3a: Warnhinweise (aus Prioritaet + Allergie) ===== */
function warnHTML(d) {
  /* Topbar: medizinische Warnungen links, Verwaltungsstatus rechts. Bleibt als schlanker stabiler Slot sichtbar. */
  var evOK = !!d.evOK;
  var IC_ALERT = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>';
  var IC_OK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>';
  var IC_LOCK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>';
  function al(sev, icon, label, val) {
    return '<span class="alert alert-' + sev + '">' + icon + '<span class="alert-k">' + esc(label) + '</span>' + (val ? '<span class="alert-v">' + esc(val) + '</span>' : '') + '</span>';
  }
  function st(ok, label) {
    return '<span class="top-status ' + (ok ? 'is-ok' : 'is-open') + '">' + (ok ? IC_OK : IC_ALERT) + '<span>' + esc(label) + '</span><b>' + (ok ? 'Ja' : 'Nein') + '</b></span>';
  }
  var items = '';
  if (d.allergie) items += al('danger', IC_ALERT, 'Allergie', d.allergie);
  if (d.prio && d.prio.indexOf('notfall') !== -1) items += al('danger', IC_ALERT, 'Notfall', '');
  else if (d.prio && d.prio.indexOf('op') !== -1) items += al('warn', IC_ALERT, 'OP geplant', '');
  if (d.isOP && !evOK) items += al('danger', IC_LOCK, 'Abschluss gesperrt', 'Einverst\u00E4ndnis fehlt');
  else if (!evOK) items += al('warn', IC_ALERT, 'Einverst\u00E4ndnis offen', '');
  return '<div id="warnCard" class="alerts' + (items ? '' : ' alerts-empty') + '">' +
    '<div class="alerts-main alerts-row">' + (items || '<span class="alert-placeholder"></span>') + '</div>' +
    '<div class="alerts-state alerts-row">' + st(evOK, 'Einverst\u00E4ndnis') + '</div>' +
  '</div>';
}

/* ===== Gesamtaufbau (Voll-Render nur bei Patienten-/Raum-/Datums-Wechsel + Abschluss) ===== */
function outer(inner) {
  return '<div class="root">' + inner + '</div>';
}
/* ===== render-Helfer: Auswahl-Reconciliation (lesen + mutieren SELECTED_DATE/PIDX/PET_NAME) ===== */
function reconcileDate(termine) {
  var anyDate = termine.some(function (t) { return dateKey(getField(t, FELD.TP.datum)) !== ''; });
  if (!__dateUserSet && anyDate) {
    var dks = termine.map(function (t) { return dateKey(getField(t, FELD.TP.datum)); }).filter(function (k) { return k !== ''; }).sort();
    if (dks.indexOf(SELECTED_DATE) === -1) { var tk = todayKey(), fut = dks.filter(function (k) { return k >= tk; }); SELECTED_DATE = fut.length ? fut[0] : dks[dks.length - 1]; }
  }
}
function roomLists(termine) {
  var dayTermine = termine.filter(function (t) { return dateKey(getField(t, FELD.TP.datum)) === SELECTED_DATE; });
  var target = roomValue(SELECTED_ROOM);
  var warteliste = dayTermine.filter(function (t) { return String(getField(t, FELD.TP.zimmer)).trim() === 'Wartezimmer'; });
  warteliste.sort(function (a, b) { return timeMin(a) - timeMin(b); });
  var liste = dayTermine.filter(function (t) { return getField(t, FELD.TP.zimmer) === target && !SESSION_FINISHED[getField(t, FELD.TP.pindex)]; });
  liste.sort(function (a, b) { return timeMin(a) - timeMin(b); });
  return { warteliste: warteliste, liste: liste };
}
function reconcilePatient(liste) {
  var sel = null;
  for (var i = 0; i < liste.length; i++) { if (getField(liste[i], FELD.TP.pindex) === SELECTED_PIDX) { sel = liste[i]; break; } }
  if (!sel) { sel = liste[0]; SELECTED_PIDX = getField(sel, FELD.TP.pindex); }
  window.__SEL_TP = sel;
  return sel;
}
function reconcilePet(sel, tiere) {
  var vpets = visitPets(sel, tiere), activePet, petTabs = '';
  if (vpets.length) {
    activePet = null;
    for (var p = 0; p < vpets.length; p++) { if (khKey(vpets[p]) === SELECTED_PET_NAME) { activePet = vpets[p]; break; } }
    if (!activePet) { activePet = vpets[0]; SELECTED_PET_NAME = khKey(activePet) || ''; }
    petTabs = petTabsHTML(vpets, SELECTED_PET_NAME);
  } else { activePet = petOf(sel, tiere); }
  return { activePet: activePet, petTabs: petTabs };
}
function render() {
  var room = $('room'); if (!room) return;
  var termine = loadRows('Terminplaner');
  var tiere = loadRows('Kundenhaustiere');
  var haveData = seHaveData();

  reconcileDate(termine);
  var lists = roomLists(termine), warteliste = lists.warteliste, liste = lists.liste;

  if (!liste.length) {
    window.__SEL_TP = null; window.__CUR = {};
    var empty = '<div class="empty-state">' +
      (haveData ? ('Zimmer ' + esc(SELECTED_ROOM) + ' ist frei. ' + (warteliste.length ? 'Patient aus dem Wartezimmer holen (Leiste oben).' : 'Kein Patient an diesem Tag.')) : 'Warte auf SoftEngine-Daten \u2026') +
    '</div>';
    room.innerHTML = outer(emptyHeaderHTML(SELECTED_ROOM, SELECTED_DATE, BEDIENER) + warnHTML({ evOK:true, allergie:'', prio:'', isOP:false }) + selStripHTML(liste, warteliste, tiere, SELECTED_ROOM, SELECTED_PIDX) + empty);
    bindControls(); return;
  }

  var sel = reconcilePatient(liste);

  var pet = reconcilePet(sel, tiere), activePet = pet.activePet, petTabs = pet.petTabs;

  var d = buildData(sel, activePet, termine, tiere);
  window.__CUR = { tpIdx: d.pidx, htIdx: getField(d.master, FELD.HT.pindex), masterRow: d.master, khIdx: getField(d.pet, FELD.KH.pindex), petRow: d.pet, adr: d.adr, tier: d.name, belegnr: d.belegnr, note: d.note, gatingBlock: d.gatingBlock };
  window.__D = d;                                  /* fuer gezieltes Gating-Update ohne Voll-Render */

  var c = curPositions();
  var body = '<div class="body-grid">' +
    '<div class="col bz-col-l">' + halterHTML(d, NOTE_OPEN) + stammHTML(d) + impfHTML(d) + '</div>' +
    '<div class="bz-col-c">' + dokuColHTML(d) + verlaufHTML(d, termine, tiere, sel) + '</div>' +
    '<div class="col bz-col-r">' + leistungenHTML(c.positions, c.totalLabel) + finishBtnHTML(d.gatingBlock) + '</div>' +
  '</div>';

  room.innerHTML = outer(
    headerHTML(d, SELECTED_ROOM, SELECTED_DATE, BEDIENER) + warnHTML(d) + selStripHTML(liste, warteliste, tiere, SELECTED_ROOM, SELECTED_PIDX) + petTabs + body
  ) + wizardHTML(c.positions, c.totalLabel, WIZ_OPEN, WIZ_CAT, WIZ_SEARCH, haveData);
  bindControls();
}
window.__FF_render = render;

/* ===== Aktionen (Schreibwege 1:1 wie Original) ===== */
function saveDoku(key, value) {
  var cur = window.__CUR || {};
  var v = String(value == null ? '' : value).trim();
  if (key === 'anamnese') {
    var code = FELD.HT.anamnese;
    if (!code || /^TODO/.test(code) || !cur.htIdx) return;
    stageFieldWrite('', cur.htIdx, code, v, { putNr: LFA_PUT_NR }, cur.masterRow);
  } else {
    var kcode = FELD.KH[key];
    if (!kcode || /^TODO/.test(kcode) || !cur.khIdx) return;
    stageFieldWrite('ID0022', cur.khIdx, kcode, v, {}, cur.petRow);
  }
}
function saveImpf(code, value) {
  var cur = window.__CUR || {};
  var idx = cur.htIdx; if (!idx || !code) return;
  /* Die beiden 10er Impfdatums-Felder sind in der GUI echte Datumsfelder -> Art 'D'.
     Das 30er SHPPi-Datum bleibt Text ('L'), s. Kommentar an FELD.HT. */
  var vart = (code === FELD.HT.impfTollwutDat || code === FELD.HT.impfLeptoDat) ? SE_VART_DATUM : undefined;
  stageFieldWrite('', idx, code, String(value == null ? '' : value).trim(), { putNr: LFA_PUT_NR, defaultVart: vart }, cur.masterRow);
}
function consentSet(key, val) {
  var code = FELD.HT[key];
  if (!code || /^TODO/.test(code)) return;
  var idx = (window.__CUR || {}).htIdx; if (!idx) return;
  var master = (window.__CUR || {}).masterRow || {};
  var cur = String(getField(master, code) || '').trim().toUpperCase();
  if (cur === val) return;
  stageFieldWrite('', idx, code, val, { putNr: LFA_PUT_NR }, master);
  refreshGating();
}
function addPos(art) {
  var pidx = SELECTED_PIDX; if (!pidx) return;
  if (!SESSION_POS[pidx]) SESSION_POS[pidx] = [];
  var qtyRaw = art.qty == null ? '1' : art.qty;
  var qty = qtyNum(qtyRaw);
  SESSION_POS[pidx].push({ id: 'p' + (_posSeq++), code: art.code || '', label: art.label || art.artikelnr || '', price: priceNum(art.brutto), qty: qty, artikelnr: art.artikelnr || '', sent: false });
  refreshPositions();
}
function removePos(id) {
  var pidx = SELECTED_PIDX, positions = SESSION_POS[pidx] || [];
  for (var i = 0; i < positions.length; i++) {
    if (String(positions[i].id) === String(id)) { positions.splice(i, 1); refreshPositions(); return; }
  }
}
function finish() {
  var pidx = SELECTED_PIDX, cur = window.__CUR || {}, positions = SESSION_POS[pidx] || [];
  if (!pidx) { finishError('Kein Patient ausgewaehlt.'); return false; }
  if (cur.gatingBlock) { finishError(cur.gatingBlock + ' fehlt.'); return false; }
  if (!seCanSend()) { finishError('SoftEngine-Verbindung fehlt.'); return false; }
  if (positions.length && !cur.belegnr) { finishError('Belegnummer fehlt im Terminplaner (331_12).'); return false; }
  for (var i = 0; i < positions.length; i++) {
    if (!String(positions[i].artikelnr || '').trim()) { finishError('Position ohne Artikelnummer.'); return false; }
  }
  if (!sendStagedWrites(pidx)) { finishError('Feldschreiben fehlgeschlagen.'); return false; }
  for (i = 0; i < positions.length; i++) {
    if (positions[i].sent) continue;
    if (!sePutBelegPos(cur.belegnr, positions[i].artikelnr, qtyText(positions[i].qty))) { finishError('PUT 82 fuer eine Position fehlgeschlagen.'); return false; }
    positions[i].sent = true;
  }
  if (!sePut('ID0021', pidx, [[FELD.TP.zimmer, 'Abrechnung']])) { finishError('Status konnte nicht auf Abrechnung gesetzt werden.'); return false; }
  markerBump('Behandlungszimmer: abgeschlossen');
  delete SESSION_WRITES[pidx]; delete SESSION_POS[pidx];
  SESSION_FINISHED[pidx] = true; SELECTED_PIDX = '';
  finishToast(); render();
  return true;
}
function finishError(text) {
  var old = document.getElementById('finishToast'); if (old) old.remove();
  var el = document.createElement('div');
  el.id = 'finishToast'; el.className = 'finish-toast';
  el.style.background = 'var(--danger-soft)'; el.style.borderColor = 'var(--danger-line)'; el.style.color = 'var(--danger-text)';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(function () { if (el.parentNode) el.remove(); }, 5000);
}
function finishToast() {
  var old = document.getElementById('finishToast'); if (old) old.remove();
  var el = document.createElement('div');
  el.id = 'finishToast'; el.className = 'finish-toast';
  el.textContent = '\u2192 Abrechnung';
  document.body.appendChild(el);
  setTimeout(function () { if (el.parentNode) el.remove(); }, 4000);
}
function holePatient(pidx) {
  if (!pidx) return;
  var ziel = roomValue(SELECTED_ROOM);
  var rows = loadRows('Terminplaner');
  for (var i = 0; i < rows.length; i++) if (getField(rows[i], FELD.TP.pindex) === pidx) { rows[i][FELD.TP.zimmer] = ziel; break; }  /* optimistisch lokal */
  sePut('ID0021', pidx, [[FELD.TP.zimmer, ziel]]);
  markerBump('Behandlungszimmer: Patient geholt');
  SELECTED_PIDX = pidx; SELECTED_PET_NAME = ''; render();
}

/* ===== Event-Bindings (delegiert auf #room; bleibt ueber Re-Render erhalten) ===== */
function domClosest(node, selector, stopAt) {
  while (node && node !== stopAt) {
    if (node.nodeType === 1) {
      var m = node.matches || node.msMatchesSelector || node.webkitMatchesSelector || node.mozMatchesSelector;
      if (m && m.call(node, selector)) return node;
    }
    node = node.parentNode;
  }
  return null;
}
function bindControls() {
  var room = $('room'); if (!room || room.__bBound) return; room.__bBound = true;
  room.addEventListener('input', function (e) {
    var t = e.target;
    if (t && t.getAttribute && t.getAttribute('data-wiz-search') != null) { WIZ_SEARCH = t.value || ''; refreshWizardBody(); return; }
  });
  room.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'roomSelect') { SELECTED_ROOM = t.value; try { localStorage.setItem('bzimmer_room', SELECTED_ROOM); } catch (x) {} SELECTED_PIDX = ''; SELECTED_PET_NAME = ''; render(); return; }
    if (t.id === 'dateInput') { __dateUserSet = true; SELECTED_DATE = dateKey(t.value) || todayKey(); SELECTED_PIDX = ''; SELECTED_PET_NAME = ''; render(); return; }
    if (t.getAttribute && t.getAttribute('data-doku-key') != null) { saveDoku(t.getAttribute('data-doku-key'), t.value); return; }
    if (t.getAttribute && t.getAttribute('data-impf-flag') != null) {
      var _r = t.closest ? t.closest('.impf-row') : null, _de = _r ? _r.querySelector('.impf-date') : null;
      if (_de) { _de.disabled = !t.checked; if (t.checked) { try { _de.focus(); } catch (x) {} } }
      saveImpf(t.getAttribute('data-impf-flag'), t.checked ? 'J' : 'N'); return;
    }
    if (t.getAttribute && t.getAttribute('data-impf-date') != null) {
      var _m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(t.value || '')), _de2 = _m ? (_m[3] + '.' + _m[2] + '.' + _m[1]) : '';
      saveImpf(t.getAttribute('data-impf-date'), _de2); return;
    }
  });
  room.addEventListener('click', function (e) {
    var T = e.target;
    var remove = domClosest(T, '[data-pos-remove]', room); if (remove) { removePos(remove.getAttribute('data-pos-remove')); return; }
    if (domClosest(T, '[data-finish]', room)) { finish(); return; }
    var hp = domClosest(T, '[data-holen]', room); if (hp) { holePatient(hp.getAttribute('data-holen')); return; }
    var add = domClosest(T, '[data-add-nr]', room); if (add) {
      var row = domClosest(add, '.wz-item', room), qi = row ? row.querySelector('[data-wz-qty]') : null;
      var nr = add.getAttribute('data-add-nr') || '', a = articleByNr(nr) || {};
      addPos({ artikelnr: nr, label: a.label || nr, brutto: a.brutto, code: add.getAttribute('data-add-code'), qty: qi ? qi.value : '1' }); return;
    }
    if (domClosest(T, '[data-wiz-open]', room)) { openWizard(); return; }
    if (domClosest(T, '[data-wiz-close]', room)) { closeWizard(); return; }
    var cat = domClosest(T, '[data-wiz-cat]', room); if (cat) { WIZ_CAT = cat.getAttribute('data-wiz-cat'); refreshWizardBody(); return; }
    var ov = domClosest(T, '[data-wiz-overlay]', room); if (ov && T === ov) { closeWizard(); return; }
    var pat = domClosest(T, '[data-pat]', room); if (pat) { SELECTED_PIDX = pat.getAttribute('data-pat'); SELECTED_PET_NAME = ''; render(); return; }
    var ptab = domClosest(T, '[data-petname]', room); if (ptab) { SELECTED_PET_NAME = ptab.getAttribute('data-petname'); render(); return; }
    if (domClosest(T, '[data-note-toggle]', room)) { NOTE_OPEN = !NOTE_OPEN; refreshNote(); return; }
    var cs = domClosest(T, '[data-consent-set]', room); if (cs) { var kv = cs.getAttribute('data-consent-set').split(':'); consentSet(kv[0], kv[1]); return; }
  });
  room.addEventListener('keydown', function (e) {
    var t = e.target;
    if (!t || !t.getAttribute || t.getAttribute('data-wz-qty') == null || e.key !== 'Enter') return;
    var row = domClosest(t, '.wz-item', room), add = row ? row.querySelector('[data-add-nr]') : null;
    if (add) { e.preventDefault(); add.click(); }
  });
}

/* Bediener-Laden + String-Extraktor sind in den SE-Adapter gewandert (SE.getOperator). */

/* ===== Live-Sync v2 -- Marker-Tabelle ID0023 (Logik 1:1 aus Original, Banner in B-Farbe) =====
   Tabelle laut GUI-Neuanlage 2026-08-04: Index R0 0_10 (= Schreib-Index),
   Zeitstempel L 10_60 (das ist MARKER_FELD), Refresh L 70_60 (unbenutzt). */
var MARKER_IDB = 'ID0023', MARKER_FELD = '10_60', REFRESH_TOOL = '1951';
var __markerBase = -1, __markerBusy = false, __markerPending = false, __lastSync = 0, __lastActivity = Date.now();
['mousemove', 'mousedown', 'keydown', 'input', 'scroll', 'touchstart', 'dragstart'].forEach(function (evt) {
  window.addEventListener(evt, function () { __lastActivity = Date.now(); }, true);
});
function markerStamp(q) { var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; }; return q + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }
function markerBump(q) {
  seGetNewIndex(MARKER_IDB, function (idx) {
    if (!idx) { try { console.warn('[live-sync] Bump ohne Index (' + q + ')'); } catch (e) {} return; }
    sePut(MARKER_IDB, idx, [[MARKER_FELD, markerStamp(q)]]);
    if (__markerBase >= 0) __markerBase++;
  });
}
function userIsBusy() {
  if (WIZ_OPEN) return true;
  var ae = document.activeElement;
  if (ae && /TEXTAREA|INPUT|SELECT/.test(ae.tagName || '')) return true;
  if (Date.now() - __lastActivity < 15000) return true;
  return false;
}
function markerBanner(show) {
  var b = document.getElementById('lsBanner');
  if (!show) { if (b) b.remove(); return; }
  if (b) return;
  b = document.createElement('div');
  b.id = 'lsBanner'; b.className = 'ls-banner';
  b.innerHTML = '<span>Es gibt \u00C4nderungen.</span><button type="button">Jetzt aktualisieren</button>';
  b.querySelector('button').addEventListener('click', function () {
    __markerPending = false; __lastSync = Date.now(); markerBanner(false);
    seStartTool(REFRESH_TOOL, null, { debounce: true });
  });
  document.body.appendChild(b);
}
setInterval(function () {
  if (!seHaveData()) return;
  if (__markerPending && !userIsBusy() && !seSyncBusy() && Date.now() - __lastSync >= 12000) {
    __markerPending = false; __lastSync = Date.now(); markerBanner(false);
    try { console.log('[live-sync] Auto-Refresh'); } catch (e) {}
    seStartTool(REFRESH_TOOL, null, { debounce: true }); return;
  }
  if (__markerBusy || seSyncBusy()) return;
  __markerBusy = true;
  seCountRows(MARKER_IDB, function (n) {
    __markerBusy = false; n = parseInt(n, 10);
    if (isNaN(n)) return;
    if (__markerBase < 0) { __markerBase = n; return; }
    if (n < __markerBase) { __markerBase = n; return; }
    if (n > __markerBase) {
      try { console.log('[live-sync] fremde Aenderung (' + __markerBase + ' -> ' + n + ')'); } catch (e) {}
      __markerBase = n; __markerPending = true; markerBanner(true);
    }
  });
}, 5000);

/* ===== Boot ===== */
try { var __r = localStorage.getItem('bzimmer_room'); if (__r && ROOMS.indexOf(__r) !== -1) SELECTED_ROOM = __r; } catch (e) {}
seBoot(render);
(function tryBed(n) { n = n || 0; if (seCanSend()) { SE.getOperator(function (name) { BEDIENER = name; updateVet(); }); return; } if (n < 200) setTimeout(function () { tryBed(n + 1); }, 50); })();

})();
