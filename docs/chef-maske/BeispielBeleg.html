<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <div style="margin-top:0px">
        <div style="float:left; width:85%;">
            <SEHeaderV2 id="Head1V2"></SEHeaderV2>

            <SEGrid id="Grid1">
                <Child1>
                    <div>
                        <selibBlockHeader id="BlockHeaderAdressListe">
                            <selibDataList id="AdresseListe"></selibDataList>
                            </SEToggle>
                    </div>
                </Child1>
                <Child2>
                    <div>
                        <selibBlockHeader id="BlockHeaderAnschriftListe">
                            <selibDataList id="RechnungAnschriftListe"></selibDataList>
                        </selibBlockHeader>
                    </div>
                </Child2>
                <Child3>
                    <div>
                        <selibBlockHeader id="BlockHeaderLieferAnschriftListe">
                            <selibDataList id="LieferAnschriftListe"></selibDataList>
                            <div id="LieferAnschriftOhne" style="display:none; cursor: pointer;"
                                onclick="LieferadresseAuswaehlen()">
                                <p style="text-align:center;">Keine Abweichende Lieferanschrift hinterlegt</p>
                                <div id="KeineLieferAnschriftIcon" style="position:relative; top:30px; height:100px;">
                                </div>
                            </div>
                        </selibBlockHeader>
                    </div>
                </Child3>
            </SEGrid>

            <SEGrid id="Grid2">
                <Child1>
                    <selibBlockHeader id="BlockHeaderBelegInfoListe">
                        <selibDataList id="BelegInfosListe"></selibDataList>
                        <div style="padding-left:5px; padding-top:0px;">
                            <selibDataList id="DataListMaskeRabatt"></selibDataList>
                        </div>
                    </selibBlockHeader>
                </Child1>
                <Child2>
                    <selibBlockHeader id="BlockHeaderVersandInfoListe">
                        <selibDataList id="VersandInfosListe"></selibDataList>
                    </selibBlockHeader>
                </Child2>
                <Child3>
                    <selibBlockHeader id="BlockHeaderBelegSummenListe">
                        <selibDataList id="BelegSummenListe"></selibDataList>
                    </selibBlockHeader>
                </Child3>
            </SEGrid>

            <selibBlockHeader id="BlockHeaderPositionen">
                <SESpecial id="PosLeiste1"></SESpecial>
            </selibBlockHeader>

            <SEGrid id="Grid3">
                <Child1>
                    <selibBlockHeader id="BlockHeaderBelegInfo3Liste">
                        <selibDataList id="BelegInfo3Liste"></selibDataList>
                    </selibBlockHeader>
                </Child1>
                <CHild2>
                    <selibBlockHeader id="BlockHeaderMahnwesenInfoListe">
                        <selibDataList id="MahnwesenInfoListe"></selibDataList>
                    </selibBlockHeader>
                </CHild2>
            </SEGrid>
        </div>

        <div style="float:right; width:15%;">
            <div style="position:fixed;top:5px;">
                <SEFunktionsBox id="FuntkionsBoxFunktionen"></SEFunktionsBox>
            </div>
            <div style="position:fixed;bottom:5px;right:10px;">
                <SEBild id="Bild"></SEBild>
            </div>
        </div>
    </div>

    <script>
        selib.Json.InitializeERPConnection();
        var FLFANummer = "";
        var FLFANrName = "Keine Abweichende Lieferadresse hinterlegt";
        var FLFAStrasse = "";
        var FLFAPlzOrt = "";
        var FLFALand = "";
        var FLFAEMail = "";
        let FLFAAnschriftenzusatz = "ohne";
        var FLFAName = "";
        let FLFANameTr = "";

        function Erstellen() {
            ResetDataBasis();
            InitialisiereDatenBasis();
            CreateBlockHeader();
            CreateDataList();

            var iDHeader = "Head1V2";
            HeaderV2.SetEinstellung(iDHeader, {
                sticky: "true",
                smaller: "true"
            });

            var currencySymbol = SEDATA.Daten.Var.CURRENCYSTRING;

            var KdNrNameHeader = SEDATA.Daten.Var.BEL.BEL_11_8 + " : " + SEDATA.Daten.Var.BEL.BEL_3440_60;
            let DateHeute = new Date();
            var AngelegtAmHeader = "Angelegt von " + SEDATA.Daten.Var.ErfasstVonBedienerName + " am " + SEDATA.Daten.Var.BEL.BEL_519_10 + " um " + SEDATA.Daten.Var.BEL.BEL_529_5 + " - <span style='font-weight:bold;'>vor " + SEDATA.Daten.Var.ErfasstVorTagen + "</span>";

            var GeandertVorTagen = "vor " + SEDATA.Daten.Var.GeandertVorTagen;
            let DateGeandert = new Date(SEDATA.Daten.Var.BEL.BEL_537_10);
            if (DateHeute.getTime() == DateGeandert.getTime())
                GeandertVorTagen = "Heute";
            var GeandertAmHeader = "Geändert von " + SEDATA.Daten.Var.GeandertVonBedienerName + " am " + SEDATA.Daten.Var.BEL.BEL_537_10 + " um " + SEDATA.Daten.Var.BEL.BEL_547_5 + " - <span style='font-weight:bold;'>" + GeandertVorTagen + "</span>";

            var ArchiviertHeader = "Nicht archiviert";
            var BelegartText = "";
            if (SEDATA.Daten.Var.BelegartGruppeBezeichnung.length > 1)
                BelegartText = SEDATA.Daten.Var.BelegartGruppeBezeichnung;
            else {
                if (SEDATA.Daten.Var.BEL.BEL_2_1 == "N")
                    BelegartText = "Angebot";
                if (SEDATA.Daten.Var.BEL.BEL_2_1 == "A")
                    BelegartText = "Auftrag";
                if (SEDATA.Daten.Var.BEL.BEL_2_1 == "L" || SEDATA.Daten.Var.BEL.BEL_2_1 == "l")
                    BelegartText = "Lieferschein";
                if (SEDATA.Daten.Var.BEL.BEL_2_1 == "R" || SEDATA.Daten.Var.BEL.BEL_2_1 == "r")
                    BelegartText = "Rechnung";
                if (SEDATA.Daten.Var.BEL.BEL_2_1 == "G" || SEDATA.Daten.Var.BEL.BEL_2_1 == "g")
                    BelegartText = "Gutschrift";
                if (SEDATA.Daten.Var.BEL.BEL_2_1 == "b")
                    BelegartText = "Bestellung";
            }

            if (SEDATA.Daten.Var.BEL.BEL_1_1 != "N")
                ArchiviertHeader = "Archiviert";

            HeaderV2.AddHeaderDaten(iDHeader, [{
                art: "text",
                inhalt: [{
                    text: BelegartText + " " + SEDATA.Daten.Var.BEL.BEL_3_8,
                    style: "font-weight:bold; font-size:18px",
                    pos: {
                        top: 0,
                        left: 0
                    }
                }, {
                    text: KdNrNameHeader,
                    pos: {
                        top: "10px",
                        left: 0
                    }
                }, {
                    text: AngelegtAmHeader,
                    style: "color:grey; font-size:11px",
                    pos: {
                        top: "25px",
                        left: 0
                    }
                }, {
                    text: GeandertAmHeader,
                    style: "color:grey; font-size:11px",
                    pos: {
                        top: "5px",
                        left: 0
                    }
                },
                ],
                pos: {
                    left: "10px",
                    top: "10px",
                },
            },
            {
                art: "png",
                img: seimgpfad + "date.png",
                imgheight: "16px",
                pos: {
                    right: "5px",
                    top: "12px"
                }
            },
            {
                art: "png",
                img: seimgpfad + "archive.png",
                imgheight: "16px",
                pos: {
                    right: "-11px",
                    top: "37px"
                }
            },
            {
                art: "png",
                img: seimgpfad + "article.png",
                imgheight: "16px",
                pos: {
                    right: "-27px",
                    top: "62px"
                }
            },
            {
                art: "text",
                inhalt: [{
                    text: SEDATA.Daten.Var.BEL.BEL_19_10,
                    pos: {
                        top: "12px",
                        right: "0px"
                    }
                },
                {
                    text: ArchiviertHeader,
                    pos: {
                        top: "12px",
                        right: "0px"
                    }
                },
                {
                    text: SEDATA.Daten.Var.BEL.BEL_497_10,
                    pos: {
                        top: "12px",
                        right: "0px"
                    }
                },],
                pos: {
                    right: "-15px",
                    top: "0px",
                },
            }]);

            HeaderV2.CreateHeaders();

            var idFBox = "FuntkionsBoxFunktionen";
            FunktionsBox.AddBox(idFBox, [seimgpfad + "belegerfassung_ico_funktionInfosystemBeleg_16x16.png"],
                ["Infosystem Beleg (ALT+I)"], ["50014"], ["16px"], ["J"], ["0px"]);
            FunktionsBox.AddBox(idFBox, [seimgpfad + "belegerfassung_ico_funktionInfosystemAdresse_16x16.png"],
                ["Infosystem Adresse (SHIFT+F1)"], ["50012"], ["16px"], ["J"], ["0px"]);
            FunktionsBox.AddBox(idFBox, [seimgpfad + "belegerfassung_ico_funktionKaufhistorie_16x16.png"],
                ["Kaufhistorie"], ["387"], ["16px"], ["J"], ["0px"]);
            FunktionsBox.AddBox(idFBox, [seimgpfad + "belegerfassung_ico_funktionadressstammoeffnen_16x16.png"],
                ["Adressstamm öffnen"], ["50010"], ["16px"], ["J"], ["0px"]);
            FunktionsBox.AddBox(idFBox, [seimgpfad + "Belegerfassung_ICO_FunktionDrucken_16x16.png"],
                ["Drucken"], ["50073"], ["16px"], ["J"], ["0px"]);
            FunktionsBox.AddBox(idFBox, [seimgpfad + "Belegerfassung_ICO_FunktionBelegartWechseln_16x16.png"],
                ["Beleg wandeln"], ["55007"], ["16px"], ["J"], ["0px"]);
            FunktionsBox.AddBox(idFBox, [seimgpfad + "Belegerfassung_ICO_FunktionPAN_16x16.png"],
                ["PAN-Businessworkflows (ALT+P)"], ["197"], ["16px"], ["J"], ["0px"]);

            FunktionsBox.SetEinstellung(idFBox, {
                ueberschrift: "Funktionen",
                ueberschriftstyle: "padding-top:8px; margin-left:0px;",
            });

            Grid.SetEinstellung("Grid1", {
                art: "1",
                grid: "Child1,Child2,Child3",
                sestyle: "padding:3px",
            });

            Grid.SetEinstellung("Grid2", {
                art: "1",
                grid: "Child1,Child2,Child3",
                sestyle: "padding:3px",
            });

            Grid.SetEinstellung("Grid3", {
                art: "1",
                grid: "Child1,Child2",
                sestyle: "padding:3px",
            });

            var idPosLeiste = "PosLeiste1";
            var anzahlPositionen = SEDATA.Daten.SEFileLoop.Belegpositionen.Zeilen.length;

            for (var it = 0; it < anzahlPositionen; it++) {
                var posFarbe;
                if ((SEDATA.__WEBWARE__ == "0" && SEDATA.__FARBSCHEMA__ == "13") || (SEDATA.__WEBWARE__ == "1" && SEDATA.__FARBSCHEMA__ == "14")) {
                    posFarbe = "white";
                } else {
                    posFarbe = "black";
                }
                var belegposition = SEDATA.Daten.SEFileLoop.Belegpositionen.Zeilen[it];
                switch (belegposition.POS_2558_1) {
                    case "1":
                        posFarbe = "red"
                        break;
                    case "2":
                        posFarbe = "green"
                        break;
                    case "3":
                        posFarbe = "blue"
                        break;
                    case "4":
                        posFarbe = "gray"
                        break;
                }
                var PosObject = {
                    titel: belegposition.POS_18_25,
                    bezeichnung: belegposition.POS_45_60,
                    rabatt: belegposition.POS_3164_12,
                    farbe: posFarbe,
                }
                if (belegposition.POS_17_1 == "0") {
                    PosObject.img = belegposition.ARTIKELBILD;
                    PosObject.mwst = belegposition.POS_372_5;
                    PosObject.rohertrag = belegposition.POS_1401_12;
                    PosObject.rohertragzusatz = " " + currencySymbol;
                    PosObject.gesamtpreis = belegposition.POS_280_12;
                    PosObject.gesamtpreiszusatz = " " + currencySymbol;
                    PosObject.anzahl = belegposition.POS_164_8 + " " + belegposition.POS_689_5 + " ";
                    PosObject.preis = belegposition.POS_246_9 + " " + currencySymbol;
                    PosObject.tools = [
                        [seimgpfad + "Funktionsleiste_ICO_Infosystem_16x16.png", "AufrufPositionInfosystem", "margin-right:5px;", belegposition.POS_888_10],
                        [seimgpfad + "Infosystem_ICO_PositionLoeschen_16x16.png", "PositionLoeschen", "", SEDATA.Daten.Var.BEL.BEL_2_1 + "," + SEDATA.Daten.Var.BEL.BEL_3_8 + "," + belegposition.POS_18_25 + "," + belegposition.POS_128_6 + "," + belegposition.POS_11_6 + "," + belegposition.POS_1_1 + "," + belegposition.POS_645_10 + "," + belegposition.POS_0_1 + "," + belegposition.POS_17_1]
                    ];
                }
                SeErpSpecial.AddData(idPosLeiste, [PosObject]);
            }

            SeErpSpecial.SetEinstellung(idPosLeiste, { art: "Positionen" });
            SeErpSpecial.CreateSpecialFunction();

            Grid.CreateGrid();

            FunktionsBox.CreateFunktionsBox();
            var id = "Bild";
            Bild.SetEinstellung(id, {
                art: "2",
                align: "R",
                src: seimgpfad + "Belegerfassung_Wasserzeichen_Funktionen_150x150.png",
                scale: "150px",
                setitle: ""
            });
            Bild.CreateBild();

            if (FLFANummer > 0 || FLFAName.length > 0) {
                document.getElementById('LieferAnschriftOhne').style.display = "none";
                document.getElementById('LieferAnschriftListe').style.display = "block";
                document.getElementById('SETogTitleBlockHeaderLieferAnschriftListe').innerHTML = "Lieferanschrift (" + FLFANummer.trim() + ")";
            }
            else {
                document.getElementById('LieferAnschriftOhne').style.display = "block";
                document.getElementById('LieferAnschriftListe').style.display = "none";
                document.getElementById('SETogTitleBlockHeaderLieferAnschriftListe').innerHTML = "Lieferanschrift";
            }
            document.getElementById("KeineLieferAnschriftIcon").innerHTML = "";
            var erstellePTagFuerIconLieferAnschrift = document.createElement("p");
            erstellePTagFuerIconLieferAnschrift.style = "text-align:center;";
            document.getElementById("KeineLieferAnschriftIcon").appendChild(erstellePTagFuerIconLieferAnschrift);

            var iconKeineLieferAnschrift = document.createElement("img");
            iconKeineLieferAnschrift.src = seimgpfad + "Belegerfassung_ICO_KeineLieferanschrift_49x49.png";
            erstellePTagFuerIconLieferAnschrift.appendChild(iconKeineLieferAnschrift);
        }

        function CreateBlockHeader() {
            var allBlockHeader = [
                "BlockHeaderAdressListe",
                "BlockHeaderAnschriftListe",
                "BlockHeaderLieferAnschriftListe",
                "BlockHeaderBelegInfoListe",
                "BlockHeaderVersandInfoListe",
                "BlockHeaderBelegSummenListe",
                "BlockHeaderBelegInfo3Liste",
                "BlockHeaderMahnwesenInfoListe",
                "BlockHeaderPositionen"
            ]
            selib.BlockHeader.InitializeDataBase(allBlockHeader);

            selib.BlockHeader.SetData("BlockHeaderAdressListe", [{ art: 'title', data: { title: 'Adresse' } }]);

            selib.BlockHeader.SetData("BlockHeaderAnschriftListe", [{ art: 'title', data: { title: 'Rechnungsanschrift' } }]);

            selib.BlockHeader.SetData("BlockHeaderLieferAnschriftListe", [{ art: 'title', data: { title: 'Lieferanschrift' } }]);

            selib.BlockHeader.SetData("BlockHeaderBelegInfoListe", [{ art: 'title', data: { title: 'Beleginformationen' } }]);

            selib.BlockHeader.SetData("BlockHeaderVersandInfoListe", [{ art: 'title', data: { title: 'Versandinformationen' } }]);

            selib.BlockHeader.SetData("BlockHeaderBelegSummenListe", [{ art: 'title', data: { title: 'Belegsummen' } }]);

            selib.BlockHeader.SetData("BlockHeaderBelegInfo3Liste", [{ art: 'title', data: { title: 'Bankverbindung' } }]);

            selib.BlockHeader.SetData("BlockHeaderMahnwesenInfoListe", [{ art: 'title', data: { title: 'Mahnwesen' } }]);

            selib.BlockHeader.SetData("BlockHeaderPositionen", [{ art: 'title', data: { title: 'Positionen' } }]);

            selib.BlockHeader.SetSetting(allBlockHeader, { "delete": "false" });
            selib.BlockHeader.Create(allBlockHeader);
        }

        function CreateDataList() {
            var SEVarInfo = SEDATA.Daten.Var;
            var BelegInfo = SEVarInfo.BEL;
            var AdressInfo = SEVarInfo.ADR;
            var WindowInfo = SEVarInfo.WINDOW_VARIABLE;

            FLFAName = BelegInfo.BEL_4106_30;
            if (FLFAName.length > 0) {
                FLFANameTr = FLFAName;
                FLFANameTr.trim();
            }
            else
                FLFANameTr = FLFAName;
            if (BelegInfo.BEL_747_8 > 0 || FLFANameTr.length > 0) {
                FLFANummer = BelegInfo.BEL_747_8; + ":" + BelegInfo.REFRESH_BEL_747_8;
                FLFANrName = WindowInfo.BELERF_28100_100;
                FLFAStrasse = WindowInfo.BELERF_28300_100;
                FLFAPlzOrt = WindowInfo.BELERF_28400_100;
                FLFALand = SEVarInfo.RefreshFLFALand;
                FLFAEMail = BelegInfo.BEL_4449_60;

                let FLFAAnschriftenZusatzTr = "";
                if (WindowInfo.BELERF_28600_100.length > 0)
                    FLFAAnschriftenZusatzTr = WindowInfo.BELERF_28600_100.trim();

                if (FLFAAnschriftenZusatzTr.length > 0)
                    FLFAAnschriftenzusatz = WindowInfo.BELERF_28600_100;
            }

            var BelLieferAdresse = "-/-";
            if (BelegInfo.BEL_747_8 > 0) { BelLieferAdresse = SEVarInfo.RefreshLieferadresse; }

            var BelVersandart = "";
            if (BelegInfo.BEL_552_2 > 0) { BelVersandart = BelegInfo.BEL_552_2 + ":" + BelegInfo.REFRESH_BEL_552_2; }
            var BelVersandtarif = "";
            if (BelegInfo.BEL_554_2 > 0) { BelVersandtarif = BelegInfo.BEL_554_2 + ":" + BelegInfo.REFRESH_BEL_554_2; }

            var BelGesamtNebensumme = Number(BelegInfo.BEL_263_12.trim().replace(',', '.')) +
                Number(BelegInfo.BEL_275_12.trim().replace(',', '.')) +
                Number(BelegInfo.BEL_287_12.trim().replace(',', '.')) +
                Number(BelegInfo.BEL_299_12.trim().replace(',', '.')) +
                Number(BelegInfo.BEL_311_12.trim().replace(',', '.'));
            BelGesamtNebensumme = BelGesamtNebensumme.toString().replace('.', ',');
            BelGesamtNebensumme = MakeTausenderTrennerMitZweiNK(BelGesamtNebensumme);
            var BelGesamtbetrag = MakeTausenderTrennerMitZweiNK(BelegInfo.BEL_453_12);

            var TextBelegInfoListeLagerabang = "Geplanter Lagerabgang am";
            var TextBelegInfoListeVersandAm = "Voraussichtlicher Versand am";
            if (BelegInfo.BEL_2_1 == 'L' || BelegInfo.BEL_2_1 == 'R' || BelegInfo.BEL_2_1 == 'G') {
                TextBelegInfoListeLagerabang = "Tatsächlicher Lagerabgang am";
                TextBelegInfoListeVersandAm = "Versand erfolgt am";
            }

            var BelBankName = "-/-";
            var BankNameADR = WindowInfo.ADR_158_25;
            var BankNameBEL = BelegInfo.BEL_5369_25;

            if (BankNameBEL.length > 0)
                BelBankName = BankNameBEL;
            if (BankNameADR.length > 0)
                BelBankName = BankNameADR;

            var BelBankIban = "-/-";
            var BankIbanADR = WindowInfo.ADR_2426_40;
            var BankIbanBEL = BelegInfo.BEL_5417_40;

            if (BankIbanBEL.length > 0)
                BelBankIban = BankIbanBEL;
            if (BankIbanADR.length > 0)
                BelBankIban = BankIbanADR;

            var BelBankBic = "-/-";
            var BankBicADR = WindowInfo.ADR_2467_20;
            var BankBicBEL = BelegInfo.BEL_5457_20;

            if (BankBicBEL.length > 0)
                BelBankBic = BankBicBEL;
            if (BankBicADR.length > 0)
                BelBankBic = BankBicADR;

            var BelLetzteMahnstufe = BelegInfo.BEL_3229_1;
            var MwsLetzteMahnstufe = "-/-";
            if (BelLetzteMahnstufe > 0)
                MwsLetzteMahnstufe = BelLetzteMahnstufe;

            var MwsAufglfMahngebuehren = "-/-";
            var BelAufglfMahngbehuehren = BelegInfo.BEL_3240_12;
            if (BelAufglfMahngbehuehren.length > 0)
                MwsAufglfMahngebuehren = BelAufglfMahngbehuehren;

            var MwsLetztesMahndatum = "-/-";
            var BelLetztesMahndatum = BelegInfo.BEL_3230_10;
            BelLetztesMahndatum.replace(/ /g, "");
            if (BelLetztesMahndatum.length > 1)
                MwsLetztesMahndatum = BelLetztesMahndatum;

            var allDataList = [
                "AdresseListe",
                "RechnungAnschriftListe",
                "LieferAnschriftListe",
                "BelegInfosListe",
                "DataListMaskeRabatt",
                "VersandInfosListe",
                "BelegSummenListe",
                "BelegInfo3Liste",
                "MahnwesenInfoListe"
            ]
            selib.DataList.InitializeDataBase(allDataList);

            selib.DataList.SetData("AdresseListe", [
                { art: "data", data: { identifier: "Name", value: BelegInfo.BEL_11_8 + ":" + AdressInfo.ADR_3460_60, link: "SendBWTool('421')" } },
                { art: "data", data: { identifier: "Straße", value: AdressInfo.ADR_2187_46 + " " + AdressInfo.ADR_2170_11, link: "SendBWTool('53101')" } },
                { art: "data", data: { identifier: "Plz/Ort", value: AdressInfo.ADR_110_10 + " " + AdressInfo.ADR_2233_40 + " " + AdressInfo.ADR_2273_30, link: "SendBWTool('53101')" } },
                { art: "data", data: { identifier: "Land", value: SEVarInfo.RefreshAdresseLand, link: "SendBWTool('53101')" } },
                { art: "data", data: { identifier: "E-Mailadresse", value: AdressInfo.ADR_1330_60, link: "SendBWTool('53101')" } },
                { art: "data", data: { identifier: "Ansprechpartner", value: SEVarInfo.AnsprechpartnerRefresh, link: "SendBWTool('425')" } },
            ]);
            selib.DataList.SetData("RechnungAnschriftListe", [
                { art: "data", data: { identifier: "Name", value: BelegInfo.BEL_3440_60, link: "SendBWTool('53101')" } },
                { art: "data", data: { identifier: "Straße", value: WindowInfo.BELERF_26300_100, link: "SendBWTool('53101')" } },
                { art: "data", data: { identifier: "Plz/Ort", value: WindowInfo.BELERF_26400_100, link: "SendBWTool('53101')" } },
                { art: "data", data: { identifier: "Anschriftenzusatz", value: BelegInfo.BEL_1813_30, link: "SendBWTool('53101')" } },
                { art: "data", data: { identifier: "", value: BelegInfo.BEL_1843_30, link: "SendBWTool('53101')" } },
                { art: "data", data: { identifier: "Land", value: SEVarInfo.RefreshKundeLand, link: "SendBWTool('53101')" } },
                { art: "data", data: { identifier: "E-Mailadresse", value: BelegInfo.BEL_4449_60, link: "SendBWTool('53101')" } },

        function checkStrFeldInhalt(strWert) {
            var strReturn = "-/-";
            let strWertPruef = strWert.trim();

            if (strWertPruef === '' || strWertPruef.length < 1)
                strReturn = "-/-";
            else
                strReturn = strWert;

            return strReturn;
        }

        function checkDoubleFeldInhalt(strWert) {
            var strReturn = "-/-";
            let strWertPruef = strWert.trim();

            if (strWertPruef === '' || strWertPruef.length < 1)
                strReturn = "-/-";
            else
                strReturn = MakeTausenderTrennerMitZweiNK(strWert);

            let strWertFloat = strWert.replace(",", ".");

            if (parseFloat(strWertFloat) < 0.01 || parseFloat(strWertFloat) > 0.01) {
                return strReturn;
            }
            /* else {
                strReturn = "-/-";
            }
            */



        }
