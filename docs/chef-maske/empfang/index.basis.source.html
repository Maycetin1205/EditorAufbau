  <style>
/* ===== Designsprache "Kleintierpraxis am Lindenhof" ===== */
:root{
  /* ===== Palette aus Empfang.single.html (Design-Huelle B) ===== */
  --accent:#0E7C86;
  --bg:#EDF1F4;
  --surface:#ffffff;
  --ink:#16242C;
  --muted:#7C8A92;
  --line:#E7ECEF;
  --line-stark:#DCE3E8;
  --rot:#C0392B;
  --rot-soft:#FBE6E4;
  --amber:#B7791F;
  --amber-soft:#FBF6EC;
  --gruen:#2E8B57;
  --gruen-soft:#ECF6F0;
  --accent-soft:#E3F1F2;
  --accent-ink:#0B5E66;
  --schatten:0 1px 2px rgba(16,40,48,.05);
  --schatten-pop:0 18px 60px rgba(16,40,48,.28);
  --radius:5px;
}
*{box-sizing:border-box;}
html,body{height:100%;width:100%;margin:0;padding:0;overflow:hidden;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;}
html,body,button,input,select,textarea{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,Arial,sans-serif;}
/* SoftENGINE-Allgemein.css setzt global *{font-family:Tahoma} -> ueberschreibt unsere
   Schrift auf allen unklassierten Elementen (div/span/Karten). Unser <style> laedt NACH
   SE, darum gewinnt unsere eigene *-Regel bei gleicher Spezifitaet. Monospace (.num,
   Consolas; Spezifitaet 0,0,1) bleibt unberuehrt. Im Browser ist SE-CSS nicht da. 2026-06-18
   Kette erweitert 2026-08-04: "Segoe UI Variable Text" ist die feinere Fassung ab Windows 11
   (besser auf 12-14px abgestimmt), Windows 10 faellt still auf "Segoe UI" zurueck. Beide
   Masken tragen jetzt dieselbe Kette. Alle Schriften lokal installiert -- es wird KEINE
   nachgeladen, das kann SoftEngine nicht. */
*{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,Arial,sans-serif;}
.num{font-family:"Consolas",monospace;font-variant-numeric:tabular-nums;}
h1,h2,h3{margin:0;font-weight:650;}
.vapp{height:100vh;display:flex;flex-direction:column;}

/* ===== Kopfzeile ===== */
.vkopf{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex:0 0 auto;}
.vmarke{display:flex;align-items:center;gap:11px;}
.vmarke-zeichen{display:grid;place-items:center;width:36px;height:36px;background:var(--accent);color:#fff;border-radius:9px;font-size:18px;font-weight:700;}
.vmarke-text{display:flex;flex-direction:column;line-height:1.2;}
.vmarke-text strong{font-size:15px;letter-spacing:-0.01em;white-space:nowrap;}
.vmarke-text span{font-size:11.5px;color:var(--muted);}
.vdatum{display:flex;align-items:center;gap:6px;}

/* ===== Knoepfe & Eingaben ===== */
.vbtn{font:inherit;font-weight:550;cursor:pointer;border-radius:8px;border:1px solid var(--line-stark);background:var(--surface);color:var(--ink);padding:7px 13px;transition:background .12s,border-color .12s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.vbtn:hover{background:var(--accent-soft);border-color:var(--accent);}
.vbtn:disabled{opacity:.45;cursor:not-allowed;}
.vbtn-primaer{background:var(--accent);border-color:var(--accent);color:#fff;}
.vbtn-primaer:hover{background:var(--accent-ink);border-color:var(--accent-ink);}
.vbtn-leise{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);padding:5px 10px;font-size:12.5px;width:100%;justify-content:center;}
.vbtn-leise:hover{border-color:var(--accent);}
.vbtn-icon{padding:7px 11px;}
.vbtn-ghost{border-color:transparent;background:transparent;color:var(--muted);}
.vbtn-ghost:hover{background:var(--bg);color:var(--ink);}
.vinput{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-stark);border-radius:8px;padding:7px 10px;transition:border-color .12s,box-shadow .12s;}
.vinput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 18%,transparent);}
.varea{resize:vertical;min-height:50px;width:100%;}
.vwahl{font:inherit;text-align:left;width:100%;cursor:pointer;color:var(--muted);background:var(--surface);border:1px solid var(--line-stark);border-radius:8px;padding:7px 10px;}
.vwahl:hover{border-color:var(--accent);}
.vwahl.gewaehlt{color:var(--ink);font-weight:550;}
.vcheck{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500;}
.vcheck input{accent-color:var(--accent);width:16px;height:16px;}
.feedback{font-size:12.5px;font-weight:600;min-height:17px;}
.feedback.ok{color:var(--accent-ink);}
.feedback.err{color:var(--rot);}

/* ===== Werkzeugzeile ===== */
.vwerkzeuge{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px 4px;flex-wrap:wrap;flex:0 0 auto;}
.vwerkzeuge-rechts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.vstat-reihe{display:flex;gap:8px;flex-wrap:wrap;}
.vstat{display:flex;flex-direction:column;line-height:1.3;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:7px 14px;min-width:92px;}
.vstat strong{font-size:16.5px;font-weight:650;}
.vstat span{font-size:11px;color:var(--muted);}

/* ===== Kanban ===== */
.vboard{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:12px 20px 16px;}
.vspalte{display:flex;flex-direction:column;min-height:0;background:linear-gradient(to bottom,color-mix(in oklab,var(--sp) 9%,oklch(0.945 0.008 85)),oklch(0.945 0.008 85) 110px);border:1px solid color-mix(in oklab,var(--sp) 22%,var(--line));border-radius:12px;padding:10px 8px 8px;transition:border-color .12s;}
.vspalte-offen{--sp:#8d867a;--sp:oklch(0.6 0.02 75);}
.vspalte-wartezimmer{--sp:var(--amber);}
.vspalte-behandlung{--sp:var(--accent);}
.vspalte-abrechnung{--sp:var(--gruen);}
.vspalte-kopf{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface);border:1px solid color-mix(in oklab,var(--sp) 28%,transparent);border-radius:9px;box-shadow:var(--schatten);}
.vspalte-kopf h2{font-size:13.5px;font-weight:650;white-space:nowrap;}
.vspalte-zahl{margin-left:auto;font-family:"Consolas",monospace;font-size:12px;font-weight:600;background:color-mix(in oklab,var(--sp) 14%,var(--surface));border:1px solid color-mix(in oklab,var(--sp) 25%,transparent);border-radius:99px;padding:1px 8px;color:color-mix(in oklab,var(--sp) 75%,black);}
.vspalte-hinweis{margin:6px 6px 8px;font-size:11px;color:var(--muted);}
.vdot{width:9px;height:9px;border-radius:99px;flex:none;box-shadow:0 0 0 3px color-mix(in oklab,var(--sp) 22%,transparent);background:var(--sp);}
.vspalte-karten{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 2px 4px;}
.dropzone.is-drop-aktiv{outline:2px dashed var(--sp);outline-offset:-2px;border-radius:var(--radius);background:color-mix(in oklab,var(--sp) 7%,transparent);}
.vraum{border:1px solid var(--line);border-radius:var(--radius);background:color-mix(in oklab,var(--surface) 55%,transparent);padding:6px;display:flex;flex-direction:column;gap:6px;}
.vraum-kopf{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:0 3px;}
.vraum-zahl{margin-left:auto;font-family:"Consolas",monospace;font-size:11px;}
.vraum .vraum-karten{display:flex;flex-direction:column;gap:6px;min-height:34px;}
.vspalte-leer{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:26px 12px;border-radius:var(--radius);border:1px dashed transparent;}
.vspalte-leer strong{font-size:13px;font-weight:600;}
.vspalte-leer span{font-size:11.5px;color:var(--muted);max-width:200px;}
.vspalte-leer-ring{display:grid;place-items:center;width:38px;height:38px;margin-bottom:7px;border-radius:99px;background:var(--surface);border:1px solid color-mix(in oklab,var(--sp) 30%,var(--line));}
.vspalte-leer-ring .vdot{box-shadow:none;}

/* ===== Karte ===== */
.vkarte{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 11px;box-shadow:var(--schatten);cursor:grab;display:flex;flex-direction:column;gap:7px;}
.vkarte:active{cursor:grabbing;}
.vkarte.is-dragging{opacity:.55;}
.vkarte-kopf{display:flex;align-items:center;gap:8px;}
.vzeit{font-family:"Consolas",monospace;font-size:12.5px;font-weight:600;background:var(--bg);border-radius:6px;padding:1px 7px;}
.vprio{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:5px;padding:2px 7px;white-space:nowrap;}
.vprio-notfall{background:var(--rot-soft);color:var(--rot);}
.vprio-op{background:var(--accent-soft);color:var(--accent-ink);}
.vrel{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;}
.vrel-spaet{color:var(--rot);}
.vwarte{margin-left:auto;font-size:11.5px;color:var(--amber);font-weight:600;white-space:nowrap;}
.vkarte-tier{display:flex;align-items:center;gap:9px;}
.vavatar{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink);}
.vavatar .tier{width:64%;height:64%;}
.vkarte-tiertext{display:flex;flex-direction:column;line-height:1.25;min-width:0;}
.vkarte-tiertext strong{font-size:14.5px;}
.vkarte-rasse{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vpets{display:flex;flex-wrap:wrap;gap:4px;}
.vpet-chip{font-size:11px;font-weight:650;background:var(--accent-soft);color:var(--accent-ink);border-radius:5px;padding:2px 8px;}
.vkarte-grund{font-size:12.5px;}
.vkarte-fuss{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);}
.vkarte-fuss .nr{font-family:"Consolas",monospace;font-size:10.5px;}
.vstunde{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:5px 4px 0;}
.vstunde::after{content:'';flex:1;height:1px;background:var(--line-stark);}
.vjetzt{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;color:var(--rot);text-transform:uppercase;letter-spacing:.06em;padding:1px 4px;}
.vjetzt::before{content:'';width:8px;height:8px;border-radius:99px;background:var(--rot);flex:none;}
.vjetzt::after{content:'';flex:1;height:2px;border-radius:2px;background:var(--rot);}

/* ===== Toast ===== */
.vtoast{position:fixed;bottom:64px;right:18px;z-index:90;background:#3d3830;color:#f6f4ef;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:550;max-width:320px;}
.vtoast[hidden]{display:none;}

/* ===== Modale / Wizard ===== */
.vov{position:fixed;inset:0;background:oklch(0.25 0.02 75 / 0.4);background:rgba(46,42,36,.4);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:60;}
.vov.is-open{display:flex;}
.vov-vorn{z-index:75;}
.vmodal{background:var(--surface);border-radius:14px;box-shadow:var(--schatten-pop);width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden;}
.vmodal-kopf{display:flex;align-items:flex-start;justify-content:space-between;padding:16px 18px 0;}
.vmodal-titel{font-size:17px;font-weight:650;}
.vmodal-unter{font-size:12px;color:var(--muted);margin-top:2px;}
.vmodal-body{padding:14px 18px 18px;overflow-y:auto;}
.vmodal-fuss{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);}
.vform{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.vfeld{display:flex;flex-direction:column;gap:5px;min-width:0;}
.vfeld-span2{grid-column:span 2;}
.vfeld-label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.vpflicht{color:var(--rot);font-style:normal;}
.vknopfreihe{display:flex;gap:8px;align-items:center;}
.vstepper{display:flex;align-items:flex-start;margin-bottom:16px;}
.vstep{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;}
.vstep-dot{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface);color:var(--muted);border:1.5px solid var(--line-stark);z-index:1;font-family:"Consolas",monospace;}
.vstep-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.vstep::before,.vstep::after{content:'';position:absolute;top:12px;height:2px;background:var(--line-stark);z-index:0;}
.vstep::before{left:0;right:50%;}
.vstep::after{left:50%;right:0;}
.vstep:first-child::before,.vstep:last-child::after{display:none;}
.vstep.active .vstep-dot,.vstep.done .vstep-dot{background:var(--accent);color:#fff;border-color:var(--accent);}
.vstep.active .vstep-lbl{color:var(--ink);}
.vstep.done::before,.vstep.done::after,.vstep.active::before{background:var(--accent);}
.tm-step[hidden]{display:none;}
.vleer{color:var(--muted);font-size:12px;padding:14px 10px;text-align:center;border:1px dashed var(--line-stark);border-radius:var(--radius);}
.vgewaehlt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;font-size:13px;}
.vgewaehlt b{font-weight:650;}
.vpetliste{display:flex;flex-direction:column;gap:6px;max-height:230px;overflow-y:auto;}
.vpet{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;cursor:pointer;background:var(--surface);}
.vpet:hover{border-color:var(--accent);}
.vpet.is-sel{border-color:var(--accent);background:var(--accent-soft);}
.vpet-neu{justify-content:flex-start;font:inherit;color:var(--accent-ink);font-weight:600;}
.vpet input{accent-color:var(--accent);width:16px;height:16px;}
.vpet .vavatar{width:28px;height:28px;}
.vpet-id{display:flex;flex-direction:column;line-height:1.25;min-width:0;}
.vpet-id .n{font-weight:600;font-size:13.5px;}
.vpet-id .s{font-size:11.5px;color:var(--muted);}
.vbeh-zeile{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.vbeh-kopf{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;}
.vbeh-kopf .tier{width:16px;height:16px;color:var(--accent-ink);}
.vrev{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px;}
.vrev:last-child{border-bottom:none;}
.vrev-k{flex:0 0 110px;color:var(--muted);font-size:12px;}
.vrev-v{font-weight:600;min-width:0;}
.vrev-v i{color:var(--muted);font-weight:400;}

/* ===== Kunden-Picker ===== */
.vpicker{background:var(--surface);border-radius:14px;box-shadow:var(--schatten-pop);width:min(820px,100%);max-height:80vh;display:flex;flex-direction:column;overflow:hidden;padding:14px;gap:10px;}
.vpicker-kopf{display:flex;align-items:center;justify-content:space-between;}
.vpicker-kopf h3{font-size:15px;}
.vpicker-liste{flex:1;min-height:140px;overflow-y:auto;}
.vpicker-tab{width:100%;border-collapse:collapse;font-size:12.5px;}
.vpicker-tab th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);}
.vpicker-tab td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
.vpicker-tab tbody tr{cursor:pointer;}
.vpicker-tab tbody tr:hover{background:var(--accent-soft);}
.vpicker-tab .nm{font-weight:600;white-space:nowrap;}
.vpicker-tab .tel{font-family:"Consolas",monospace;white-space:nowrap;}
.vpicker-nichts{font-size:12px;color:var(--muted);padding:16px 9px;text-align:center;}

/* ===== Refresh & Banner ===== */
.vrefresh{position:fixed;right:18px;bottom:16px;z-index:20;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;border:1px solid var(--line-stark);border-radius:99px;background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;font-weight:550;cursor:pointer;transition:all .12s;}
.vrefresh:hover{background:var(--accent-soft);border-color:var(--accent);}
.ls-banner{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:12px;background:var(--accent);color:#fff;padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:600;}
.ls-banner button{border:0;border-radius:7px;padding:6px 11px;cursor:pointer;background:#fff;color:var(--accent-ink);font-weight:700;font-size:13px;}
.ls-banner button:hover{background:var(--accent-soft);}

@media (max-width:1180px){.vboard{grid-template-columns:repeat(2,1fr);overflow-y:auto;}.vspalte{min-height:300px;}}
  
/* ===== PATCH 1: Live-Uhr in der Kopfzeile ===== */
.vuhr{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;}
.vuhr-zeit{font-size:17px;font-weight:600;}
.vuhr-datum{font-size:11.5px;color:var(--muted);}

/* ===== PATCH 1: Kunden-Suchdropdown im Termin-Modal ===== */
.vpicker .vinput{flex:0 0 auto;}
.vsuche{position:relative;flex:1;}
.vsuche .vinput{width:100%;}
.vsuche-liste{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;background:var(--surface);border:1px solid var(--line-stark);border-radius:10px;max-height:240px;overflow-y:auto;padding:4px;display:flex;flex-direction:column;}
.vsuche-liste[hidden]{display:none;}
.vsuche-zeile{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;border:0;background:transparent;font:inherit;text-align:left;padding:7px 9px;border-radius:7px;cursor:pointer;}
.vsuche-zeile:hover{background:var(--accent-soft);}
.vsuche-zeile strong{font-size:13px;}
.vsuche-zeile span{font-size:11.5px;color:var(--muted);}
.vsuche-nichts{font-size:12px;color:var(--muted);padding:9px;text-align:center;}
/* Inline-Anlage Kunde/Tier (aufklappende Fieldsets) */
.vinline{margin:0;border:1px solid var(--accent);border-radius:var(--radius);background:var(--accent-soft);padding:10px 12px 12px;}
.vinline legend{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-ink);padding:0 6px;}
.vinput-row{display:flex;align-items:center;gap:8px;}
.vinput-row .vinput{flex:1;min-width:0;}
.vkastriert{flex:0 0 auto;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;}

/* ===== PATCH 2: Weiter-Knopf auf der Karte ===== */
.vkarte-aktion{display:flex;}
/* Patientenkartei (Klick auf Karte) */
.vkartei{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);z-index:50;background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(40,35,26,.12);display:flex;flex-direction:column;gap:10px;padding:14px 16px;}
.vkartei[hidden]{display:none;} /* display:flex wuerde sonst das hidden-Attribut ueberstimmen -> Kartei stand permanent offen */
.vakte-kopf{display:flex;gap:12px;align-items:flex-start;}
.vakte-kopf .vavatar{width:52px;height:52px;border-radius:4px;}
.vakte-kopf .vavatar .tier{width:80%;height:80%;}
.vakte-titel{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3;}
.vakte-titel strong{font-size:18px;letter-spacing:-0.01em;}
.vakte-titel span{font-size:12px;color:var(--muted);}

  <!-- ================================================================

     ================================================================ -->
<script>
    /* Zentraler Debug-/Fehlerlog. Still in Produktion (__FF_DEBUG=false), zur
       Laufzeit per window.__FF_DEBUG=true einschaltbar. Ersetzt stille catch{}-
       Bloecke an Stellen, wo echte Operationen scheitern koennen. */
    window.__FF_DEBUG = window.__FF_DEBUG || false;
    function logWarn(msg, err) {
      try { if (window.__FF_DEBUG && typeof console !== 'undefined' && console.warn) console.warn('[Empfang] ' + msg, err); } catch (e) {}
    }
    window.logWarn = logWarn;

    try { selib.Json.InitializeERPConnection(); } catch (e) {
      try { if (typeof InitialisiereSchnittstelle === 'function') InitialisiereSchnittstelle(); } catch (e2) {}
    }

    /* SEvariablen-Konfiguration ("Bestellzettel"): sagt SoftEngine beim Start,
       welche Tabellen/Felder die Maske laedt. KEINE Wegwerf-/Vorschau-Kopie --
       der laufende Code nutzt sie zur Laufzeit (Alias->ID via __FF_ALIAS_TO_ID,
       siehe getField). MUSS inhaltsgleich zu index.basis.SEvariablen.json
       bleiben; pruefung.mjs (Check 7) erzwingt das und schlaegt bei Abweichung rot. */
    window.__FF_SEFILELOOP = [
      { "INDEX_NR": 0, "ALIAS": "Adr",             "ID": "ADR",       "FELDER": "2_8,3292_30,3322_40,1114_20,1330_60,2187_46,2170_11,110_10,2233_40,512_350" },
      { "INDEX_NR": 0, "ALIAS": "Terminplaner",    "ID": "IDBID0021", "FELDER": "*" },
      { "INDEX_NR": 0, "ALIAS": "Kundenhaustiere", "ID": "IDBID0022", "FELDER": "*" },
      { "INDEX_NR": 0, "ALIAS": "Belege",          "ID": "BEL",       "FELDER": "1_1,2_1,3_8,11_8,246_9,280_12,330_10" }
    ];
    /* Tier-Stamm = Lieferadressen am Kunden. Kommen NICHT per SEFILELOOP,
       sondern per ERPAPICALL LIEFERADRESSE.GET (ohne ADRNR = alle Saetze;
       verifiziert 2026-06-11). Antwort: SEDATA.Daten.ErpApiCall.Haustiere
       .Zeilen[] mit Schluesseln LFA_pos_len. */
    window.__FF_ERPAPICALL = [
      { "ID": "LIEFERADRESSE.GET", "ALIAS": "Haustiere", "FELDER": "LFA_2_8,LFA_10_8,LFA_400_30,LFA_430_30,LFA_460_500,LFA_960_10,LFA_970_1,LFA_971_30,LFA_2000_12,LFA_2012_60,LFA_2072_6,LFA_2078_1,LFA_2079_1" }
    ];
    window.__FF_SEVARS = { "SEFILELOOP": window.__FF_SEFILELOOP, "ERPAPICALL": window.__FF_ERPAPICALL };

    (function () {
      var _seJson = JSON.stringify(window.__FF_SEVARS);
      function _isSEVarUrl(url) { return typeof url === 'string' && url.indexOf('SEvariablen') !== -1; }
      var _origOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {
        if (_isSEVarUrl(url)) { this.__ffIntercept = true; this.__ffJson = _seJson; }
        return _origOpen.apply(this, arguments);
      };
      var _origSend = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.send = function () {
        if (this.__ffIntercept) {
          var self = this;
          Object.defineProperty(self, 'readyState', { get: function () { return 4; }, configurable: true });
          Object.defineProperty(self, 'status', { get: function () { return 200; }, configurable: true });
          Object.defineProperty(self, 'responseText', { get: function () { return self.__ffJson; }, configurable: true });
          Object.defineProperty(self, 'response', { get: function () { return self.__ffJson; }, configurable: true });
          setTimeout(function () {
            if (typeof self.onreadystatechange === 'function') self.onreadystatechange();
            if (typeof self.onload === 'function') self.onload();
          }, 0);
          return;
        }
        return _origSend.apply(this, arguments);
      };
      if (typeof window.fetch === 'function') {
        var _origFetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
          var url = typeof input === 'string' ? input : (input && input.url ? input.url : String(input));
          if (_isSEVarUrl(url)) {
            return Promise.resolve(new Response(_seJson, { status: 200, headers: { 'Content-Type': 'application/json; charset=utf-8' } }));
          }
          return _origFetch(input, init);
        };
      }
    })();

    window.__FF_ALIAS_TO_ID = {};
    (window.__FF_SEFILELOOP || []).forEach(function (e) {
      if (e.ALIAS && e.ID) window.__FF_ALIAS_TO_ID[e.ALIAS.toLowerCase()] = e.ID;
    });

    var __ffRenderTimer = null;
    function __ffRenderSoon() {
      if (__ffRenderTimer) return;
      __ffRenderTimer = setTimeout(function () {
        __ffRenderTimer = null;
        var f = window.__FF_render; if (typeof f === 'function') f();
      }, 0);
    }

    window.Erstellen = function () {
      try { if (typeof ResetDataBasis === 'function') ResetDataBasis(); } catch (e) {}
      try { if (typeof InitialisiereDatenBasis === 'function') InitialisiereDatenBasis(); } catch (e) {}
      __ffRenderSoon();
    };
    window.initData = window.Erstellen;
    window.ReloadData = function () { __ffRenderSoon(); };

    /* Lieferadress-Tiere (ERPAPICALL "Haustiere") als SEFileLoop-Alias
       'Haustiere' einhaengen, damit loadRows('Haustiere') unveraendert
       funktioniert. Tier-Filter gegen Demo-/echte Lieferadressen:
       Kundennr (LFA_10_8) gefuellt UND (Rasse 430_30 ODER Geb. 960_10).
       ACHTUNG: die drei Codes stehen hier hart, weil dieser Block laeuft,
       bevor die FELD-Karte da ist. Aendern sich die Lieferadress-Positionen,
       muss BEIDES nachgezogen werden -- hier und in FELD.HT. */
    function __ffMergeTiere(daten) {
      try {
        var e = daten && daten.ErpApiCall;
        var k = e && (e.Haustiere || e.haustiere);
        var z = k && (k.Zeilen != null ? k.Zeilen : k.zeilen);
        if (!Array.isArray(z)) return;
        var tiere = [];
        for (var i = 0; i < z.length; i++) {
          var r = z[i] || {};
          var kunde = String(r.LFA_10_8 == null ? '' : r.LFA_10_8).trim();
          var rasse = String(r.LFA_430_30 == null ? '' : r.LFA_430_30).trim();
          var geb = String(r.LFA_960_10 == null ? '' : r.LFA_960_10).trim();
          if (!kunde || kunde === '0') continue;
          if (!rasse && !geb) continue;
          tiere.push(r);
        }
        if (!daten.SEFileLoop) daten.SEFileLoop = [];
        if (Array.isArray(daten.SEFileLoop)) daten.SEFileLoop.push({ ALIAS: 'Haustiere', Zeilen: tiere });
        else daten.SEFileLoop['Haustiere'] = { ALIAS: 'Haustiere', Zeilen: tiere };
      } catch (err) { logWarn('SEFILELOOP: Haustiere in daten mergen fehlgeschlagen', err); }
    }

    window.__seConsume = function (raw) {
      var data = raw;
      if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { return; } }
      if (!data || typeof data !== 'object') return;
      if (data.Daten && (data.Daten.SEFileLoop || data.Daten.ErpApiCall)) {
        if (typeof window.SEDATA === 'undefined' || !window.SEDATA) window.SEDATA = {};
        __ffMergeTiere(data.Daten);
        window.SEDATA.Daten = data.Daten;
        try { if (typeof ResetDataBasis === 'function') ResetDataBasis(); } catch (e) {}
        try { if (typeof InitialisiereDatenBasis === 'function') InitialisiereDatenBasis(); } catch (e) {}
        __ffRenderSoon();
      } else if (window.__seIndexWaiting) {
        window.__seRawResponse = data; /* Rohantwort behalten -- fuer nicht-numerische Returns wie Belegindex "0NL12345678" (1020) */
        var __i = (typeof window.seDeepIndex === 'function') ? window.seDeepIndex(data, 0) : '';
        if (__i) window.__seRawIndex = __i;
      }
    };
    (function regSE(n) {
      n = n || 0;
      if (typeof basisHTML_REGISTER === 'function') {
        try { basisHTML_SetConsoleLog && basisHTML_SetConsoleLog(true, true); } catch (e) {}
        try { basisHTML_REGISTER(function (DATA) { window.__seConsume(DATA); }, document.title, '1.0'); } catch (e) {}
        return;
      }
      if (n < 400) setTimeout(function () { regSE(n + 1); }, 25);
    })();
    window.addEventListener('message', function (evt) {
      if (typeof basisHTML_REGISTER === 'function') return;
      try { var d = typeof evt.data === 'string' ? JSON.parse(evt.data) : evt.data; if (d && d.MSG) window.__seConsume(d.MSG.DATA); } catch (e) {}
    }, true);
  </script>

  <!-- ================================================================
     BLOCK 2/9 - MECHANIK: SEDATA LESEN  (esc, getField, loadRows)
     ================================================================ -->
<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function getField(row, code) {
  if (!row || !code) return '';
  var key = String(code).trim();
  var v = row[key];
  if (v != null && String(v).trim() !== '') return String(v).trim();
  for (var rk in row) {
    if (!Object.prototype.hasOwnProperty.call(row, rk)) continue;
    if (rk === key || rk.indexOf(key + '_') === 0 || rk.substring(rk.length - (key.length + 1)) === ('_' + key)) {
      var vv = row[rk];
      if (vv != null && String(vv).trim() !== '') return String(vv).trim();
    }
  }
  var raw = String(row.SATZNEU || row.SATZ || row.satzneu || row.satz || row.RAW || row.raw || '');
  var m = /^(\d+)_(\d+)$/.exec(code);
  if (raw && m) {
    var pos = parseInt(m[1], 10), len = parseInt(m[2], 10);
    if (!isNaN(pos) && !isNaN(len) && len > 0) { var sub = raw.substring(pos, pos + len).trim(); if (sub) return sub; }
  }
  return '';
}

function loadRows(alias) {
  if (window.__FF_DEMO && (typeof SEDATA === 'undefined' || !SEDATA || !SEDATA.Daten)) {
    return window.__FF_DEMO[alias] || [];
  }
  try {
    if (typeof SEDATA === 'undefined' || !SEDATA || !SEDATA.Daten) return [];
    var t = String(alias).trim().toLowerCase();
    var sfl = SEDATA.Daten.SEFileLoop;
    if (sfl) {
      var entry = null;
      if (Array.isArray(sfl)) {
        for (var i = 0; i < sfl.length; i++) {
          var s = sfl[i] || {};
          if (String(s.ALIAS || s.alias || '').trim().toLowerCase() === t) { entry = s; break; }
        }
      } else if (typeof sfl === 'object') {
        entry = sfl[alias];
        if (!entry) for (var k in sfl) {
          if (String(k).trim().toLowerCase() === t) { entry = sfl[k]; break; }
          var e = sfl[k] || {};
          if (String(e.ALIAS || e.alias || '').trim().toLowerCase() === t) { entry = e; break; }
        }
      }
      if (entry) {
        var rows = entry.Zeilen != null ? entry.Zeilen : entry.zeilen != null ? entry.zeilen
          : entry.Saetze != null ? entry.Saetze : entry.saetze != null ? entry.saetze
          : entry.Rows != null ? entry.Rows : entry.rows != null ? entry.rows
          : entry.Daten != null ? entry.Daten : entry.daten != null ? entry.daten : [];
        if (Array.isArray(rows) && rows.length) return rows;
      }
    }
    var tab = SEDATA.Daten.Tabellen;
    if (tab) {
      var r = tab[alias] || tab[String(alias).toUpperCase()] || tab[String(alias).toLowerCase()];
      if (!r) {
        var id = (window.__FF_ALIAS_TO_ID || {})[t];
        if (id) r = tab[id] || tab[id.replace(/^IDB/, '')] || tab[id.replace(/^IDBID/, 'ID')];
      }
      if (!r) for (var kk in tab) if (kk.trim().toLowerCase() === t) { r = tab[kk]; break; }
      if (r) {
        var rr = r.Zeilen != null ? r.Zeilen : r.zeilen != null ? r.zeilen : r.Saetze != null ? r.Saetze
          : r.saetze != null ? r.saetze : r.Rows != null ? r.Rows : r.rows != null ? r.rows
          : r.Daten != null ? r.Daten : r.daten != null ? r.daten : r;
        if (typeof rr === 'string') { try { rr = JSON.parse(rr); } catch (e) { return []; } }
        if (Array.isArray(rr)) return rr;
      }
    }
    return [];
  } catch (e) { return []; }
}

window.esc = esc;
window.getField = getField;
window.loadRows = loadRows;

  </script>

  <!-- ================================================================
     BLOCK 3/9 - MECHANIK: DATUM & UHRZEIT  (todayKey, dateKey, addDays, parseDatum)
     ================================================================ -->
<script>
function _pad2(n) { return (n < 10 ? '0' : '') + n; }

function todayKey() {
  var d = new Date();
  return d.getFullYear() + '-' + _pad2(d.getMonth() + 1) + '-' + _pad2(d.getDate());
}

function dateKey(s) {
  s = String(s == null ? '' : s).trim();
  var m = /^(\d{1,2})[.](\d{1,2})[.](\d{4})$/.exec(s);
  if (m) return m[3] + '-' + _pad2(+m[2]) + '-' + _pad2(+m[1]);
  m = /^(\d{4})[-.](\d{1,2})[-.](\d{1,2})$/.exec(s);
  if (m) return m[1] + '-' + _pad2(+m[2]) + '-' + _pad2(+m[3]);
  return '';
}

function addDays(iso, delta) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
  if (!m) return todayKey();
  var d = new Date(+m[1], +m[2] - 1, +m[3]);
  d.setDate(d.getDate() + (delta || 0));
  return d.getFullYear() + '-' + _pad2(d.getMonth() + 1) + '-' + _pad2(d.getDate());
}

function parseDatum(s) {
  s = String(s || '').trim();
  var m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(s);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  return null;
}

window._pad2 = _pad2;
window.todayKey = todayKey;
window.dateKey = dateKey;
window.addDays = addDays;
window.parseDatum = parseDatum;

  </script>

  <!-- ================================================================
     BLOCK 4/9 - MECHANIK: SOFTENGINE-SCHREIBWEG  (seSend, seStartTool, seGetNewIndex-Warteschlange, sePut, seCountRows)
     ================================================================ -->
<script>
var SE_PUT_NR = '174';
var SE_GET_NEW_NR = '640';
/* Feld-Art im PUT_RELATION: 'L' Text, 'D' Datum, 'Z' Zeit. Muss zur
   Feldverarbeitung in der SE-GUI passen -- ein Datumsfeld mit 'L' beschrieben
   bekommt Text hineingeschrieben. Jeder Schreibweg, der ein Datums- oder
   Zeitfeld anfasst, MUSS die Art mitgeben (dritter Wert im Job). */
var SE_VART = 'L';
var SE_VART_DATUM = 'D';
var SE_VART_ZEIT = 'Z';

function seSend(code, obj) {
  try {
    if (typeof basisHTML_SND_MSG === 'function') { basisHTML_SND_MSG(code, obj); return true; }
  } catch (e) { console.warn('[SE] seSend', e); }
  return false;
}

var __seToolBusy = false;
function seStartTool(nr, params, opts) {
  nr = String(nr || '');
  if (!nr) return false;
  opts = opts || {};
  if (opts.debounce) {
    if (__seToolBusy) return false;
    __seToolBusy = true;
    setTimeout(function () { __seToolBusy = false; }, opts.debounceMs || 1500);
  }
  var p = Array.isArray(params) ? params : (params != null ? [params] : []);
  try {
    if (typeof sendBWLinkIntern === 'function') {
      var link = '0,START_TOOL,' + nr;
      if (p.length) link += ',' + p.map(function (x) { return encodeURIComponent(String(x)); }).join(',');
      sendBWLinkIntern(link);
      return true;
    }
  } catch (e) { logWarn('seStartTool: BW-Link senden fehlgeschlagen, faellt auf obj-Weg zurueck', e); }
  var obj = { NR: nr };
  if (p.length) obj.PARAMS = p;
  return seSend('START_TOOL', obj);
}

function seDeepIndex(obj, depth) {
  depth = depth || 0;
  if (depth > 6 || obj == null) return '';
  if (typeof obj === 'number') return obj > 0 ? String(obj) : '';
  if (typeof obj === 'string') { var t = obj.trim(); return /^\d{1,9}$/.test(t) ? t : ''; }
  if (typeof obj !== 'object') return '';
  var pref = ['RESULT', 'result', 'PINDEX', 'pindex', 'INDEX', 'index', '0_10', 'KEY', 'key', 'ID', 'id'];
  for (var i = 0; i < pref.length; i++) {
    if (Object.prototype.hasOwnProperty.call(obj, pref[i])) {
      var v = seDeepIndex(obj[pref[i]], depth + 1);
      if (v) return v;
    }
  }
  if (Array.isArray(obj)) {
    for (var a = 0; a < obj.length; a++) { var r = seDeepIndex(obj[a], depth + 1); if (r) return r; }
    return '';
  }
  for (var k in obj) {
    if (!Object.prototype.hasOwnProperty.call(obj, k)) continue;
    var rr = seDeepIndex(obj[k], depth + 1);
    if (rr) return rr;
  }
  return '';
}

function seMsgKeys() {
  return (typeof window.SEDATA !== 'undefined' && window.SEDATA)
    ? Object.keys(window.SEDATA).filter(function (k) { return /^Message\d+$/.test(k); })
    : [];
}

function seNewIndex(beforeSet) {
  var keys = seMsgKeys().filter(function (k) { return !beforeSet[k]; });
  keys.sort(function (a, b) { return parseInt(b.slice(7), 10) - parseInt(a.slice(7), 10); });
  for (var i = 0; i < keys.length; i++) {
    var v = window.SEDATA[keys[i]];
    var idx = (v && v.RESULT != null) ? seDeepIndex(v.RESULT, 0) : '';
    if (!idx) idx = seDeepIndex(v, 0);
    if (idx) return idx;
  }
  return '';
}

/* 1020 (Neuanlage Belegkopf) gibt den Belegindex BEL_0_11 zurueck, z.B.
   "0NL12345678" = Jahr|Status|Belegart|Belegnummer. ALPHANUMERISCH -- seDeepIndex
   (nur Ziffern) findet es nicht, darum ein eigener Scanner. */
function findBelegindex(obj, depth) {
  depth = depth || 0;
  if (depth > 6 || obj == null) return '';
  if (typeof obj === 'string') {
    var t = obj.trim();
    /* Belegindex = 1-3 Praefix-Zeichen (Jahr/Status/Belegart, Mix aus Ziffer+Buchstabe,
       MIND. ein Buchstabe) + optional Leerzeichen + Nummer am Ende. Deckt "0NL20252188"
       (alter Zeitraum, 8-stellig) UND "LNL       5" (neuer Belegzeitraum, kurze Nummer)
       ab. Der Pflicht-Buchstabe schliesst reine Zahlen (z.B. Kundennr 10011) aus. */
    return /^(?=.*[A-Za-z])[0-9A-Za-z]{1,3}\s*\d+$/.test(t) ? t : '';
  }
  if (typeof obj !== 'object') return '';
  var pref = ['BEL_0_11', '0_11', 'RESULT', 'result'];
  for (var p = 0; p < pref.length; p++) {
    if (Object.prototype.hasOwnProperty.call(obj, pref[p])) {
      var v = findBelegindex(obj[pref[p]], depth + 1);
      if (v) return v;
    }
  }
  if (Array.isArray(obj)) {
    for (var a = 0; a < obj.length; a++) { var r = findBelegindex(obj[a], depth + 1); if (r) return r; }
    return '';
  }
  for (var k in obj) {
    if (!Object.prototype.hasOwnProperty.call(obj, k)) continue;
    var rr = findBelegindex(obj[k], depth + 1);
    if (rr) return rr;
  }
  return '';
}
function __extractBelegindex() { return findBelegindex(window.__seRawResponse, 0); }

/* Tagesdatum aus GET_RELATION[73!DATUM!0] -- SE liefert es im korrekten internen
   Format; wir uebernehmen es 1:1 (selbst formatierte Daten wurden als "Datum kann
   nicht verwendet werden" abgelehnt). Erstes nicht-leeres Skalar gewinnt. */
function findDatum(obj, depth) {
  depth = depth || 0;
  if (depth > 6 || obj == null) return '';
  if (typeof obj === 'number') return obj ? String(obj) : '';
  if (typeof obj === 'string') return obj.trim();
  if (typeof obj !== 'object') return '';
  var pref = ['RESULT', 'result', 'DATUM', 'datum', '19_10', '0_10'];
  for (var p = 0; p < pref.length; p++) {
    if (Object.prototype.hasOwnProperty.call(obj, pref[p])) {
      var v = findDatum(obj[pref[p]], depth + 1);
      if (v) return v;
    }
  }
  if (Array.isArray(obj)) {
    for (var a = 0; a < obj.length; a++) { var r = findDatum(obj[a], depth + 1); if (r) return r; }
    return '';
  }
  for (var k in obj) {
    if (!Object.prototype.hasOwnProperty.call(obj, k)) continue;
    var x = findDatum(obj[k], depth + 1);
    if (x) return x;
  }
  return '';
}
function __extractDatum() { return findDatum(window.__seRawResponse, 0); }

/* Alle GET_RELATION-Antworten kommen ununterscheidbar ueber denselben Kanal
   (Message-Slot mit RESULT). Liefen zwei Abfragen gleichzeitig \u2014 z.B. der
   Live-Sync-Zaehler (666) und ein Speichern (640) \u2014 koennte das Speichern
   die falsche Antwort als Satznummer nehmen und einen FREMDEN Satz
   ueberschreiben. Darum: Warteschlange, immer nur eine Abfrage in Flug. */
var __seGetQueue = [], __seGetBusy = false;

function seGetNewIndex(idbidRel, cb, opts) {
  __seGetQueue.push([idbidRel, cb, opts]);
  __seGetNext();
}

function __seGetNext() {
  if (__seGetBusy || !__seGetQueue.length) return;
  __seGetBusy = true;
  var job = __seGetQueue.shift();
  __seGetRun(job[0], function (idx) {
    __seGetBusy = false;
    try { job[1](idx); } finally { __seGetNext(); }
  }, job[2]);
}

function __seGetRun(idbidRel, cb, opts) {
  opts = opts || {};
  var nr = opts.nr || SE_GET_NEW_NR;
  var params = opts.params || [idbidRel];
  var before = {};
  seMsgKeys().forEach(function (k) { before[k] = 1; });
  window.__seRawIndex = '';
  window.__seRawResponse = null;
  window.__seIndexWaiting = true;
  seSend('GET_RELATION', { NR: nr, PARAMS: params, ALIAS: 'SEGet', ALS_ARRAY: 'false' });
  var tries = 0;
  var poll = setInterval(function () {
    tries++;
    var idx = opts.extract ? opts.extract(before) : (seNewIndex(before) || window.__seRawIndex);
    if (idx) {
      clearInterval(poll);
      window.__seIndexWaiting = false;
      cb(idx);
    } else if (tries > 60) {
      clearInterval(poll);
      window.__seIndexWaiting = false;
      cb('');
    }
  }, 100);
}

/* Anzahl Saetze einer IDB lesen \u2014 GET_RELATION 666, RUECKGABE 2.
   REINES Lesen, legt nichts an (2026-06-10 in SoftEngine verifiziert:
   zweimal hintereinander gelesen -> identisches Ergebnis). */
function seCountRows(idbid, cb) {
  seGetNewIndex(null, cb, { nr: '666', params: [idbid, '00', '', '1', '2', '', '', ''] });
}

function sePut(idbidRel, pindex, jobs, opts) {
  opts = opts || {};
  var putNr = opts.putNr || SE_PUT_NR;
  var defaultVart = opts.defaultVart || SE_VART;
  jobs.forEach(function (j) {
    if (j[0] == null || /^TODO/.test(String(j[0]))) return;
    if (opts.skipEmpty && (j[1] == null || String(j[1]).trim() === '')) return;
    var pl = String(j[0]).split('_');
    var vart = j[2] || defaultVart;
    var params = [pl[0], pl[1], vart, String(pindex), idbidRel || '', String(j[1] == null ? '' : j[1])];
    seSend('PUT_RELATION', { NR: putNr, PARAMS: params });
  });
}

function seAppendRow(alias, row) {
  try {
    if (typeof SEDATA === 'undefined' || !SEDATA || !SEDATA.Daten) return;
    var a = String(alias).toLowerCase();
    var sfl = SEDATA.Daten.SEFileLoop, entry = null;
    if (Array.isArray(sfl)) {
      for (var i = 0; i < sfl.length; i++) {
        if (String((sfl[i] || {}).ALIAS || '').toLowerCase() === a) { entry = sfl[i]; break; }
      }
    } else if (sfl && typeof sfl === 'object') {
      for (var k in sfl) {
        var e = sfl[k] || {};
        if (String(e.ALIAS || k).toLowerCase() === a) { entry = e; break; }
      }
    }
    if (!entry) return;
    if (!Array.isArray(entry.Zeilen)) entry.Zeilen = [];
    entry.Zeilen.push(row);
  } catch (e) { logWarn('Zeile in SEFileLoop-Entry einfuegen fehlgeschlagen', e); }
}

function seHaveData() {
  return !(typeof SEDATA === 'undefined' || !SEDATA || !SEDATA.Daten);
}

function seBoot(renderFn) {
  renderFn();
  var tries = 0;
  var poll = setInterval(function () {
    tries++;
    if (seHaveData()) {
      clearInterval(poll);
      try { if (typeof ResetDataBasis === 'function') ResetDataBasis(); } catch (e) {}
      try { if (typeof InitialisiereDatenBasis === 'function') InitialisiereDatenBasis(); } catch (e) {}
      renderFn();
    } else if (tries > 100) { clearInterval(poll); }
  }, 300);
}

window.SE_PUT_NR = SE_PUT_NR;
window.SE_GET_NEW_NR = SE_GET_NEW_NR;
window.SE_VART = SE_VART;
window.SE_VART_DATUM = SE_VART_DATUM;

window.sePut = sePut;

window.seHaveData = seHaveData;

<script>

   GET_RELATION[712!DUPLIZIEREN!VON_BELART!VON_BELNR!IN_BELART!IN_BELNR!
                BELDATUM!ADRNR!PREISAKT!BGRUPPE!PRJNR!BZEIT!ARCHIV!NUR_BELKOPF]
   wandelt den Lieferschein (L) in eine Rechnung (R) um. DUPLIZIEREN/PREISAKT/

var BELEG_UMWANDELN_NR = '712';

/* Status lebt im Zimmer-Feld (253_30):
   '' -> Nicht zugewiesen | 'Wartezimmer' | 'Behandlungszimmer N' | 'Abrechnung' */
function spalteVon(z) {

  if (z === 'Erledigt') return 'erledigt';
  if (z.indexOf('Behandlungszimmer') === 0) return 'behandlung';
  if (z === 'Wartezimmer') return 'wartezimmer';

var SPALTEN = [
  { id: 'offen', titel: 'Termine heute', cls: 'vspalte-offen', zimmer: '', hinweis: 'Termin geplant, Patient noch nicht da', leerTitel: 'Keine Termine geplant', leerSub: 'Neue Termine \u00fcber \u201e+ Termin\u201c anlegen' },
  { id: 'wartezimmer', titel: 'Wartezimmer', cls: 'vspalte-wartezimmer', zimmer: 'Wartezimmer', hinweis: 'Eingecheckt, wartet auf Aufruf', leerTitel: 'Niemand wartet gerade', leerSub: 'Eingecheckte Patienten erscheinen hier' },
  { id: 'behandlung', titel: 'In Behandlung', cls: 'vspalte-behandlung', zimmer: null, hinweis: 'Beim Tierarzt im Zimmer', leerTitel: '', leerSub: '' },
  { id: 'abrechnung', titel: 'Zur Kasse', cls: 'vspalte-abrechnung', zimmer: 'Abrechnung', hinweis: 'Behandlung beendet, Kasse offen', leerTitel: 'Nichts offen an der Kasse', leerSub: 'Abgeschlossene Behandlungen landen hier' }
];

var SELECTED_DATE = todayKey();
var SEARCH = '';

/* ===== Check-in-Zeit: Stopgap ueber localStorage =====
   LUECKE: es gibt kein IDB-Feld fuer den Check-in-Zeitpunkt.
   Bis das Feld existiert, merkt sich jeder Arbeitsplatz die Zeit nur lokal \u2014
   Wartezeiten sind also NICHT arbeitsplatzuebergreifend. */
function ciKey(p) { return 'vet-checkin:' + p; }
function setCheckin(p) { try { localStorage.setItem(ciKey(p), String(Date.now())); } catch (e) {} }
function clearCheckin(p) { try { localStorage.removeItem(ciKey(p)); } catch (e) {} }
function wartezeit(p) {
  var ts = 0;
  try { ts = parseInt(localStorage.getItem(ciKey(p)) || '0', 10); } catch (e) {}
  if (!ts) return '';
  var min = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if (min < 60) return min + ' min';
  return Math.floor(min / 60) + ' h ' + (min % 60) + ' min';
}

function relativZeit(uhrzeit) {
  if (SELECTED_DATE !== todayKey()) return null;
  var m = /^(\d{1,2}):(\d{2})/.exec(String(uhrzeit || ''));
  if (!m) return null;
  var now = new Date();
  var d = (+m[1]) * 60 + (+m[2]) - (now.getHours() * 60 + now.getMinutes());
  if (d === 0) return { text: 'jetzt', spaet: false };
  var abs = Math.abs(d);
  if (abs >= 600) return null;
  var t = abs < 60 ? abs + ' min' : Math.floor(abs / 60) + ' h' + (abs % 60 ? ' ' + (abs % 60) + ' min' : '');
  return d > 0 ? { text: 'in ' + t, spaet: false } : { text: 'vor ' + t, spaet: true };
}

function pindexOf(termin) {
  var pv = getField(termin, FELD.TP.pindex);
  if (pv) return pv;
  var keys = ['PINDEX', 'pindex', 'PIndex', 'PIDX', 'pidx', 'KEY', 'key', 'ID', 'id'];
  for (var i = 0; i < keys.length; i++) {
    var v = termin[keys[i]];
    if (v != null && String(v).trim() !== '') return String(v).trim();
  }
  return getField(termin, FELD.TP.adr);
}

/* ===== Lookup-Index (Befund B1): einmal pro Datensatz gebaut, an SEDATA.Daten
   gekoppelt. Frueher scannte JEDE Karte customerByAdr/visitPetList/petMasterOf je
   die ganze Tabelle -> bei vielen Terminen x grossem Stamm quadratisch. Jetzt: ein
   Mal Maps bauen, danach direkter Nachschlag. SEDATA.Daten wird nur als Ganzes neu
   zugewiesen (nie in-place mutiert, siehe __seConsume), daher reicht der
   Referenz-Vergleich als Cache-Invalidierung. Trefferreihenfolge bleibt die
   Tabellen-Reihenfolge, damit das Ergebnis identisch zum frueheren Scan ist. */
var __peopleIdxCache = null, __peopleIdxSrc = null;
function __peopleIdx() {
  var src = (typeof SEDATA !== 'undefined' && SEDATA && SEDATA.Daten) ? SEDATA.Daten : null;
  if (__peopleIdxCache && __peopleIdxSrc === src) return __peopleIdxCache;
  var x = { adr: Object.create(null), pets: Object.create(null), htPidx: Object.create(null), htAdr: Object.create(null) };
  loadRows('Adr').forEach(function (r) {
    var a = getField(r, FELD.ADR.adr);
    if (a && x.adr[a] === undefined) x.adr[a] = r;
  });
  loadRows('Kundenhaustiere').forEach(function (r) {
    var vid = String(getField(r, FELD.KH.besuchId) || '').trim();
    if (vid) (x.pets[vid] || (x.pets[vid] = [])).push(r);
  });
  loadRows('Haustiere').forEach(function (r) {
    var p = String(getField(r, FELD.HT.pindex) || '').trim();
    if (p && x.htPidx[p] === undefined) x.htPidx[p] = r;
    var a = getField(r, FELD.HT.adr);
    (x.htAdr[a] || (x.htAdr[a] = [])).push(r);
  });
  __peopleIdxCache = x; __peopleIdxSrc = src;
  return x;
}

function visitPetList(termin) {
  var vid = String(pindexOf(termin) || '').trim();
  if (!vid) return [];
  var arr = __peopleIdx().pets[vid];
  return arr ? arr.slice() : [];
}

function customerByAdr(adr) {
  if (!adr) return null;
  return __peopleIdx().adr[adr] || null;
}
function petMasterOf(adr, name, lfanr) {
  var idx = __peopleIdx();
  lfanr = String(lfanr || '').trim();
  if (lfanr) { var m = idx.htPidx[lfanr]; if (m) return m; }
  var list = idx.htAdr[adr];
  if (list && list.length) {
    if (name) for (var i = 0; i < list.length; i++) if (getField(list[i], FELD.HT.name) === name) return list[i];
    return list[0];
  }
  return {};
}
function petMasterForVisit(adr, pet) {
  return petMasterOf(adr, getField(pet, FELD.KH.name), getField(pet, FELD.KH.tierAdresse));
}
function visitPrimaryPet(termin) {
  var pets = visitPetList(termin);
  return pets.length ? pets[0] : null;
}
function petMasterForTermin(termin) {
  var adr = getField(termin, FELD.TP.adr);
  var pet = visitPrimaryPet(termin);
  return pet ? petMasterForVisit(adr, pet) : petMasterOf(adr, getField(termin, FELD.TP.name));
}

/* ===== Toast ===== */
var __toastTimer = null;
function toast(msg) {
  var t = $('toast'); if (!t) return;
  t.textContent = msg; t.hidden = false;
  if (__toastTimer) clearTimeout(__toastTimer);
  __toastTimer = setTimeout(function () { t.hidden = true; }, 3500);
}

/* ===== Karten & Spalten ===== */
function prioVon(t) {
  var p = String(getField(t, FELD.TP.prioritaet) || '').toLowerCase();
  if (p.indexOf('notfall') !== -1) return 'notfall';
  if (p.indexOf('op') !== -1) return 'op';
  return '';
}
function prioRang(t) { var p = prioVon(t); return p === 'notfall' ? 0 : (p === 'op' ? 1 : 2); }

function karteHTML(t, spalteId) {
  var pidx = pindexOf(t);
  var adr = getField(t, FELD.TP.adr);
  var tierart = getField(t, FELD.TP.tierart);

  var vpets = visitPetList(t);
  var primaryPet = vpets[0] || null;
  var primaryMaster = primaryPet ? petMasterForVisit(adr, primaryPet) : petMasterOf(adr, name);
  var cardLfa = getField(primaryMaster, FELD.HT.pindex) || (primaryPet ? getField(primaryPet, FELD.KH.tierAdresse) : '');
  /* Tier-Anzeige (Name/Art/Rasse) live aus der Stammakte, wie zuvor */

  if (vpets.length > 1) {
    var fm = petMasterForVisit(adr, vpets[0]);

    art1 = getField(fm, FELD.HT.tierart) || getField(vpets[0], FELD.KH.tierart) || tierart;

    chips = '<div class="vkarte-pets">' + vpets.map(function (p) {

    }).join('') + '</div>';
  } else {
    var sm = primaryPet ? primaryMaster : petMasterOf(adr, name);
    cardName = getField(sm, FELD.HT.name) || name || (primaryPet ? getField(primaryPet, FELD.KH.name) : '');
    art1 = getField(sm, FELD.HT.tierart) || tierart || (primaryPet ? getField(primaryPet, FELD.KH.tierart) : '');
    rasse1 = getField(sm, FELD.HT.unterart) || unterart || (primaryPet ? getField(primaryPet, FELD.KH.rasse) : '');
  }
  var sc = speciesColor(art1);
  var prio = prioVon(t);
  var rel = spalteId === 'offen' ? relativZeit(uhrzeit) : null;
  var warte = spalteId === 'wartezimmer' ? wartezeit(pidx) : '';
  var meta = esc([art1, rasse1].filter(Boolean).join(' \u00b7 '));
  /* Flags strikt nur OP/Notfall aus prioritaet 319_12 (Spec Empfang_Datenanbindung.md) */
  var flag = prio ? '<div class="vkarte-flags"><span class="vflag vflag-' + prio + '">' + (prio === 'notfall' ? 'Notfall' : 'OP') + '</span></div>' : '';
  var info = '';
  if (spalteId === 'offen' && rel) info = '<span class="vinfo' + (rel.spaet ? ' spaet' : '') + '">' + (rel.spaet ? '\u26a0 ' : '') + esc(rel.text) + '</span>';
  else if (spalteId === 'wartezimmer' && warte) info = '<span class="vinfo warte">\u23f1 wartet ' + esc(warte) + '</span>';
  /* Aktion = A-Logik (eine Spalte vor), nur optisch wie B. Bewusst KEIN Zimmer-Picker

  var vorLabels = { offen: 'Anmelden \u2192', wartezimmer: 'Ins Zimmer \u2192', behandlung: 'Zur Kasse \u2192' };
  var aktion = vorLabels[spalteId]
    ? '<button type="button" class="vbtn-aktion va-' + spalteId + '" draggable="false" data-vor="' + esc(pidx) + '" data-von="' + spalteId + '">' + vorLabels[spalteId] + '</button>'
    : '';

    '</div>' +

    ((aktion || rechnung) ? '<div class="vkarte-aktion">' + aktion + rechnung + '</div>' : '') +

}

function rasterItems(rows) {
  /* Stunden-Trenner + Jetzt-Linie fuer "Nicht zugewiesen" (nur heute) */
  var out = [], letzte = null;
  var heute = SELECTED_DATE === todayKey();
  var now = new Date();
  var nowMin = now.getHours() * 60 + now.getMinutes();
  var jetztGesetzt = !heute;
  rows.forEach(function (t) {
    var u = getField(t, FELD.TP.uhrzeit);
    var m = /^(\d{1,2}):/.exec(u || '');
    var min = timeMin(t);
    if (!jetztGesetzt && min !== Infinity && min > nowMin) {
      out.push('<div class="vjetzt"><span>Jetzt \u00b7 ' + now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + '</span></div>');
      jetztGesetzt = true;

    if (m && m[1] !== letzte) { out.push('<div class="vstunde"><span>' + esc(m[1].length < 2 ? '0' + m[1] : m[1]) + ' Uhr</span></div>'); letzte = m[1]; }
    out.push(karteHTML(t, 'offen'));
  });
  if (!jetztGesetzt && rows.length) out.push('<div class="vjetzt"><span>Jetzt \u00b7 ' + now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + '</span></div>');
  return out.join('');
}

/* ===== Verschieben = Zimmer-Feld schreiben (Fable-Logik) ===== */
function findeTermin(pidx) {
  var rows = loadRows('Terminplaner');
  for (var i = 0; i < rows.length; i++) if (pindexOf(rows[i]) === pidx) return rows[i];
  return null;
}

function verschiebe(pidx, adr, zielZimmer) {
  var row = findeTermin(pidx);
  var vorher = row ? getField(row, FELD.TP.zimmer) : '';
  if (String(vorher).trim() === String(zielZimmer).trim()) return;
  if (row) row[FELD.TP.zimmer] = zielZimmer; /* optimistisch lokal */
  sePut(TP_IDBID, pidx, [[FELD.TP.zimmer, zielZimmer]]);
  markerBump('Empfang: Karte verschoben');
  var vonSp = spalteVon(vorher), nachSp = spalteVon(zielZimmer);
  if (nachSp === 'wartezimmer') setCheckin(pidx);
  if (nachSp === 'offen') clearCheckin(pidx);
  /* Lieferschein anlegen, sobald ein Termin in einer aktiven Spalte landet
     (Wartezimmer, Behandlung oder Abrechnung) -- an die Zielspalte gekoppelt,
     nicht an einen Einzelschritt. So bekommt auch ein Direkt-Drag
     Wartezimmer->Abrechnung (oder ein Termin, der ohne verschiebe() schon im
     Wartezimmer sass) seinen Beleg. Die Guards in belegAnlegen (Belegnr da /
     1020 unterwegs) verhindern Doppelanlage. */
  if (nachSp !== 'offen') belegAnlegen(adr, pidx);
  render();
}

/* Lieferschein fuer einen Besuch anlegen, sobald er eine aktive Spalte erreicht.
   2026-06-17: WF0020 abgeloest durch GET_RELATION[1020!L!!adr!!!!]
   ("Neuanlage Belegkopf"). 1020 legt den Beleg an UND gibt den Belegindex
   BEL_0_11 zurueck (z.B. "0NL12345678" = Jahr|Status|Belegart|Belegnummer).
   Wir ziehen die Belegnummer (letzte Ziffernfolge) und schreiben sie direkt
   auf den Termin-Satz (331_12) -- kein Raten, kein Race, richtiger Satz.
   Zwei Guards gegen Doppel-Anlage: (1) Satz hat schon eine Belegnr,
   (2) fuer den Satz laeuft schon ein 1020 (__belegBusy) -- schnelle
   Mehrfach-Drags wuerden sonst zwei Jobs einreihen, bevor die Nummer da ist. */

function belegAnlegen(adr, pindex) {
  adr = String(adr || '').trim();
  var satz = String(pindex == null ? '' : pindex).trim();
  if (!adr || !satz) return;
  var row = findeTermin(satz);
  if (row && String(getField(row, FELD.TP.belegnr) || '').trim()) return;
  if (__belegBusy[satz]) return;
  __belegBusy[satz] = true;
  /* BELDATUM LEER lassen -- SE fuellt es selbst. Das Datum aendert die Nummer NICHT
     (getestet 2026-06-17: mit und ohne Datum kam dieselbe kurze Nummer), darum raus
     (vermeidet auch das Geschaeftsjahr-Risiko). */
  seGetNewIndex(null, function (belegindex) {
    delete __belegBusy[satz];
    try { console.log('[1020] Belegindex:', belegindex, '| Rohantwort:', JSON.stringify(window.__seRawResponse)); } catch (e) {}
    var m = /(\d+)\s*$/.exec(String(belegindex || ''));
    var nr = m ? m[1] : '';
    if (!nr) { toast('Lieferschein angelegt, aber Nummer nicht erkannt \u2014 bitte Log pruefen.'); return; }
    if (row) row[FELD.TP.belegnr] = nr;
    sePut(TP_IDBID, satz, [[FELD.TP.belegnr, nr]]);
    toast('Lieferschein ' + nr + ' angelegt.');
    render();
  }, { nr: '1020', params: ['L', '', adr, '', '', '', ''], extract: __extractBelegindex });
}

/* (entfernt 2026-06-16) Belegnummer-Nachtragen: neuesterLieferscheinFrei /
   lieferscheinVergeben / belegnrNachtragen. Die Auto-Erkennung des "neuesten
   freien Lieferscheins" und das Stempeln auf FELD.TP.belegnr (331_12) waren
   unzuverlaessig (racy). FOLGE: "Rechnung erstellen" findet keine gespeicherte
   Belegnummer mehr -- braucht einen verlaesslichen Weg (z.B. WF0020 gibt die
   Nummer zurueck), bevor es wieder greift. */

/* "Rechnung erstellen" (Abrechnung-Spalte): den Lieferschein DIESES Besuchs

function belegRechnungErstellen(pidx) {
  var row = findeTermin(pidx);
  var belegnr = row ? getField(row, FELD.TP.belegnr) : '';
  var adr = row ? getField(row, FELD.TP.adr) : '';
  if (!belegnr) { toast('Zu diesem Besuch gibt es noch keinen Lieferschein.'); return; }
  rechnungAusLieferschein(belegnr, adr, pidx);
}
/* Kern: Lieferschein-Nr -> neue Rechnung (auch direkt aus der Kasse aufrufbar). */
function rechnungAusLieferschein(belegnr, adr, pidx) {

  __rechnungBusy = true;

     Format ueber GET_RELATION[73!DATUM!0]; das geht 1:1 als BELDATUM rein (selbst
     formatierte Daten wurden als "Datum kann nicht verwendet werden" abgelehnt --
     SE-Doku Nutzer 2026-06-17). Erst Datum holen, dann wandeln. */
  seGetNewIndex(null, function (belDatum) {
    belDatum = String(belDatum || '').trim();
    try { console.log('[73] Tagesdatum:', belDatum, '| Rohantwort:', JSON.stringify(window.__seRawResponse)); } catch (e) {}
    if (!belDatum) { toast('Tagesdatum (73) nicht erhalten \u2014 bitte Log pruefen.'); return; }
    /* Parameter exakt nach SE-Doku: DUPLIZIEREN=1, IN_BELNR=0 (=> neue Rechnung),
       PREISAKT=1, BZEIT=A, ARCHIV=N, NUR_BELKOPF=0. */
    var params = [
      '1',                  /* DUPLIZIEREN = ja */
      BELART_LIEFERSCHEIN,  /* VON_BELART = L (Quelle) */
      String(belegnr),      /* VON_BELNR  = Lieferschein-Nr */
      BELART_RECHNUNG,      /* IN_BELART  = R (Ziel) */
      '0',                  /* IN_BELNR   = 0 -> neue Rechnung */
      belDatum,             /* BELDATUM   = Tagesdatum aus GET_RELATION[73!DATUM!0] */
      String(adr || ''),    /* ADRNR       */
      '1',                  /* PREISAKT    */
      '',                   /* BGRUPPE     */
      '',                   /* PRJNR       */
      'A',                  /* BZEIT       */
      'N',                  /* ARCHIV      */
      '0'                   /* NUR_BELKOPF */
    ];
    toast('Rechnung wird erstellt ...');
    /* 712 jetzt MIT Warten auf die Antwort (ueber seGetNewIndex): der Befehl
       geht 1:1 wie vorher raus, aber wir warten auf SEs Rueckmeldung. Erst wenn
       eine Belegnummer zurueckkommt, gilt die Rechnung als erstellt -- DANN faellt
       die Karte aus "Zur Kasse" (Status Erledigt). Kommt nichts (Timeout/Fehler),
       bleibt die Karte vorsichtshalber stehen. Detektor wie bei 1020 (Lieferschein). */
    seGetNewIndex(null, function (rechnungNr) {
      try { console.log('[712] Rechnung:', rechnungNr, '| Rohantwort:', JSON.stringify(window.__seRawResponse)); } catch (e) {}
      if (!rechnungNr) {
        toast('Rechnung abgeschickt, aber keine Bestaetigung erhalten. Karte bleibt vorsichtshalber in "Zur Kasse". Bitte pruefen/aktualisieren.');
        return;
      }
      toast('Rechnung erstellt.');
      if (pidx) {
        var r = findeTermin(pidx);
        if (r) r[FELD.TP.zimmer] = 'Erledigt';
        sePut(TP_IDBID, pidx, [[FELD.TP.zimmer, 'Erledigt']]);
        markerBump('Empfang: Rechnung erstellt, Karte erledigt');
        render();
      }
    }, { nr: BELEG_UMWANDELN_NR, params: params, extract: __extractBelegindex });
  }, { nr: '73', params: ['DATUM', '0'], extract: __extractDatum });
}

/* Erster freier Behandlungsraum (kein Patient am gewaehlten Tag) */
function freierRaum() {
  var belegt = {};
  loadRows('Terminplaner').forEach(function (t) {
    if (dateKey(getField(t, FELD.TP.datum)) !== SELECTED_DATE) return;
    var z = String(getField(t, FELD.TP.zimmer) || '');
    var m = /Behandlungszimmer\s*(\d+)/i.exec(z);
    if (m) belegt[m[1]] = 1;
  });
  for (var i = 0; i < ROOMS.length; i++) if (!belegt[ROOMS[i]]) return ROOMS[i];
  return ROOMS[0];
}

/* Weiter-Knopf auf der Karte: eine Spalte vorruecken */
function karteVor(pidx, von) {
  var row = findeTermin(pidx);
  var adr = row ? getField(row, FELD.TP.adr) : '';
  if (von === 'offen') { verschiebe(pidx, adr, 'Wartezimmer'); return; }
  if (von === 'wartezimmer') { verschiebe(pidx, adr, 'Behandlungszimmer ' + freierRaum()); return; }
  if (von === 'behandlung') { verschiebe(pidx, adr, 'Abrechnung'); return; }
  /* 'Bezahlt' (abrechnung -> Erledigt) entfernt 2026-06-17 auf Nutzerwunsch --
     in Abrechnung gibt es jetzt nur noch "Rechnung erstellen". */
}

var __dragEl = null;
function setupDragDrop() {
  var board = $('board');
  if (!board || board.__dnd) return;
  board.__dnd = true;
  board.addEventListener('dragstart', function (e) {
    var card = e.target.closest ? e.target.closest('.vkarte') : null;
    if (!card) return;
    __dragEl = card;
    card.classList.add('is-dragging');
    try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', card.getAttribute('data-pindex') || ''); } catch (_) {}
  });
  board.addEventListener('dragend', function () {
    if (__dragEl) __dragEl.classList.remove('is-dragging');
    __dragEl = null;
    var hl = board.querySelectorAll('.dropzone.is-drop-aktiv');
    for (var i = 0; i < hl.length; i++) hl[i].classList.remove('is-drop-aktiv');
  });
  board.addEventListener('dragover', function (e) {
    var dz = e.target.closest ? e.target.closest('.dropzone') : null;
    if (!dz || !__dragEl) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'move'; } catch (_) {}
    var hl = board.querySelectorAll('.dropzone.is-drop-aktiv');
    for (var i = 0; i < hl.length; i++) if (hl[i] !== dz) hl[i].classList.remove('is-drop-aktiv');
    dz.classList.add('is-drop-aktiv');
  });
  board.addEventListener('drop', function (e) {
    var dz = e.target.closest ? e.target.closest('.dropzone') : null;
    if (!dz || !__dragEl) return;
    e.preventDefault();
    verschiebe(__dragEl.getAttribute('data-pindex') || '', __dragEl.getAttribute('data-adr') || '', dz.getAttribute('data-zimmer') || '');
  });
  board.addEventListener('click', function (e) {
    var vor = e.target.closest ? e.target.closest('[data-vor]') : null;
    if (vor) {
      e.preventDefault(); e.stopPropagation();
      karteVor(vor.getAttribute('data-vor'), vor.getAttribute('data-von'));
      return;
    }
    var btn = e.target.closest ? e.target.closest('[data-rechnung]') : null;
    if (btn) {
      e.preventDefault(); e.stopPropagation();
      belegRechnungErstellen(btn.getAttribute('data-rechnung'));
      return;
    }
    var card = e.target.closest ? e.target.closest('.vkarte') : null;
    if (card && !e.target.closest('button')) { karteiOeffnen(card.getAttribute('data-pindex')); }
  });
}

/* ===== Patientenkartei: dieser Patient, dieser Besuch =====
   Editierbar, wo ein VERIFIZIERTER Schreibweg existiert:
   - Besuch (Uhrzeit, Behandlung) -> sePut Terminplaner auf den Termin-Satz
   - Tier-Stammdaten -> PUT 03 auf die Lieferadress-Nr (FELD.HT.pindex)
   - Besitzer-Kontakt -> PUT 01 auf die Adressnummer */
var KARTEI_PIDX = null;

function karteiOeffnen(pidx) {
  KARTEI_PIDX = pidx;
  karteiRender();
}
function karteiSchliessen() {
  KARTEI_PIDX = null;
  var k = $('kartei'); if (k) k.hidden = true;
}

function kfeld(label, inhalt) {
  return '<div class="kd-row"><span class="kd-label">' + esc(label) + '</span><div class="kd-val">' + inhalt + '</div></div>';
}
function ksec(titel, rows) {
  return '<div class="kd-sec">' + esc(titel) + '</div><div class="kd-list">' + rows + '</div>';
}
function kinput(quelle, code, wert, typ) {
  if (typ === 'date') {
    /* Datumsfeld: gespeichert als TT.MM.JJJJ, type=date braucht aber ISO JJJJ-MM-TT
       in value/data-orig. Hier DE->ISO; zurueck zu DE beim Speichern (HT-Zweig unten).
       Nicht-konvertierbarer Altwert -> leeres Feld; der Originalwert bleibt unangetastet,
       weil der changed-Filter ihn nur bei echter Aenderung anfasst. */
    var d = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(wert == null ? '' : wert).trim());
    var iso = d ? (d[3] + '-' + _pad2(+d[2]) + '-' + _pad2(+d[1])) : '';
    return '<input class="kinput" type="date" value="' + esc(iso) + '" data-kfeld="' + quelle + ':' + code + '" data-orig="' + esc(iso) + '" />';
  }
  return '<input class="kinput' + (typ === 'mono' ? ' num' : '') + '"' + (typ === 'time' ? ' type="time"' : typ === 'email' ? ' type="email"' : '') +
    ' value="' + esc(wert) + '" data-kfeld="' + quelle + ':' + code + '" data-orig="' + esc(wert) + '" />';
}
function kwert(wert, mono) {
  return '<span class="kd-ro' + (mono ? ' num' : '') + '">' + (esc(wert) || '\u2014') + '</span>';
}
function kph(text) {
  return '<span class="kd-ro kd-ph">' + (esc(text) || '\u2014') + '</span>';
}

function karteiRender() {
  var k = $('kartei'); if (!k || !KARTEI_PIDX) return;
  var t = findeTermin(KARTEI_PIDX);
  if (!t) { karteiSchliessen(); return; }
  var adr = getField(t, FELD.TP.adr);
  var cust = customerByAdr(adr) || {};
  var visitPet = visitPrimaryPet(t);
  var master = petMasterForTermin(t);
  var name = getField(master, FELD.HT.name) || (visitPet ? getField(visitPet, FELD.KH.name) : '') || getField(t, FELD.TP.name);
  var tierart = getField(master, FELD.HT.tierart) || (visitPet ? getField(visitPet, FELD.KH.tierart) : '') || getField(t, FELD.TP.tierart);
  var unterart = getField(master, FELD.HT.unterart) || (visitPet ? getField(visitPet, FELD.KH.rasse) : '') || getField(t, FELD.TP.unterart);
  var z = getField(t, FELD.TP.zimmer);
  var allergie = getField(master, FELD.HT.allergie);
  var notizKunde = getField(cust, FELD.ADR.notizKunde);
  var htIdx = getField(master, FELD.HT.pindex); /* eigene Lieferadress-Nr des Tiers (2_8) */
  var st = STATUS_INFO[spalteVon(z)] || STATUS_INFO.offen;
  var statusLabel = (spalteVon(z) === 'behandlung') ? ('Behandlungszimmer ' + raumVon(z)) : st.l;
  var prioRaw = String(getField(t, FELD.TP.prioritaet) || '');
  var flags = '';
  if (/notfall/i.test(prioRaw)) flags += '<span class="vflag vflag-notfall">Notfall</span>';
  if (/\bop\b/i.test(prioRaw)) flags += '<span class="vflag vflag-op">OP</span>';

  k.innerHTML =
    '<div class="vakte-kopf">' +
      '<span class="vavatar vavatar-gross" style="--ab:' + speciesColor(tierart).bg + ';--af:' + speciesColor(tierart).fg + '">' + tierIcon(tierart) + '</span>' +
      '<div class="vakte-titel"><strong>' + (esc(name) || '\u2014') + '</strong>' +
        '<span>' + (esc([tierart, unterart].filter(Boolean).join(' \u00b7 ')) || '\u2014') + '</span></div>' +
      '<div class="vakte-aktionen">' +
      '<button type="button" class="vbtn vbtn-ghost vbtn-icon" data-kartei-zu="1" aria-label="Schlie\u00dfen">\u2715</button></div>' +
    '</div>' +
    '<div class="vakte-rumpf">' +
      (allergie ? '<div class="kd-warn"><span class="kd-warn-dot"></span><span class="kd-warn-text">Allergie \u00b7 ' + esc(allergie) + '</span></div>' : '') +
      (flags ? '<div class="kd-flags">' + flags + '</div>' : '') +
      '<div class="kd-status"><div class="kd-status-l">Aktueller Status</div>' +
        '<div class="kd-status-row"><span class="kd-dot" style="background:' + st.c + '"></span>' +
        '<span class="kd-status-t" style="color:' + st.c + '">' + esc(statusLabel) + '</span>' +
        '<span class="kd-status-time num">' + esc(getField(t, FELD.TP.uhrzeit) || '\u2014') + '</span></div></div>' +

      ksec('Besuch',
        kfeld('Datum', kwert(getField(t, FELD.TP.datum), true)) +
        kfeld('Uhrzeit', kinput('TP', FELD.TP.uhrzeit, getField(t, FELD.TP.uhrzeit), 'time')) +
        kfeld('Grund des Besuchs', kinput('TP', FELD.TP.behandlung, getField(t, FELD.TP.behandlung))) +
        kfeld('Priorit\u00e4t', kinput('TP', FELD.TP.prioritaet, getField(t, FELD.TP.prioritaet))) +
        kfeld('Behandler', BEDIENER ? kwert(BEDIENER) : kph('angemeldeter Bediener'))) +

      ksec('Tier (Stammakte)', (htIdx
        ? kfeld('Name', kinput('HT', FELD.HT.name, getField(master, FELD.HT.name) || name)) +
          kfeld('Geburtsdatum', kinput('HT', FELD.HT.geburtsdatum, getField(master, FELD.HT.geburtsdatum), 'date')) +
          kfeld('Tierart', kinput('HT', FELD.HT.tierart, getField(master, FELD.HT.tierart))) +
          kfeld('Rasse', kinput('HT', FELD.HT.unterart, getField(master, FELD.HT.unterart))) +
          kfeld('Gewicht', kinput('HT', FELD.HT.gewicht, getField(master, FELD.HT.gewicht), 'mono')) +
          kfeld('Kastriert (J/N)', kinput('HT', FELD.HT.kastriert, getField(master, FELD.HT.kastriert))) +
          kfeld('Allergien', kinput('HT', FELD.HT.allergie, allergie))
        : kfeld('Name', kwert(getField(master, FELD.HT.name) || name)) +
          kfeld('Geburtsdatum', kwert(getField(master, FELD.HT.geburtsdatum), true)) +
          kfeld('Tierart', kwert(getField(master, FELD.HT.tierart))) +
          kfeld('Rasse', kwert(getField(master, FELD.HT.unterart))) +
          kfeld('Gewicht', kwert(getField(master, FELD.HT.gewicht), true)) +
          kfeld('Kastriert', kwert({ J: 'Ja', N: 'Nein' }[String(getField(master, FELD.HT.kastriert)).toUpperCase()] || '')) +
          kfeld('Allergien', kwert(allergie || 'keine bekannt')))) +

      ksec('Halter:in',
        kfeld('Vorname', kinput('ADR', FELD.ADR.vorname, getField(cust, FELD.ADR.vorname))) +
        kfeld('Nachname', kinput('ADR', FELD.ADR.nachname, getField(cust, FELD.ADR.nachname))) +
        kfeld('Mobil', kinput('ADR', FELD.ADR.mobil, getField(cust, FELD.ADR.mobil), 'mono')) +
        kfeld('E-Mail', kinput('ADR', FELD.ADR.email, getField(cust, FELD.ADR.email), 'email')) +
        kfeld('Stra\u00dfe', kinput('ADR', FELD.ADR.strasse, getField(cust, FELD.ADR.strasse))) +
        kfeld('Hausnr.', kinput('ADR', FELD.ADR.hausnr, getField(cust, FELD.ADR.hausnr))) +
        kfeld('PLZ', kinput('ADR', FELD.ADR.plz, getField(cust, FELD.ADR.plz), 'mono')) +
        kfeld('Ort', kinput('ADR', FELD.ADR.ort, getField(cust, FELD.ADR.ort)))) +

      '<div class="kd-sec">Notiz zum Kunden (intern)</div>' +
      '<textarea class="kinput karea" rows="3" data-kfeld="ADR:' + FELD.ADR.notizKunde + '" data-orig="' + esc(notizKunde) + '" placeholder="Interne Notiz \u2026">' + esc(notizKunde) + '</textarea>' +
    '</div>' +
    '<div class="kd-fuss"><span class="kartei-fb" id="karteiFb" aria-live="polite"></span>' +
      '<button type="button" class="vbtn kartei-save" data-kartei-save="1" disabled>Speichern</button></div>';

  k.hidden = false;
  /* Board bleibt in voller Breite \u2014 Kartei legt sich rechts DRUEBER
     (Nutzer-Wunsch: Board nicht wegdruecken) */
  karteiDirtyAktualisieren();
}

/* Speichern beim Verlassen eines Feldes (change = blur mit Aenderung) */
var __karteiBumpTimer = null;
function karteiBump() {
  if (__karteiBumpTimer) clearTimeout(__karteiBumpTimer);
  __karteiBumpTimer = setTimeout(function () { markerBump('Empfang: Kartei'); }, 2000);
}

function karteiFeedback(msg, kind) {
  var fb = $('karteiFb');
  if (!fb) return;
  fb.textContent = msg || '';
  fb.className = 'kartei-fb' + (kind ? ' ' + kind : '');
}

function karteiFelder() {
  var k = $('kartei');
  return k ? Array.prototype.slice.call(k.querySelectorAll('[data-kfeld]')) : [];
}

function karteiDirtyAktualisieren() {
  var dirty = false;
  karteiFelder().forEach(function (inp) {
    var changed = inp.value.trim() !== String(inp.getAttribute('data-orig') || '');
    inp.classList.toggle('is-kdirty', changed);
    if (changed) dirty = true;
  });
  var btn = $('kartei') ? $('kartei').querySelector('[data-kartei-save]') : null;
  if (btn) btn.disabled = !dirty;
  if (dirty) karteiFeedback('Ungespeicherte \u00c4nderungen.', '');
}

function karteiSpeichern() {
  var t = findeTermin(KARTEI_PIDX);
  if (!t) return;
  var felder = karteiFelder();
  var changed = felder.filter(function (inp) { return inp.value.trim() !== String(inp.getAttribute('data-orig') || ''); });
  if (!changed.length) { karteiFeedback('Keine \u00c4nderungen.', ''); return; }
  var adr = getField(t, FELD.TP.adr);
  if (!adr) { karteiFeedback('Keine Adressnummer am Termin.', 'err'); return; }
  var tpJobs = [], htJobs = [], adrJobs = [];
  var master = petMasterForTermin(t);
  var lfanr = getField(master, FELD.HT.pindex);
  var cust = customerByAdr(adr);

  for (var i = 0; i < changed.length; i++) {
    var inp = changed[i];
    var teile = inp.getAttribute('data-kfeld').split(':');
    var quelle = teile[0], code = teile[1], wert = inp.value.trim();
    if (quelle === 'TP') {
      t[code] = wert;
      /* Uhrzeit ist im Terminplaner ein Zeitfeld -> Art 'Z' (type=time liefert HH:MM). */
      tpJobs.push([code, wert, code === FELD.TP.uhrzeit ? SE_VART_ZEIT : undefined]);
    } else if (quelle === 'HT') {
      if (!lfanr) { karteiFeedback('Tier hat keine Stammakte.', 'err'); return; }
      if (code === FELD.HT.geburtsdatum) {
        /* type=date liefert ISO JJJJ-MM-TT -> zurueck zu TT.MM.JJJJ (wie der Wizard) */
        var dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(wert);
        if (dm) wert = dm[3] + '.' + dm[2] + '.' + dm[1];
      }
      master[code] = wert;
      htJobs.push([code, wert, code === FELD.HT.geburtsdatum ? SE_VART_DATUM : undefined]);
    } else if (quelle === 'ADR') {
      if (cust) cust[code] = wert;
      adrJobs.push([code, wert]);
    }
  }

  if (tpJobs.length) sePut(TP_IDBID, KARTEI_PIDX, tpJobs);
  if (htJobs.length) sePut('', lfanr, htJobs, { putNr: LFA_PUT_NR });
  if (adrJobs.length) sePut('', adr, adrJobs, { putNr: ADR_PUT_NR });
  changed.forEach(function (inp) { inp.setAttribute('data-orig', inp.value.trim()); });
  karteiBump();
  render();
  karteiRender();
  karteiFeedback('Gespeichert.', 'ok');
}

function karteiBind() {
  var k = $('kartei'); if (!k || k.__bound) return;
  k.__bound = true;
  k.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('[data-kartei-zu]')) karteiSchliessen();
    if (e.target.closest && e.target.closest('[data-kartei-save]')) karteiSpeichern();
  });
  /* Klick ausserhalb der Kartei schliesst sie (Klick auf eine Karte
     wechselt stattdessen den Patienten \u2014 macht der Board-Handler) */
  document.addEventListener('mousedown', function (e) {
    if (!KARTEI_PIDX) return;
    if (e.target.closest && (e.target.closest('#kartei') || e.target.closest('.vkarte') || e.target.closest('#view-termine'))) return;
    karteiSchliessen();
  });
  k.addEventListener('input', function (e) {
    var inp = e.target.closest ? e.target.closest('[data-kfeld]') : null;
    if (inp && KARTEI_PIDX) karteiDirtyAktualisieren();
  });
  k.addEventListener('change', function (e) {
    var inp = e.target.closest ? e.target.closest('[data-kfeld]') : null;
    if (inp && KARTEI_PIDX) karteiDirtyAktualisieren();
  });
}
