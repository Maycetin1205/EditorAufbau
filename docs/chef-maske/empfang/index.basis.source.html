function tmPickerSchliessen() { var p = $('tmPicker'); if (p) p.classList.remove('is-open'); }
function closeTerminModal() { $('terminModal').classList.remove('is-open'); tmPickerSchliessen(); }

/* --- Kundensuche: liefert alle Adressstamm-Treffer (Name, Tel., Tier, Anschrift) --- */
function tmTreffer(q) {
  var tiereVon = {};
  loadRows('Haustiere').forEach(function (r) {
    var a = getField(r, FELD.HT.adr);
    if (!tiereVon[a]) tiereVon[a] = [];
    tiereVon[a].push(getField(r, FELD.HT.name));
  });
  return loadRows('Adr').map(function (r) {
    return { adr: getField(r, FELD.ADR.adr), vorname: getField(r, FELD.ADR.vorname),
      nachname: getField(r, FELD.ADR.nachname), mobil: getField(r, FELD.ADR.mobil),
      strasse: getField(r, FELD.ADR.strasse), hausnr: getField(r, FELD.ADR.hausnr), ort: getField(r, FELD.ADR.ort),
      tiere: (tiereVon[getField(r, FELD.ADR.adr)] || []).join(', ') };
  }).filter(function (c) {
    if (!c.adr || (!c.vorname && !c.nachname)) return false;
    if (!q) return true;
    return (c.vorname + ' ' + c.nachname + ' ' + c.adr + ' ' + c.mobil + ' ' + c.ort + ' ' + c.tiere).toLowerCase().indexOf(q) !== -1;
  });
}
function tmKundeName(c) { return (c.nachname + ', ' + c.vorname).replace(/^, |, $/, '').trim() || '\u2014'; }

/* Live-Vorschlaege beim Tippen (erste 8) -- volle Liste via Enter */
function tmRenderSuche() {
  var box = $('tmSucheListe'); if (!box) return;
  var q = val('tmSuche').toLowerCase();
  if (!q) { box.hidden = true; box.innerHTML = ''; return; }
  var alle = tmTreffer(q), treffer = alle.slice(0, 8);
  box.innerHTML = treffer.map(function (c) {
    var sub = [c.tiere, c.mobil].filter(Boolean).join(' \u00b7 ');
    return '<button type="button" class="vsuche-zeile" data-adr="' + esc(c.adr) + '" data-vn="' + esc(c.vorname) + '" data-nn="' + esc(c.nachname) + '">' +
      '<strong>' + esc(tmKundeName(c)) + '</strong>' + (sub ? '<span>' + esc(sub) + '</span>' : '') + '</button>';
  }).join('') +
  (alle.length > 8 ? '<div class="vsuche-nichts">+' + (alle.length - 8) + ' weitere \u2013 Enter zeigt alle</div>' : '') +
  (alle.length === 0 ? '<div class="vsuche-nichts">Kein Treffer \u2013 Enter zeigt die ganze Liste</div>' : '');
  box.hidden = false;
}

/* Grosses Popup: ganze Kundenliste in Spalten */
function tmPickerRender() {
  var box = $('tmPickerListe'); if (!box) return;
  var q = val('tmPickerSuche').toLowerCase();
  var treffer = tmTreffer(q);
  if (!treffer.length) {
    box.innerHTML = '<div class="vpicker-nichts">Kein Kunde gefunden' + (q ? ' f\u00fcr \u201e' + esc(q) + '\u201c' : '') + '</div>';
    return;
  }
  box.innerHTML = '<table class="vpicker-tab"><thead><tr>' +
    '<th>Name</th><th>Tiere</th><th>Telefon</th><th>Stra\u00dfe</th><th>Ort</th></tr></thead><tbody>' +
    treffer.map(function (c) {
      var str = (c.strasse + ' ' + c.hausnr).trim();
      return '<tr data-adr="' + esc(c.adr) + '" data-vn="' + esc(c.vorname) + '" data-nn="' + esc(c.nachname) + '">' +
        '<td class="nm">' + esc(tmKundeName(c)) + '</td>' +
        '<td>' + esc(c.tiere) + '</td>' +
        '<td class="tel">' + esc(c.mobil) + '</td>' +
        '<td>' + esc(str) + '</td>' +
        '<td>' + esc(c.ort) + '</td></tr>';
    }).join('') + '</tbody></table>';
}

function tmWaehleKunde(adr, vn, nn) {
  tmPickerSchliessen();
  var sl = $('tmSucheListe'); if (sl) sl.hidden = true;
  if (adr === NEU) {
    TM.adr = ''; TM.neuKunde = true;
    $('tmNeuKunde').hidden = false;
    /* Neuer Kunde hat noch keine Tiere -> direkt Neues Tier aufklappen */
    TM.pets = []; TM.allPets = []; TM.neuesTier = true; $('tmNeuTier').hidden = false;
    tmSetKundeFeld(); tmRenderPets(); tmRenderBehandlung();
    setTimeout(function () { var f = $('nkVorname'); if (f) f.focus(); }, 0);
    return;
  }
  TM.adr = adr; TM.vorname = vn || ''; TM.nachname = nn || ''; TM.neuKunde = false;
  TM.neuesTier = false;
  $('tmNeuKunde').hidden = true; $('tmNeuTier').hidden = true;
  TM.pets = [];
  tmSetKundeFeld(); tmRenderPets(); tmRenderBehandlung();
}

/* "+ Kunde" / "- Kunde": Neuanlage an/aus (versehentlicher Klick ruecknehmbar) */
function tmNeuKundeToggle() {
  if (TM.neuKunde) {
    TM.neuKunde = false; TM.neuesTier = false;
    $('tmNeuKunde').hidden = true; $('tmNeuTier').hidden = true;
    TM.adr = ''; TM.vorname = ''; TM.nachname = ''; TM.pets = []; TM.allPets = [];
    tmSetKundeFeld(); tmRenderPets(); tmRenderBehandlung();
    return;
  }
  tmWaehleKunde(NEU);
}

/* --- Tierliste: Checkboxen + "Neues Tier" als Eintrag --- */
function tmRenderPets() {
  var box = $('tmPetList'); if (!box) return;
  var pets = TM.neuKunde ? [] : (TM.adr ? loadRows('Haustiere').filter(function (r) { return getField(r, FELD.HT.adr) === TM.adr; }) : []);
  TM.allPets = pets;
  var selNames = {}; (TM.pets || []).forEach(function (p) { var n = getField(p, FELD.HT.name); if (n) selNames[n] = 1; });
  var html = pets.map(function (p, i) {
    var name = getField(p, FELD.HT.name), art = getField(p, FELD.HT.tierart), rasse = getField(p, FELD.HT.unterart);
    var sub = [art, rasse].filter(Boolean).join(' \u00b7 ');
    var sel = !!selNames[name];
    return '<label class="vpet' + (sel ? ' is-sel' : '') + '"><input type="checkbox" value="' + i + '"' + (sel ? ' checked' : '') + ' />' +
      '<span class="vavatar">' + tierIcon(art) + '</span>' +
      '<span class="vpet-id"><span class="n">' + (esc(name) || '\u2014') + '</span>' + (sub ? '<span class="s">' + esc(sub) + '</span>' : '') + '</span></label>';
  }).join('');
  if (!TM.adr && !TM.neuKunde) html = '<div class="vleer">Erst einen Kunden w\u00e4hlen.</div>';
  /* "+ Neues Tier" steht VORNE in der Liste (Nutzer-Wunsch) */
  html = '<button type="button" class="vpet vpet-neu" id="tmTierNeu"' + ((TM.adr || TM.neuKunde) ? '' : ' disabled') + '>\uff0b Neues Tier anlegen \u2026</button>' + html;
  box.innerHTML = html;
  var items = box.querySelectorAll('label.vpet');
  function syncPets() {
    var picked = [];
    for (var k = 0; k < items.length; k++) {
      var cb = items[k].querySelector('input');
      var isOn = !!(cb && cb.checked);
      items[k].classList.toggle('is-sel', isOn);
      if (isOn) picked.push(pets[k]);
    }
    TM.pets = picked;
    tmRenderBehandlung();
  }
  box.onchange = syncPets;
  on('tmTierNeu', 'click', function () {
    TM.neuesTier = true; $('tmNeuTier').hidden = false; tmRenderBehandlung();
    setTimeout(function () { var f = $('ntName'); if (f) f.focus(); }, 0);
  });
  syncPets();
}

/* --- Behandlung je gewaehltem Tier (inkl. neuem Tier) --- */
function tmAlleTierNamen() {
  var namen = (TM.pets || []).map(function (p) { return getField(p, FELD.HT.name); });
  if (TM.neuesTier) { var nn = val('ntName'); namen.push(nn ? nn : '(neues Tier)'); }
  return namen;
}
function tmRenderBehandlung() {
  var box = $('tmBehList'); if (!box) return;
  var namen = tmAlleTierNamen();
  if (!namen.length) { box.innerHTML = '<div class="vleer">Erst Tiere ausw\u00e4hlen.</div>'; return; }
  box.innerHTML = namen.map(function (nm) {
    return '<div class="vbeh-zeile"><div class="vbeh-kopf"><span>' + esc(nm) + '</span></div>' +
      '<input type="text" class="vinput vbeh-in" data-name="' + esc(nm) + '" value="' + esc(TM.behByName[nm] || '') + '" placeholder="Behandlung \u2026" /></div>';
  }).join('');
  box.oninput = function (e) {
    var t = e.target; if (!t || !t.classList || !t.classList.contains('vbeh-in')) return;
    TM.behByName[t.getAttribute('data-name')] = t.value;
  };
}

/* --- Speichern: EINE Kette (ggf. Kunde -> ggf. Tier -> Termin -> KH-Zeilen) --- */
function tmValidate() {
  if (TM.neuKunde) {
    var pflicht = [['nkVorname', 'Vorname'], ['nkNachname', 'Nachname'], ['nkMobil', 'Mobil'], ['nkStrasse', 'Stra\u00dfe'], ['nkHausnr', 'Hausnummer'], ['nkPlz', 'PLZ'], ['nkOrt', 'Ort']];
    for (var i = 0; i < pflicht.length; i++) if (!val(pflicht[i][0])) return 'Neuer Kunde \u2014 Pflichtfeld fehlt: ' + pflicht[i][1] + '.';
  } else if (!TM.adr) return 'Bitte einen Kunden w\u00e4hlen.';
  if (TM.neuesTier) {
    if (!val('ntName')) return 'Neues Tier \u2014 bitte einen Namen eingeben.';
    if (!val('ntTierart')) return 'Neues Tier \u2014 bitte eine Tierart w\u00e4hlen.';
  }
  if (!TM.pets.length && !TM.neuesTier) return 'Bitte mindestens ein Tier ankreuzen oder neu anlegen.';
  if (!val('tmDatum')) return 'Bitte ein Datum w\u00e4hlen.';
  return '';
}

function tmSave() {
  var err = tmValidate();
  if (err) { tmFeedback(err, 'err'); return; }
  var btn = $('tmSave'); if (btn) btn.disabled = true;

  function schrittKunde(cb) {
    if (!TM.neuKunde) { cb(TM.adr, TM.vorname, TM.nachname); return; }
    tmFeedback('Lege Kunden an \u2026', '');
    seGetNewIndex(null, function (nr) {
      if (!nr) { tmFeedback('Keine Adressnummer aus GET_RELATION 155.', 'err'); if (btn) btn.disabled = false; return; }
      /* Suchbegriff "NACHNAME, VORNAME" -- darueber findet die Adresssuche
         den Kunden (ohne ihn ist der Satz nur per Nummer auffindbar) */
      var suchbegriff = (val('nkNachname') + ', ' + val('nkVorname')).toUpperCase().substring(0, 30);
      sePut('', nr, [
        [FELD.ADR.typ, ADR_TYP_PRIVAT, ADR_VART_NUM], [FELD.ADR.land, 'DE'],
        [FELD.ADR.gruppe, ADR_GRUPPE_NEU],
        [FELD.ADR.such, suchbegriff],
        [FELD.ADR.vorname, val('nkVorname')], [FELD.ADR.nachname, val('nkNachname')],
        [FELD.ADR.strasse, val('nkStrasse')], [FELD.ADR.hausnr, val('nkHausnr')],
        [FELD.ADR.plz, val('nkPlz')], [FELD.ADR.ort, val('nkOrt')],
        [FELD.ADR.mobil, val('nkMobil')], [FELD.ADR.email, val('nkEmail')]
      ], { putNr: ADR_PUT_NR, skipEmpty: true });
      var row = {}; row[FELD.ADR.adr] = String(nr);
      row[FELD.ADR.vorname] = val('nkVorname'); row[FELD.ADR.nachname] = val('nkNachname'); row[FELD.ADR.mobil] = val('nkMobil');
      seAppendRow('Adr', row);
      markerBump('Empfang: Kunde');
      cb(String(nr), val('nkVorname'), val('nkNachname'));
    }, { nr: GET_ADR_NR, params: ['', '', ''] });
  }

  function schrittTiere(adr, cb) {
    /* vorhandene angekreuzte Tiere als einfache Objekte */
    var tiere = (TM.pets || []).map(function (p) {
      return { tierAdresse: getField(p, FELD.HT.pindex), name: getField(p, FELD.HT.name), tierart: getField(p, FELD.HT.tierart),
        unterart: getField(p, FELD.HT.unterart), geburtsdatum: getField(p, FELD.HT.geburtsdatum) };
    });
    if (!TM.neuesTier) { cb(tiere); return; }
    /* Tier-Stamm = Lieferadresse: GET 160 -> neue LFANR, dann PUT 03.
       TODO-Felder (Tierart/Geschlecht/Allergie) ueberspringt sePut, bis
       die Felder in der Lieferadress-GUI existieren. */
    tmFeedback('Lege neues Tier an \u2026', '');
    var g = val('ntGeb'); var gm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(g); var geb = gm ? (gm[3] + '.' + gm[2] + '.' + gm[1]) : g;
    seGetNewIndex(null, function (lfanr) {
      if (!lfanr) { tmFeedback('Keine Tiernummer aus GET_RELATION 160.', 'err'); if (btn) btn.disabled = false; return; }
      sePut('', lfanr, [
        [FELD.HT.adr, adr, 'R'],
        [FELD.HT.name, val('ntName')],
        [FELD.HT.tierart, val('ntTierart')],
        [FELD.HT.unterart, val('ntUnterart')],
        [FELD.HT.geburtsdatum, geb, SE_VART_DATUM],
        [FELD.HT.geschlecht, val('ntGeschlecht')],
        [FELD.HT.kastriert, $('ntKastriert') && $('ntKastriert').checked ? 'J' : 'N'],
        [FELD.HT.gewicht, val('ntGewicht')],
        [FELD.HT.allergie, val('ntAllergie')]
      ], { putNr: LFA_PUT_NR, skipEmpty: true });
      var row = {}; row[FELD.HT.pindex] = String(lfanr); row[FELD.HT.adr] = adr; row[FELD.HT.name] = val('ntName');
      row[FELD.HT.unterart] = val('ntUnterart'); row[FELD.HT.geburtsdatum] = geb; row[FELD.HT.kastriert] = $('ntKastriert') && $('ntKastriert').checked ? 'J' : 'N';
      seAppendRow('Haustiere', row);
      markerBump('Empfang: Haustier');
      tiere.push({ tierAdresse: String(lfanr), name: val('ntName'), tierart: val('ntTierart'), unterart: val('ntUnterart'), geburtsdatum: geb });
      cb(tiere);
    }, { nr: LFA_NEW_NR, params: [] });
  }

  function schrittTermin(adr, vorname, nachname, tiere) {
    var d = val('tmDatum'); var dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
    var datum = dm ? (dm[3] + '.' + dm[2] + '.' + dm[1]) : d;
    var uhrzeit = val('tmUhrzeit');
    var daSein = !!($('tmDaSein') && $('tmDaSein').checked);
    var primary = tiere[0];
    tmFeedback('Lege Termin an \u2026', '');
    seGetNewIndex(TP_IDBID, function (visitIdx) {
      if (!visitIdx) { tmFeedback('Kein Index aus GET_RELATION (' + TP_IDBID + ').', 'err'); if (btn) btn.disabled = false; return; }
      var jobs = [
        [FELD.TP.adr, adr],
        [FELD.TP.name, primary.name], [FELD.TP.tierart, primary.tierart],
        [FELD.TP.unterart, primary.unterart], [FELD.TP.geburtsdatum, primary.geburtsdatum, SE_VART_DATUM],
        [FELD.TP.vorname, vorname], [FELD.TP.nachname, nachname],
        [FELD.TP.datum, datum, SE_VART_DATUM], [FELD.TP.uhrzeit, uhrzeit, SE_VART_ZEIT],
        [FELD.TP.prioritaet, val('tmPrio')],
        [FELD.TP.behandlung, TM.behByName[primary.name] || '']
      ];
      if (daSein) jobs.push([FELD.TP.zimmer, 'Wartezimmer']);
      sePut(TP_IDBID, visitIdx, jobs);
      if (daSein) { setCheckin(visitIdx); belegAnlegen(adr, visitIdx); }
      (function saveKH(i) {
        if (i >= tiere.length) {
          tmFeedback('Gespeichert \u2014 Termin #' + visitIdx + ' mit ' + tiere.length + ' Tier(en).', 'ok');
          if (btn) btn.disabled = false;
          markerBump('Empfang: Termin');
          setTimeout(function () { closeTerminModal(); seStartTool(REFRESH_TOOL); }, 800);
          return;
        }
        tmFeedback('Lege Tier ' + (i + 1) + ' / ' + tiere.length + ' an \u2026', '');
        seGetNewIndex(KH_IDBID, function (petIdx) {
          if (!petIdx) { tmFeedback('Kein Index f\u00fcr Tier ' + (i + 1) + ' (' + KH_IDBID + ').', 'err'); if (btn) btn.disabled = false; return; }
          sePut(KH_IDBID, petIdx, [
            [FELD.KH.adr, adr], [FELD.KH.tierAdresse, tiere[i].tierAdresse], [FELD.KH.name, tiere[i].name],
            [FELD.KH.tierart, tiere[i].tierart], [FELD.KH.rasse, tiere[i].unterart],
            [FELD.KH.geburtsdatum, tiere[i].geburtsdatum, SE_VART_DATUM], [FELD.KH.termindatum, datum, SE_VART_DATUM],
            [FELD.KH.behandlung, TM.behByName[tiere[i].name] || ''], [FELD.KH.besuchId, visitIdx]
          ]);
          saveKH(i + 1);
        });
      })(0);
    });
  }

  schrittKunde(function (adr, vn, nn) {
    schrittTiere(adr, function (tiere) {
      schrittTermin(adr, vn, nn, tiere);
    });
  });
}

/* ===== Start ===== */
function initApp() {
  viewStateLaden(); /* zuletzt gewaehlte Ansicht/Datum aus localStorage wiederherstellen */
  setVal('dateInput', SELECTED_DATE);
  on('dateInput', 'change', function () { SELECTED_DATE = dateKey(val('dateInput')) || todayKey(); renderCurrent(); });
  on('btnPrev', 'click', function () { SELECTED_DATE = addDays(SELECTED_DATE, -1); renderCurrent(); });
  on('btnNext', 'click', function () { SELECTED_DATE = addDays(SELECTED_DATE, 1); renderCurrent(); });
  on('btnToday', 'click', function () { SELECTED_DATE = todayKey(); renderCurrent(); });
  on('searchInput', 'input', function () { SEARCH = val('searchInput'); renderCurrent(); });
  on('btnNeuerTermin', 'click', openTerminModal);
  /* Sidebar ein-/ausklappen (wie Huelle B) */
  on('navToggle', 'click', function () { var a = $('app'); if (a) a.classList.toggle('is-nav-offen'); });
  on('navOverlay', 'click', function () { var a = $('app'); if (a) a.classList.remove('is-nav-offen'); });
  /* Sidebar-Navigation: Ansicht wechseln (klappt die Sidebar wieder ein) */
  document.addEventListener('click', function (e) {
    var it = e.target.closest ? e.target.closest('.vnav-item[data-view]') : null;
    if (it) { setView(it.getAttribute('data-view')); var a = $('app'); if (a) a.classList.remove('is-nav-offen'); }
  });
  /* Terminkalender: Tag/Woche, Block -> Kartei, freie Luecke -> Termin anlegen */
  on('view-termine', 'click', function (e) {
    var nav = e.target.closest ? e.target.closest('[data-cal-nav]') : null;
    if (nav) {
      var dir = nav.getAttribute('data-cal-nav'), step = CAL_MODE === 'tag' ? 1 : 7;
      if (dir === 'today') SELECTED_DATE = todayKey();
      else SELECTED_DATE = addDays(SELECTED_DATE, dir === 'prev' ? -step : step);
      setVal('dateInput', SELECTED_DATE); renderTermine(); return;
    }
    var seg = e.target.closest ? e.target.closest('[data-cal]') : null;
    if (seg) { CAL_MODE = seg.getAttribute('data-cal'); renderTermine(); return; }
    var blk = e.target.closest ? e.target.closest('[data-pidx]') : null;
    if (blk) { karteiOeffnen(blk.getAttribute('data-pidx')); return; }
    var slot = e.target.closest ? e.target.closest('.vcal-slot') : null;
    if (slot) { openTerminModalAt(slot.getAttribute('data-day'), slot.getAttribute('data-h')); return; }
  });
  on('btnRefresh', 'click', function () { seStartTool(REFRESH_TOOL); });
  on('tmClose', 'click', closeTerminModal);
  on('tmAbbrechen', 'click', closeTerminModal);
  on('terminModal', 'click', function (e) { if (e.target === e.currentTarget) closeTerminModal(); });
  on('tmSuche', 'input', tmRenderSuche);
  on('tmSuche', 'keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); tmPickerOeffnen(); }
    else if (e.key === 'Escape') { var s = $('tmSucheListe'); if (s) s.hidden = true; }
  });
  on('tmSuche', 'focus', function () { if (val('tmSuche')) tmRenderSuche(); });
  on('tmSucheListe', 'mousedown', function (e) {
    var z = e.target.closest ? e.target.closest('.vsuche-zeile') : null; if (!z) return;
    e.preventDefault();
    tmWaehleKunde(z.getAttribute('data-adr'), z.getAttribute('data-vn') || '', z.getAttribute('data-nn') || '');
  });
  on('tmKundeNeu', 'click', tmNeuKundeToggle);
  on('tmPickerZu', 'click', tmPickerSchliessen);
  on('tmPicker', 'click', function (e) { if (e.target === e.currentTarget) tmPickerSchliessen(); });
  on('tmPickerSuche', 'input', tmPickerRender);
  on('tmPickerSuche', 'keydown', function (e) { if (e.key === 'Escape') tmPickerSchliessen(); });
  on('tmPickerListe', 'click', function (e) {
    var z = e.target.closest ? e.target.closest('tr[data-adr]') : null; if (!z) return;
    tmWaehleKunde(z.getAttribute('data-adr'), z.getAttribute('data-vn') || '', z.getAttribute('data-nn') || '');
  });
  document.addEventListener('mousedown', function (e) {
    var s = $('tmSucheListe');
    if (s && !s.hidden && !e.target.closest('.vsuche')) s.hidden = true;
  });
  on('ntName', 'input', tmRenderBehandlung);
  on('tmSave', 'click', tmSave);
  /* Live-Uhr in der Kopfzeile */
  function uhrTick() {
    var d = new Date();
    var z = $('uhrZeit'), t = $('uhrDatum');
    if (z) z.textContent = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    if (t) t.textContent = d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  uhrTick();
  setInterval(uhrTick, 10000);
  /* Patientenkartei */
  karteiBind();
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape') karteiSchliessen(); });
  setupDragDrop();
  /* Wartezeiten & Jetzt-Linie aktuell halten */
  setInterval(function () { if (!document.querySelector('.vov.is-open') && !__dragEl) renderCurrent(); }, 30000);
  /* Wiederhergestellte Ansicht anwenden (Sichtbarkeit, Navi, Kopf) -- sonst zeigt
     die Maske nach einem Refresh trotz gemerktem State das Default-Board. */
  setView(ACTIVE_VIEW);
}

function ensureFullWidth() {
  var el = $('app');
  while (el && el !== document.documentElement) {
    try { el.style.setProperty('max-width', 'none', 'important'); el.style.setProperty('width', '100%', 'important'); } catch (e) {}
    el = el.parentElement;
  }
}

initApp();
ensureFullWidth();
window.addEventListener('resize', ensureFullWidth);
window.addEventListener('load', ensureFullWidth);
seBoot(renderCurrent);

/* ===== Live-Sync v2 \u2014 Marker-Tabelle ID0023 (Logik von Fable) =====
   Tabelle laut GUI-Neuanlage 2026-08-04: Index R0 0_10 (= Schreib-Index),
   Zeitstempel L 10_60 (das ist MARKER_FELD), Refresh L 70_60 (unbenutzt). */
var MARKER_IDB = 'ID0023', MARKER_FELD = '10_60';
var __markerBase = -1;
var __markerBusy = false;
var __markerPending = false;
var __lastSync = 0;
var __lastActivity = Date.now();

['mousemove', 'mousedown', 'keydown', 'input', 'scroll', 'touchstart', 'dragstart']
  .forEach(function (evt) {
    window.addEventListener(evt, function () { __lastActivity = Date.now(); }, true);
  });

function markerStamp(quelle) {
  var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
  return quelle + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

/* D4 -- WACHSTUM: markerBump haengt pro Aktion einen NEUEN Satz an die Marker-Tabelle an;
   die Tabelle waechst unbegrenzt. NICHT auf einen einzelnen Hochzaehl-Satz umbauen!
   Die Aenderungs-Erkennung unten zaehlt Saetze (seCountRows); die Eindeutigkeit der
   seGetNewIndex-Indizes ist hier der Nebenlaeufigkeits-Schutz: bei zwei gleichzeitigen
   Aktionen sehen BEIDE Arbeitsplaetze die jeweils andere Aenderung. Ein gemeinsamer
   Zaehler (read-modify-write) wuerde unter Gleichzeitigkeit Benachrichtigungen
   verlieren (Lost-Update). Sicherer Bounded-Fix = die Marker-Tabelle in einem ruhigen Fenster
   leeren (z.B. nachts / Praxis zu); der "n < __markerBase"-Zweig unten faengt das
   bereits als stille Re-Baseline ab. Umsetzung + Test nur mit echter SoftEngine
   (Mehrplatz, Timing). */
function markerBump(quelle) {
  seGetNewIndex(MARKER_IDB, function (idx) {
    if (!idx) { return; }
    sePut(MARKER_IDB, idx, [[MARKER_FELD, markerStamp(quelle)]]);
    if (__markerBase >= 0) __markerBase++;
  });
}

function userIsBusy() {
  if (document.querySelector('.vov.is-open')) return true;
  if (document.querySelector('.vkarte.is-dragging')) return true;
  if (document.querySelector('#tmSave:disabled')) return true;
  if (Date.now() - __lastActivity < 15000) return true;
  return false;
}

function markerBanner(show) {
  var b = document.getElementById('lsBanner');
  if (!show) { if (b) b.remove(); return; }
  if (b) return;
  b = document.createElement('div');
  b.id = 'lsBanner';
  b.className = 'ls-banner';
  b.innerHTML = '<span>Es gibt \u00c4nderungen.</span><button type="button">Jetzt aktualisieren</button>';
  b.querySelector('button').addEventListener('click', function () {
    __markerPending = false;
    __lastSync = Date.now();
    markerBanner(false);
    seStartTool(REFRESH_TOOL, null, { debounce: true });
  });
  document.body.appendChild(b);
}

setInterval(function () {
  if (!seHaveData()) return;
  if (__markerPending && !userIsBusy() && !window.__seIndexWaiting && Date.now() - __lastSync >= 12000) {
    __markerPending = false;
    __lastSync = Date.now();
    markerBanner(false);
    seStartTool(REFRESH_TOOL, null, { debounce: true });
    return;
  }
  if (__markerBusy || window.__seIndexWaiting) return;
  __markerBusy = true;
  seCountRows(MARKER_IDB, function (n) {
    __markerBusy = false;
    n = parseInt(n, 10);
    if (isNaN(n)) return;
    if (n > 5000) logWarn('Marker-Tabelle ' + MARKER_IDB + ' hat ' + n + ' Saetze -- Aufraeumen einplanen (siehe Kommentar an markerBump, D4)');
    if (__markerBase < 0) { __markerBase = n; return; }
    if (n < __markerBase) { __markerBase = n; return; }
    if (n > __markerBase) {
      __markerBase = n;
      __markerPending = true;
      markerBanner(true);
    }
  });
}, 5000);

})();
  
</script>
