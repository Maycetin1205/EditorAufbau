<!DOCTYPE html>

  <title>Behandlungszimmer · Tierarztpraxis</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #6b7280;
      --line: #eceef1;
      --green: #0f8a5f;
      --green-soft: #e7f6ee;
      --blue: #2563eb;
      --blue-soft: #eff5ff;
      --amber: #b45309;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .ic { width: 20px; height: 20px; display: block; flex: 0 0 auto; }

    .room {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px 28px;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ---------- Topbar ---------- */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-icon {
      width: 44px; height: 44px;
      border-radius: 13px;
      display: grid; place-items: center;
      background: var(--green-soft);
      color: var(--green);
    }
    .brand-icon .ic { width: 25px; height: 25px; }
    .topbar h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.4px; }
    .topbar .sub { color: var(--muted); font-size: 13px; }
    .room-tag {
      margin-left: auto;
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--blue-soft); color: var(--blue);
      font-weight: 700; font-size: 15px;
      padding: 8px 16px; border-radius: 999px;
    }
    .clock { font-variant-numeric: tabular-nums; color: #475467; font-weight: 600; font-size: 15px; }

    /* ---------- Patienten-Kopf ---------- */
    .patient {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 26px 28px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .patient-avatar {
      width: 104px; height: 104px;
      border-radius: 50%;
      background: #f1f5f9; color: #475569;
      display: grid; place-items: center;
      flex: 0 0 auto;
    }
    .patient-avatar .ic { width: 60px; height: 60px; }
    .patient-id { flex: 1; min-width: 0; }
    .patient-id h2 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.05; }
    .patient-id .species { color: var(--muted); font-size: 17px; margin-top: 4px; }
    .patient-meta {
      display: flex; flex-wrap: wrap; gap: 8px 22px;
      margin-top: 14px;
    }
    .patient-meta .item { display: flex; align-items: center; gap: 7px; color: #344054; font-size: 15px; }
    .patient-meta .ic { width: 17px; height: 17px; color: #94a3b8; }
    .patient-meta b { font-weight: 600; }
    .badge {
      display: inline-block;
      padding: 6px 14px; border-radius: 999px;
      font-size: 14px; font-weight: 700;
      background: #e3edff; color: #1d4ed8;
      align-self: flex-start;
      white-space: nowrap;
    }
    .badge.akut { background: #fde8e8; color: #c0392b; }
    .badge.operation { background: #e3edff; color: #1d4ed8; }
    .badge.abgeschlossen { background: #efe7fe; color: #6d28d9; }

    /* ---------- Grid ---------- */
    .grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
      flex: 1;
      min-height: 0;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .card-head {
      display: flex; align-items: center; gap: 9px;
      padding-bottom: 14px; margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    .card-head .ic { width: 19px; height: 19px; color: #64748b; }
    .card-head h3 { margin: 0; font-size: 16px; font-weight: 700; }
    .card.span2 { grid-column: 1 / -1; }

    /* Aktueller Fall */
    .reason { font-size: 18px; color: #1f2937; line-height: 1.5; }
    .reason .label { color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; display: block; margin-bottom: 4px; }
    .reason + .reason { margin-top: 16px; }

    /* Vitaldaten */
    .vitals { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
    .vital {
      background: #f8fafc; border: 1px solid var(--line);
      border-radius: 12px; padding: 14px 16px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .vital .v-label { color: var(--muted); font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .vital .v-label .ic { width: 15px; height: 15px; color: #94a3b8; }
    .vital .v-value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .vital .v-value small { font-size: 14px; font-weight: 600; color: var(--muted); }

    /* Listen (Verlauf / Belege) */
    .rows { display: flex; flex-direction: column; gap: 0; overflow: auto; }
    .row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 2px;
      border-bottom: 1px solid #f1f5f9;
    }
    .row:last-child { border-bottom: none; }
    .row .date { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; width: 92px; flex: 0 0 auto; }
    .row .main { flex: 1; min-width: 0; }
    .row .main .t { font-size: 14.5px; color: #1f2937; font-weight: 500; }
    .row .main .s { font-size: 13px; color: var(--muted); margin-top: 1px; }
    .row .amount { font-weight: 700; font-variant-numeric: tabular-nums; }
    .row .pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #f1f5f9; color: #475467; }
    .row .pill.open { background: #fdf0d5; color: var(--amber); }
    .row .pill.paid { background: var(--green-soft); color: var(--green); }

    .empty { color: var(--muted); font-size: 14px; font-style: italic; padding: 18px 2px; }
    .no-patient {
      flex: 1; display: grid; place-items: center;
      color: var(--muted); font-size: 18px; text-align: center;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .patient { flex-direction: column; text-align: center; align-items: center; }
      .patient-meta { justify-content: center; }
    }
  </style>
</head>

    function alterAus(geb) {
      var d = parseDatum(geb);
      if (!d) return '';
      var now = new Date();
      var jahre = now.getFullYear() - d.getFullYear();
      var mo = now.getMonth() - d.getMonth();
      if (mo < 0 || (mo === 0 && now.getDate() < d.getDate())) jahre--;
      if (jahre < 0) return '';
      if (jahre === 0) {
        var monate = mo + (mo < 0 ? 12 : 0);
        return monate + ' Mon.';
      }
      return jahre + (jahre === 1 ? ' Jahr' : ' Jahre');
    }

    /* =====================================================================
       4) Patient bestimmen (aktueller Fall) + Verlauf + Belege
       ===================================================================== */
    function istInBehandlung(termin) {
      if (RAUM) {
        if (getField(termin, FELD.TP.zimmer) !== String(RAUM)) return false;
      }
      if (BEHANDLUNG_MATCH.length) {
        var v = getField(termin, FELD.TP.behandlung).toLowerCase();
        for (var i = 0; i < BEHANDLUNG_MATCH.length; i++)
          if (v.indexOf(String(BEHANDLUNG_MATCH[i]).toLowerCase()) !== -1) return true;
        return false;
      }
      return true; // ohne Match: erster Treffer des Raums
    }

    function petOf(termin, tiere) {
      var adr = getField(termin, FELD.TP.adr);
      for (var i = 0; i < tiere.length; i++) if (getField(tiere[i], FELD.KH.adr) === adr) return tiere[i];
      return {};
    }

    /* =====================================================================
       5) Rendern
       ===================================================================== */
    function vital(label, iconName, value, unit) {
      if (!value) return '';
      return '<div class="vital"><span class="v-label">' + ic(iconName) + esc(label) + '</span>' +
             '<span class="v-value">' + esc(value) + (unit ? ' <small>' + esc(unit) + '</small>' : '') + '</span></div>';
    }

    function render() {
      var room = document.getElementById('room');
      var termine = loadRows('Terminplaner');
      var tiere = loadRows('Kundenhaustiere');
      var belege = loadRows('Belege');
      var haveData = window.__FF_DEMO || !(typeof SEDATA === 'undefined' || !SEDATA || !SEDATA.Daten);

      // Topbar (immer)
      var head = '' +
        '<div class="topbar">' +
          '<div class="brand-icon">' + ic('stethoscope') + '</div>' +
          '<div><h1>Behandlungszimmer</h1><div class="sub">Tierarztpraxis Am Stadtpark</div></div>' +
          (RAUM ? '<span class="room-tag">' + ic('stethoscope') + 'Zimmer ' + esc(RAUM) + '</span>' : '') +
          '<span class="clock" id="clock"></span>' +
        '</div>';

      // Aktuellen Patienten finden
      var aktuell = null;
      for (var i = 0; i < termine.length; i++) { if (istInBehandlung(termine[i])) { aktuell = termine[i]; break; } }

      if (!aktuell) {
        room.innerHTML = head + '<div class="no-patient">' +
          (haveData ? 'Kein Patient im Behandlungszimmer' + (RAUM ? ' ' + esc(RAUM) : '') + '.' : 'Warte auf SoftEngine-Daten …') +
          '</div>';
        startClock();
        return;
      }

      var pet = petOf(aktuell, tiere);
      var tierart = getField(pet, FELD.KH.tierart) || getField(aktuell, FELD.TP.tierart);
      var rasse   = getField(pet, FELD.KH.rasse)   || getField(aktuell, FELD.TP.unterart);
      var name    = getField(pet, FELD.KH.name)    || getField(aktuell, FELD.TP.name);
      var geb     = getField(pet, FELD.KH.geburtsdatum) || getField(aktuell, FELD.TP.geburtsdatum);
      var gesch   = getField(pet, FELD.KH.geschlecht)   || getField(aktuell, FELD.TP.geschlecht);
      var alter   = alterAus(geb);
      var owner   = (getField(aktuell, FELD.TP.vorname) + ' ' + getField(aktuell, FELD.TP.nachname)).trim();
      var telefon = getField(aktuell, FELD.TP.telefon);
      var behandlung = getField(aktuell, FELD.TP.behandlung);
      var symptome   = getField(aktuell, FELD.TP.symptome);
      var uhrzeit = getField(aktuell, FELD.TP.uhrzeit);
      var zimmer  = getField(aktuell, FELD.TP.zimmer);
      var arzt    = getField(aktuell, FELD.TP.arzt);
      var sub = tierart + (tierart && rasse ? ' · ' : '') + rasse;

      // Patienten-Kopf
      var kopf = '<div class="patient">' +
        '<div class="patient-avatar">' + tierIcon(tierart) + '</div>' +
        '<div class="patient-id">' +
          '<h2>' + (esc(name) || '—') + '</h2>' +
          (sub ? '<div class="species">' + esc(sub) + '</div>' : '') +
          '<div class="patient-meta">' +
            (owner   ? '<span class="item">' + ic('user') + '<b>' + esc(owner) + '</b></span>' : '') +
            (telefon ? '<span class="item">' + ic('phone') + esc(telefon) + '</span>' : '') +
            (gesch   ? '<span class="item">' + ic('gender') + esc(gesch) + '</span>' : '') +
            (alter   ? '<span class="item">' + ic('cake') + esc(alter) + '</span>' : '') +
          '</div>' +
        '</div>' +
        (behandlung ? '<span class="badge ' + badgeClass(behandlung) + '">' + (zimmer ? 'Zimmer ' + esc(zimmer) : 'In Behandlung') + '</span>' : '') +
      '</div>';

      // Aktueller Fall
      var fall = '<div class="card span2">' +
        '<div class="card-head">' + ic('stethoscope') + '<h3>Aktueller Fall</h3></div>' +
        (symptome ? '<div class="reason"><span class="label">Grund / Symptome</span>' + esc(symptome) + '</div>' : '') +
        (behandlung ? '<div class="reason"><span class="label">Behandlung</span>' + esc(behandlung) + '</div>' : '') +
        '<div class="patient-meta" style="margin-top:18px">' +
          (uhrzeit ? '<span class="item">' + ic('clock') + 'Heute, ' + esc(uhrzeit) + '</span>' : '') +
          (arzt    ? '<span class="item">' + ic('stethoscope') + esc(arzt) + '</span>' : '') +
        '</div>' +
      '</div>';

      // Vitaldaten
      var vitalsHtml = '' +
        vital('Gewicht', 'scale', getField(aktuell, FELD.TP.gewicht), 'kg') +
        vital('Temperatur', 'thermo', getField(aktuell, FELD.TP.temperatur), '°C') +
        vital('Puls', 'heart', getField(aktuell, FELD.TP.puls), '/min');
      var vitals = '<div class="card">' +
        '<div class="card-head">' + ic('heart') + '<h3>Vitaldaten</h3></div>' +
        (vitalsHtml ? '<div class="vitals">' + vitalsHtml + '</div>' : '<div class="empty">Noch keine Vitaldaten erfasst</div>') +
      '</div>';

      // Verlauf: andere Termine desselben Tieres (per Adressnummer), nach Datum absteigend
      var adr = getField(aktuell, FELD.TP.adr);
      var verlauf = termine.filter(function (t) {
        return t !== aktuell && getField(t, FELD.TP.adr) === adr;
      }).sort(function (a, b) {
        var da = parseDatum(getField(a, FELD.TP.datum)), db = parseDatum(getField(b, FELD.TP.datum));
        return (db ? db.getTime() : 0) - (da ? da.getTime() : 0);
      });
      var verlaufRows = verlauf.map(function (t) {
        return '<div class="row">' +
          '<span class="date">' + esc(getField(t, FELD.TP.datum) || '—') + '</span>' +
          '<span class="main"><span class="t">' + (esc(getField(t, FELD.TP.behandlung)) || '—') + '</span>' +
          (getField(t, FELD.TP.arzt) ? '<span class="s">' + esc(getField(t, FELD.TP.arzt)) + '</span>' : '') + '</span>' +
        '</div>';
      }).join('');
      var verlaufCard = '<div class="card">' +
        '<div class="card-head">' + ic('calendar') + '<h3>Verlauf</h3></div>' +
        (verlaufRows ? '<div class="rows">' + verlaufRows + '</div>' : '<div class="empty">Keine früheren Behandlungen</div>') +
      '</div>';

      // Vergangene Belege (per Adressnummer)
      var meineBelege = belege.filter(function (b) { return getField(b, FELD.BEL.adr) === adr; });
      var belegRows = meineBelege.map(function (b) {
        var st = getField(b, FELD.BEL.status);
        var stl = st.toLowerCase();
        var pill = stl.indexOf('offen') !== -1 ? 'open' : (stl.indexOf('bezahlt') !== -1 ? 'paid' : '');
        return '<div class="row">' +
          '<span class="date">' + esc(getField(b, FELD.BEL.datum) || '—') + '</span>' +
          '<span class="main"><span class="t">' + (esc(getField(b, FELD.BEL.bezeichnung)) || esc(getField(b, FELD.BEL.nummer)) || '—') + '</span></span>' +
          (st ? '<span class="pill ' + pill + '">' + esc(st) + '</span>' : '') +
          (getField(b, FELD.BEL.betrag) ? '<span class="amount">' + esc(getField(b, FELD.BEL.betrag)) + ' €</span>' : '') +
        '</div>';
      }).join('');
      var belegCard = '<div class="card span2">' +
        '<div class="card-head">' + ic('file') + '<h3>Vergangene Belege</h3></div>' +
        (belegRows ? '<div class="rows">' + belegRows + '</div>' : '<div class="empty">Keine Belege vorhanden</div>') +
      '</div>';

      room.innerHTML = head + kopf +
        '<div class="grid">' + fall + vitals + verlaufCard + belegCard + '</div>';
      startClock();
    }
    window.__FF_render = render;

    var _clockTimer = null;
    function startClock() {
      var el = document.getElementById('clock');
      if (!el) return;
      function tick() {
        var n = new Date();
        var hh = ('0' + n.getHours()).slice(-2), mm = ('0' + n.getMinutes()).slice(-2);
        el.textContent = hh + ':' + mm + ' Uhr';
      }
      tick();
      if (_clockTimer) clearInterval(_clockTimer);
      _clockTimer = setInterval(tick, 30000);
    }

    /* =====================================================================
       6) LOKALER DEMO-MODUS (nur ohne SEDATA + URL enthält ?demo)
       ===================================================================== */
    (function () {
      var demo = (typeof SEDATA === 'undefined') && /[?&]demo\b/.test(location.search);
      if (!demo) return;

      FELD.TP.geschlecht = '__g'; FELD.TP.gewicht = '__w'; FELD.TP.temperatur = '__t';
      FELD.TP.puls = '__p'; FELD.TP.symptome = '__sym'; FELD.TP.arzt = '__arzt'; FELD.TP.telefon = '__tel';
      FELD.BEL.adr = '__badr'; FELD.BEL.datum = '__bdat'; FELD.BEL.nummer = '__bnr';
      FELD.BEL.bezeichnung = '__bbez'; FELD.BEL.betrag = '__bbetr'; FELD.BEL.status = '__bst';

      function tp(o) {
        var r = {};
        r[FELD.TP.adr] = o.adr; r[FELD.TP.name] = o.name || ''; r[FELD.TP.tierart] = o.art || '';
        r[FELD.TP.vorname] = o.vn || ''; r[FELD.TP.nachname] = o.nn || '';
        r[FELD.TP.behandlung] = o.beh || ''; r[FELD.TP.uhrzeit] = o.zeit || ''; r[FELD.TP.datum] = o.dat || '';
        r[FELD.TP.zimmer] = o.zi || ''; r['__sym'] = o.sym || ''; r['__arzt'] = o.arzt || ''; r['__tel'] = o.tel || '';
        r['__g'] = o.g || ''; r['__w'] = o.w || ''; r['__t'] = o.t || ''; r['__p'] = o.puls || '';
        return r;
      }
      function kh(o) { var r = {}; r[FELD.KH.adr] = o.adr; r[FELD.KH.name] = o.name; r[FELD.KH.tierart] = o.art; r[FELD.KH.rasse] = o.rasse; r[FELD.KH.geburtsdatum] = o.geb; return r; }
      function bel(o) { var r = {}; r['__badr'] = o.adr; r['__bdat'] = o.dat; r['__bbez'] = o.bez; r['__bbetr'] = o.betr; r['__bst'] = o.st; return r; }

      window.__FF_DEMO = {
        Terminplaner: [
          tp({ adr: 'K6', vn: 'Sophie', nn: 'Lehmann', beh: 'Lahmheit hinten links', sym: 'Seit 3 Tagen lahmt das hintere linke Bein, Schonhaltung.', zeit: '09:20', dat: '01.06.2026', zi: '1', arzt: 'Dr. Weber', tel: '0151 2345678', g: 'männlich', w: '32,4', t: '38,6', puls: '92' }),
          // Verlauf desselben Tieres (gleiche Adressnummer K6):
          tp({ adr: 'K6', beh: 'Impfung Tollwut', dat: '12.11.2025', arzt: 'Dr. Weber' }),
          tp({ adr: 'K6', beh: 'Routinekontrolle', dat: '03.06.2025', arzt: 'Dr. Sahin' }),
          tp({ adr: 'K6', beh: 'Kastration', dat: '20.01.2024', arzt: 'Dr. Weber' })
        ],
        Kundenhaustiere: [
          kh({ adr: 'K6', name: 'Rocky', art: 'Hund', rasse: 'Labrador', geb: '14.03.2019' })
        ],
        Belege: [
          bel({ adr: 'K6', dat: '12.11.2025', bez: 'Impfung Tollwut', betr: '48,50', st: 'Bezahlt' }),
          bel({ adr: 'K6', dat: '03.06.2025', bez: 'Routinekontrolle', betr: '36,00', st: 'Bezahlt' }),
          bel({ adr: 'K6', dat: '20.01.2024', bez: 'Kastration', betr: '245,00', st: 'Offen' })
        ]
      };
    })();

    /* =====================================================================
       7) Boot
       ===================================================================== */
    render();
    (function () {
      var tries = 0;
      var poll = setInterval(function () {
        tries++;
        if (typeof SEDATA !== 'undefined' && SEDATA && SEDATA.Daten) {
          clearInterval(poll);
          try { if (typeof ResetDataBasis === 'function') ResetDataBasis(); } catch (e) {}
          try { if (typeof InitialisiereDatenBasis === 'function') InitialisiereDatenBasis(); } catch (e) {}
          render();
        } else if (tries > 100) { clearInterval(poll); }
      }, 300);
    })();
  </script>
</body>
</html>
