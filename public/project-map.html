<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Systemkarte · Aufbau Editor</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f3f5f8;
      --panel: #ffffff;
      --panel-subtle: #f8fafc;
      --ink: #172033;
      --ink-soft: #5f6b7c;
      --ink-faint: #8b95a5;
      --line: #dce2ea;
      --line-strong: #c8d0dc;
      --accent: #2563eb;
      --accent-soft: #eaf1ff;
      --accent-line: #9db8ff;
      --blue: #2563eb;
      --teal: #087f78;
      --amber: #b76412;
      --violet: #7651c9;
      --rose: #bd3f61;
      --slate: #64748b;
      --shadow-sm: 0 1px 2px rgba(23, 32, 51, .05), 0 7px 24px rgba(23, 32, 51, .05);
      --shadow-lg: 0 22px 55px rgba(23, 32, 51, .11);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--page); color: var(--ink); }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .app-header {
      position: relative; z-index: 10; display: flex; align-items: center; gap: 16px;
      min-height: 54px; padding: 7px 14px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.96);
    }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 175px; }
    .brand-mark { display: grid; grid-template-columns: repeat(2, 6px); gap: 3px; padding: 7px; border-radius: 8px; background: var(--ink); }
    .brand-mark span { width: 6px; height: 6px; border-radius: 2px; background: #fff; }
    .brand-mark span:last-child { background: #7da2ff; }
    .brand h1 { margin: 0; font-size: 17px; font-weight: 720; letter-spacing: -.02em; }
    .brand p { display: none; }
    .view-tabs { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel-subtle); }
    .view-tab { padding: 6px 11px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-soft); cursor: pointer; font-size: 12px; font-weight: 650; }
    .view-tab:hover { color: var(--ink); background: #fff; }
    .view-tab.active { color: var(--ink); background: #fff; box-shadow: 0 1px 4px rgba(23,32,51,.12); }
    .header-meta { display: flex; align-items: center; gap: 9px; margin-left: auto; }
    .header-meta-text { text-align: right; }
    .header-meta strong { display: block; font-size: 10px; font-weight: 680; }
    .header-meta span { color: var(--ink-soft); font-size: 9px; }
    .freshness-button { height: 31px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: #fff; cursor: pointer; font-size: 10px; font-weight: 700; }
    .freshness-button:hover { border-color: var(--accent-line); background: var(--accent-soft); }
    .freshness-button.ok { border-color: #93d4bd; background: #edf9f4; color: #086b4e; }
    .freshness-button.warn { border-color: #e8bd73; background: #fff8e8; color: #8a4b0c; }
    .toolbar { display: flex; align-items: center; gap: 8px; min-height: 47px; padding: 6px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .toolbar-group { display: none; width: 100%; align-items: end; gap: 10px; }
    .toolbar-group.active { display: flex; }
    .control { display: flex; align-items: center; gap: 7px; min-width: 170px; }
    .control.grow { flex: 1; }
    .control-label { color: var(--ink-soft); font-size: 11px; font-weight: 650; }
    select, input[type="search"] { height: 32px; padding: 5px 9px; border: 1px solid var(--line-strong); border-radius: 7px; background: #fff; color: var(--ink); outline: none; font-size: 12px; }
    select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .check { display: inline-flex; align-items: center; gap: 7px; min-height: 32px; color: var(--ink-soft); font-size: 11px; white-space: nowrap; }
    .check input { width: 15px; height: 15px; accent-color: var(--accent); }
    .tool-buttons { display: flex; gap: 5px; margin-left: auto; }
    .tool-button { min-width: 32px; height: 32px; padding: 0 9px; border: 1px solid var(--line-strong); border-radius: 7px; background: #fff; cursor: pointer; font-size: 11px; font-weight: 650; }
    .tool-button:hover { border-color: var(--accent-line); background: var(--accent-soft); }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 0; height: calc(100vh - 102px); min-height: 520px; transition: grid-template-columns .18s ease; }
    .workspace.details-open { grid-template-columns: minmax(0, 1fr) 300px; }
    .stage { position: relative; min-width: 0; overflow: hidden; background-color: var(--page); background-image: radial-gradient(#cfd6e1 1px, transparent 1px); background-size: 22px 22px; }
    .stage-title { position: absolute; z-index: 2; top: 14px; left: 18px; pointer-events: none; }
    .stage-title h2 { margin: 0; font-size: 17px; letter-spacing: -.025em; }
    .stage-title p { max-width: 600px; margin: 4px 0 0; color: var(--ink-soft); font-size: 12px; line-height: 1.45; }
    #graph { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; }
    #graph.grabbing { cursor: grabbing; }
    .canvas-hint { position: absolute; left: 18px; bottom: 15px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; background: rgba(255,255,255,.9); color: var(--ink-soft); font-size: 11px; pointer-events: none; }
    .details { position: relative; visibility: hidden; overflow: auto; border-left: 1px solid var(--line); background: var(--panel); opacity: 0; transition: opacity .14s ease; }
    .details-open .details { visibility: visible; opacity: 1; }
    .details-close { position: sticky; z-index: 2; top: 8px; float: right; width: 27px; height: 27px; margin: 8px 8px -35px 0; border: 1px solid var(--line); border-radius: 7px; background: #fff; cursor: pointer; font-size: 17px; line-height: 1; }
    .details-inner { padding: 18px 16px 24px; }
    .detail-eyebrow { margin-bottom: 7px; color: var(--accent); font-size: 10px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
    .details h2 { margin: 0; font-size: 19px; line-height: 1.25; letter-spacing: -.025em; overflow-wrap: anywhere; }
    .details p { margin: 8px 0 0; color: var(--ink-soft); font-size: 12.5px; line-height: 1.55; }
    .detail-path { display: block; margin-top: 8px; color: var(--ink-soft); font: 11px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
    .metric-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 18px; }
    .metric { padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel-subtle); }
    .metric strong { display: block; font-size: 17px; }
    .metric span { color: var(--ink-soft); font-size: 10px; }
    .details h3 { margin: 22px 0 8px; color: var(--ink-soft); font-size: 10px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .detail-list { display: grid; gap: 6px; }
    .detail-button { width: 100%; padding: 8px 9px; border: 1px solid var(--line); border-radius: 7px; background: #fff; cursor: pointer; text-align: left; color: var(--ink); font: 11px/1.35 ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
    .detail-button:hover { border-color: var(--accent-line); background: var(--accent-soft); }
    .detail-button.system { display: flex; justify-content: space-between; font-family: inherit; font-weight: 620; }
    .detail-button span { color: var(--ink-soft); font-size: 10px; font-weight: 500; }
    .empty { color: var(--ink-faint); font-size: 12px; }
    .legend { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 22px; padding-top: 15px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 10px; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-line { width: 20px; height: 0; border-top: 2px solid var(--slate); }
    .legend-line.type { border-top-style: dashed; }
    .legend-line.package { border-color: #9aa4b3; border-top-style: dotted; }
    .edge { fill: none; stroke: #9aa6b7; stroke-width: 1.35; opacity: .28; vector-effect: non-scaling-stroke; }
    .edge.arch { stroke: #8290a4; stroke-width: 1.55; opacity: .42; }
    .edge.support { stroke-dasharray: 5 5; opacity: .22; }
    .edge.type { stroke-dasharray: 5 4; }
    .edge.style, .edge.asset { stroke: #b76412; }
    .edge.package { stroke-dasharray: 2 5; }
    .edge.is-related { opacity: .95; stroke: var(--accent); stroke-width: 2.3; }
    .edge.is-muted { opacity: .035; }
    .edge-label { fill: #fff; stroke: var(--line-strong); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .edge-label-text { fill: var(--ink-soft); font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .node { cursor: pointer; color: var(--node-color, var(--slate)); }
    .node .surface { fill: #fff; stroke: color-mix(in srgb, currentColor 32%, var(--line)); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
    .node .accent { fill: currentColor; stroke: none; }
    .node text { fill: var(--ink); pointer-events: none; }
    .node .node-label { font-size: 12px; font-weight: 680; }
    .node .node-meta { fill: var(--ink-soft); font-size: 9.5px; }
    .node:hover .surface, .node:focus .surface { stroke: var(--accent); stroke-width: 2; }
    .node:focus { outline: none; }
    .node.is-selected .surface { stroke: var(--accent); stroke-width: 2.6; fill: var(--accent-soft); }
    .node.is-muted { opacity: .14; }
    .system-node .surface { stroke-width: 1.35; }
    .system-node .system-eyebrow { fill: currentColor; font-size: 9.5px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .system-node .system-title { font-size: 15px; font-weight: 720; }
    .system-node .system-description { fill: var(--ink-soft); font-size: 10.5px; }
    .system-node .system-count { fill: var(--ink-soft); font-size: 10px; }
    .tone-blue, .category-entry, .category-editor, .category-ui { --node-color: var(--blue); }
    .tone-teal, .category-state, .category-core { --node-color: var(--teal); }
    .tone-amber, .category-blocks, .category-design { --node-color: var(--amber); }
    .tone-violet, .category-export { --node-color: var(--violet); }
    .tone-rose, .category-softengine { --node-color: var(--rose); }
    .tone-slate, .category-tests, .category-config, .category-demos, .category-other, .category-external { --node-color: var(--slate); }
    .category-label { fill: var(--ink-soft); font-size: 11px; font-weight: 720; letter-spacing: .06em; text-transform: uppercase; }
    .flow-stage { display: none; height: 100%; overflow: auto; padding: 72px 20px 30px; }
    .flow-stage.active { display: block; }
    .flow-summary { max-width: 760px; margin: 0 auto 24px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.9); box-shadow: var(--shadow-sm); }
    .flow-summary strong { display: block; font-size: 14px; }
    .flow-summary span { display: block; margin-top: 4px; color: var(--ink-soft); font-size: 12px; }
    .flow-track { display: flex; align-items: stretch; justify-content: center; gap: 38px; min-width: max-content; padding: 24px; }
    .flow-step { position: relative; width: 210px; min-height: 170px; padding: 18px; border: 1px solid var(--line-strong); border-radius: 12px; background: #fff; box-shadow: var(--shadow-sm); cursor: pointer; text-align: left; }
    .flow-step:hover, .flow-step.active { border-color: var(--accent); box-shadow: var(--shadow-lg); transform: translateY(-2px); }
    .flow-step::after { content: ''; position: absolute; left: calc(100% + 1px); top: 50%; width: 38px; border-top: 2px solid #9aa6b7; }
    .flow-step::before { content: ''; position: absolute; left: calc(100% + 31px); top: calc(50% - 4px); width: 8px; height: 8px; border-top: 2px solid #9aa6b7; border-right: 2px solid #9aa6b7; transform: rotate(45deg); }
    .flow-step:last-child::after, .flow-step:last-child::before { display: none; }
    .step-number { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 750; }
    .flow-step h3 { margin: 15px 0 7px; font-size: 14px; }
    .flow-step p { margin: 0; color: var(--ink-soft); font-size: 11px; line-height: 1.5; }
    .flow-step small { display: block; margin-top: 13px; color: var(--ink-faint); font-size: 9.5px; }
    .file-stage { display: none; height: 100%; padding: 66px 14px 14px; overflow: hidden; }
    .file-stage.active { display: grid; grid-template-columns: minmax(240px, 31%) minmax(0, 1fr); gap: 12px; }
    .file-list-panel, .dependency-panel { min-height: 0; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.94); box-shadow: var(--shadow-sm); }
    .file-list-panel { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
    .file-list-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 11px; border-bottom: 1px solid var(--line); }
    .file-list-head strong { font-size: 12px; }
    .file-list-head span { color: var(--ink-soft); font-size: 10px; }
    .file-list { overflow: auto; padding: 5px; }
    .file-row { display: grid; grid-template-columns: 4px minmax(0,1fr) auto; gap: 8px; align-items: center; width: 100%; padding: 7px 8px; border: 0; border-radius: 7px; background: transparent; cursor: pointer; text-align: left; }
    .file-row:hover { background: var(--panel-subtle); }
    .file-row.active { background: var(--accent-soft); }
    .file-row-accent { width: 4px; height: 26px; border-radius: 3px; background: var(--row-color, var(--slate)); }
    .file-row-main { min-width: 0; }
    .file-row-main strong { display: block; overflow: hidden; color: var(--ink); font: 11px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .file-row-main span { display: block; overflow: hidden; margin-top: 2px; color: var(--ink-faint); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .file-row-kind { color: var(--ink-faint); font-size: 9px; }
    .dependency-panel { overflow: auto; padding: 14px; }
    .dependency-empty { display: grid; place-items: center; height: 100%; min-height: 280px; padding: 30px; color: var(--ink-soft); text-align: center; }
    .dependency-empty strong { display: block; margin-bottom: 5px; color: var(--ink); font-size: 14px; }
    .dependency-layout { display: grid; grid-template-columns: minmax(150px,1fr) minmax(180px,.8fr) minmax(150px,1fr); gap: 14px; align-items: start; }
    .dependency-column h3 { margin: 0 0 8px; color: var(--ink-soft); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
    .dependency-chip { display: block; width: 100%; margin-bottom: 6px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 7px; background: #fff; cursor: pointer; color: var(--ink); text-align: left; font: 10px/1.35 ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
    .dependency-chip:hover { border-color: var(--accent-line); background: var(--accent-soft); }
    .dependency-center { position: sticky; top: 0; padding: 14px; border: 2px solid var(--accent-line); border-radius: 10px; background: var(--accent-soft); text-align: center; }
    .dependency-center strong { display: block; font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
    .dependency-center span { display: block; margin-top: 7px; color: var(--ink-soft); font-size: 10px; }
    @media (max-width: 900px) {
      .app-header { flex-wrap: wrap; gap: 10px; }
      .brand { flex: 1; }
      .header-meta { display: none; }
      .view-tabs { order: 3; width: 100%; }
      .view-tab { flex: 1; }
      .toolbar-group { flex-wrap: wrap; }
      .workspace, .workspace.details-open { grid-template-columns: 1fr; height: auto; }
      .stage { height: 68vh; min-height: 520px; }
      .details { display: none; border-left: 0; border-top: 1px solid var(--line); }
      .details-open .details { display: block; }
      .file-stage.active { grid-template-columns: 1fr; overflow: auto; }
      .file-list-panel { max-height: 44vh; }
      .dependency-panel { min-height: 320px; }
      .dependency-layout { grid-template-columns: 1fr; }
      .dependency-center { position: static; order: -1; }
    }
    @media (max-width: 580px) {
      .app-header, .toolbar { padding-left: 12px; padding-right: 12px; }
      .control { min-width: 100%; }
      .tool-buttons { margin-left: 0; }
      .stage-title { left: 15px; right: 15px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div><h1>Systemkarte</h1><p>Aufbau Editor · Architektur und Abhängigkeiten</p></div>
    </div>
    <nav class="view-tabs" aria-label="Ansicht">
      <button class="view-tab active" data-view="architecture" type="button">Architektur</button>
      <button class="view-tab" data-view="flows" type="button">Abläufe</button>
      <button class="view-tab" data-view="files" type="button">Dateien</button>
    </nav>
    <div class="header-meta">
      <div class="header-meta-text"><strong id="header-counts"></strong><span id="header-date"></span></div>
      <button class="freshness-button" id="freshness-button" type="button" title="Prüft die erzeugte Karte gegen den aktuellen Quellcode">Aktualität prüfen</button>
    </div>
  </header>

  <section class="toolbar" aria-label="Ansicht einstellen">
    <div class="toolbar-group active" data-toolbar="architecture">
      <label class="check"><input id="support-edges" type="checkbox"> Abhängigkeiten zu Prüfungen und Werkzeugen zeigen</label>
      <div class="tool-buttons"><button class="tool-button" data-action="fit" type="button">Einpassen</button></div>
    </div>
    <div class="toolbar-group" data-toolbar="flows">
      <label class="control grow"><span class="control-label">Technischer Ablauf</span><select id="flow-select"></select></label>
    </div>
    <div class="toolbar-group" data-toolbar="files">
      <label class="control"><span class="control-label">Bereich</span><select id="category"><option value="all">Alle Bereiche</option></select></label>
      <label class="control grow"><span class="control-label">Datei suchen</span><input id="search" type="search" placeholder="z. B. exportMask oder relations"></label>
      <button class="tool-button" id="file-back" type="button" hidden>Bereich anzeigen</button>
      <div class="tool-buttons"><button class="tool-button" data-action="fit" type="button">Einpassen</button></div>
    </div>
  </section>

  <main class="workspace">
    <section class="stage" aria-label="Systemdiagramm">
      <div class="stage-title"><h2 id="stage-heading">Architektur</h2><p id="stage-description">Systemgrenzen und ihre tatsächlichen, aus den Datei-Imports zusammengefassten Abhängigkeiten.</p></div>
      <svg id="graph" role="img" aria-labelledby="graph-title graph-description">
        <title id="graph-title">Architektur und Dateiabhängigkeiten des Aufbau Editors</title>
        <desc id="graph-description">Ein Pfeil bedeutet: Der Bereich oder die Datei am Anfang benutzt das Ziel an der Pfeilspitze.</desc>
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8290a4"></path></marker>
          <marker id="arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"></path></marker>
        </defs>
        <g id="scene"></g>
      </svg>
      <div id="flow-stage" class="flow-stage"></div>
      <div id="file-stage" class="file-stage"></div>
      <div class="canvas-hint" id="canvas-hint">Knoten auswählen · ziehen zum Verschieben · Mausrad zum Zoomen</div>
    </section>
    <aside class="details" aria-live="polite"><button class="details-close" id="details-close" type="button" aria-label="Details schließen">×</button><div class="details-inner" id="details"></div></aside>
  </main>

    svg.addEventListener('pointerdown', function (event) { if (event.target.closest && event.target.closest('.node')) return; dragging = { x: event.clientX, y: event.clientY, cameraX: camera.x, cameraY: camera.y }; svg.setPointerCapture(event.pointerId); svg.classList.add('grabbing'); });
    svg.addEventListener('pointermove', function (event) { if (!dragging) return; camera.x = dragging.cameraX - (event.clientX - dragging.x) * camera.width / svg.clientWidth; camera.y = dragging.cameraY - (event.clientY - dragging.y) * camera.height / svg.clientHeight; setViewBox(); });
    svg.addEventListener('pointerup', function () { dragging = null; svg.classList.remove('grabbing'); });
    svg.addEventListener('click', function () { selected = null; document.querySelectorAll('.is-muted, .is-selected, .is-related').forEach(function (element) { element.classList.remove('is-muted', 'is-selected', 'is-related'); }); document.querySelectorAll('.edge').forEach(function (edge) { edge.setAttribute('marker-end', 'url(#arrow)'); }); document.querySelectorAll('.edge-count').forEach(function (badge) { badge.style.opacity = ''; }); closeDetails(); });
    window.addEventListener('resize', fitGraph);
    setView('architecture');
  </script>
</body>
